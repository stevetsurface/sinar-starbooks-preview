<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sinar Starbooks — About</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFAFC}
a{color:#5B2A86;text-decoration:none}a:hover{color:#3E1A5E}
</style>

</head>
<body>
<template id="dc-template">

<div style="font-family: Figtree, system-ui, sans-serif; color: #1E1A24; background: #FBFAFC; min-height: 100vh">

  <!-- Header -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #ECE6F1">
    <div style="max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="reseller-home.html" style="display: flex; align-items: center; gap: 10px" aria-label="{{t.homeAria}}">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" rx="5" fill="#A463BF"></rect><rect x="7" y="7" width="26" height="26" rx="5" fill="#A463BF" transform="rotate(45 20 20)"></rect></svg>
        <span style="display: flex; flex-direction: column; line-height: 1">
          <span style="font-family: 'Avenir Next', Avenir, 'Nunito Sans', 'Century Gothic', sans-serif; font-weight: 400; font-size: 23px; color: #2B2B2B; letter-spacing: 1px">STAR BOOKS</span>
          <span style="font-size: 10px; letter-spacing: 2.5px; color: #2B2B2B; font-family: 'Avenir Next', Avenir, 'Nunito Sans', 'Century Gothic', sans-serif; font-weight: 500; margin-top: 4px">AND GIFTS · RESELLER</span>
        </span>
      </a>
      <nav aria-label="{{t.navAria}}" style="display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 14px; font-weight: 600">
        <a href="catalog.html" style="color: #1E1A24; padding: 12px 0">{{t.navCatalog}}</a>
        <a href="become-a-reseller.html" style="color: #1E1A24; padding: 12px 0">{{t.navPartnership}}</a>
        <a href="about.html" style="color: #5B2A86; padding: 12px 0">{{t.navAbout}}</a>
        <a href="about.html#faq" style="color: #1E1A24; padding: 12px 0">{{t.navContact}}</a>
      </nav>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
        <div role="group" aria-label="Language / Bahasa" style="display: flex; gap: 4px; background: #F1EBF6; padding: 4px; border-radius: 999px">
          <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
            <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
              <button type="button" aria-pressed="true" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
            <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
              <button type="button" aria-pressed="false" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #4A4252; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
          </sc-for>
        </div>
        <a href="checkout.html" style="display: flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; background: #5B2A86; color: #FFFFFF; font-weight: 600; font-size: 14px">{{t.cart}}</a>
      </div>
    </div>
  </header>

  <!-- Intro -->
  <section style="background: #2A1640; color: #FFFFFF">
    <div style="max-width: 1240px; margin: 0 auto; padding: 96px 24px 88px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-end">
      <div style="flex: 2 1 560px; display: flex; flex-direction: column; gap: 20px">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #F2B33D">{{t.eyebrow}}</span>
        <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 64px; line-height: 1.02; letter-spacing: -1px">{{t.heroTitle}}</h1>
      </div>
      <p style="flex: 1 1 320px; margin: 0; font-size: 18px; line-height: 1.65; color: #D4C6E2">{{t.heroSub}}</p>
    </div>
  </section>

  <!-- Timeline -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 88px 24px">
    <h2 style="margin: 0 0 48px; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 40px; color: #2A1640">{{t.journeyTitle}}</h2>
    <ol style="list-style: none; margin: 0; padding: 0; position: relative; display: flex; flex-direction: column; gap: 0">
      <sc-for list="{{milestones}}" as="m" hint-placeholder-count="5">
        <li style="display: flex; flex-wrap: wrap; gap: 16px 40px; padding: 0 0 48px; position: relative">
          <div style="flex: 0 0 160px; display: flex; flex-direction: column; gap: 6px">
            <span style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 44px; line-height: 1; color: {{m.yearColor}}">{{m.year}}</span>
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #6E6478">{{m.kind}}</span>
          </div>
          <div style="flex: 0 0 24px; display: flex; flex-direction: column; align-items: center; align-self: stretch">
            <span style="width: 18px; height: 18px; border-radius: 50%; background: {{m.dot}}; border: 4px solid #F1EBF6; margin-top: 10px"></span>
            <span style="flex: 1; width: 2px; background: #E2D7EC; margin-top: 6px"></span>
          </div>
          <div style="flex: 1 1 420px; background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 24px 28px; display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 20px; font-weight: 600; color: #2A1640">{{m.title}}</span>
            <span style="font-size: 15px; line-height: 1.6; color: #4A4252">{{m.body}}</span>
          </div>
        </li>
      </sc-for>
    </ol>
  </section>

  <!-- Publisher relationships -->
  <section id="publishers" style="background: #F1EBF6">
    <div style="max-width: 1240px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; gap: 32px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: flex-end">
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 40px; color: #2A1640">{{t.pubTitle}}</h2>
        <span style="font-size: 15px; color: #6E6478">{{t.pubSub}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
        <sc-for list="{{publishers}}" as="p" hint-placeholder-count="6">
          <div style="background: #FFFFFF; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
            <span style="height: 64px; display: flex; align-items: center">
              <img src="{{p.logo}}" alt="{{p.name}}" style="max-width: 100%; max-height: {{p.h}}; object-fit: contain">
            </span>
            <span style="font-size: 14px; color: #5B2A86; font-weight: 600">{{t.partnerSince}} {{p.since}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <!-- Mission -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
    <span style="flex: 1 1 200px; font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #5B2A86; padding-top: 14px">{{t.missionLabel}}</span>
    <p style="flex: 4 1 600px; margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 40px; line-height: 1.25; color: #2A1640">{{t.missionBody}}</p>
  </section>

  <!-- FAQ -->
  <section id="faq" style="max-width: 1240px; margin: 0 auto; padding: 0 24px 96px; display: flex; flex-wrap: wrap; gap: 40px">
    <h2 style="flex: 1 1 280px; margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 36px; color: #2A1640">{{t.faqTitle}}</h2>
    <div style="flex: 2 1 520px; display: flex; flex-direction: column; gap: 12px">
      <details open style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 16px; padding: 20px 24px">
        <summary style="font-weight: 600; font-size: 16px; cursor: pointer">{{t.q1}}</summary>
        <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: #4A4252">{{t.a1}}</p>
      </details>
      <details style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 16px; padding: 20px 24px">
        <summary style="font-weight: 600; font-size: 16px; cursor: pointer">{{t.q2}}</summary>
        <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: #4A4252">{{t.a2}}</p>
      </details>
      <details style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 16px; padding: 20px 24px">
        <summary style="font-weight: 600; font-size: 16px; cursor: pointer">{{t.q3}}</summary>
        <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: #4A4252">{{t.a3}}</p>
      </details>
      <details style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 16px; padding: 20px 24px">
        <summary style="font-weight: 600; font-size: 16px; cursor: pointer">{{t.q4}}</summary>
        <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: #4A4252">{{t.a4}}</p>
      </details>
    </div>
  </section>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"startLanguage":{"editor":"enum","options":["id","en"],"default":"id"},"$preview":{"width":1440,"height":2600}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.startLanguage || 'id';
    const L = (id, en) => (lang === 'id' ? id : en);
    const t = {
      homeAria: L('Beranda Sinar Starbooks', 'Sinar Starbooks home'),
      navAria: L('Utama', 'Main'),
      navCatalog: L('Katalog', 'Catalog'),
      navPartnership: L('Kemitraan', 'Partnership'),
      navAbout: L('Tentang Kami', 'About'),
      navContact: L('Kontak', 'Contact'),
      cart: L('Keranjang · 24 item', 'Cart · 24 items'),
      eyebrow: L('TENTANG SINAR STARBOOKS', 'ABOUT SINAR STARBOOKS'),
      heroTitle: L('Menghadirkan buku dari seluruh dunia ke Indonesia, sejak 2000.', "Bringing the world's books to Indonesia, since 2000."),
      heroSub: L('[Dua atau tiga kalimat tentang Sinar Starbooks saat ini — misalnya apa yang Anda impor, siapa yang Anda layani, dan di mana Anda berlokasi.]', '[Two or three sentences on who Sinar Starbooks is today — e.g. what you import, who you serve, where you are based.]'),
      journeyTitle: L('Perjalanan kami', 'Our journey'),
      pubTitle: L('Kerja sama langsung dengan penerbit', 'Direct publisher relationships'),
      pubSub: L('Tahun dimulainya setiap kemitraan', 'Year each partnership began'),
      partnerSince: L('Mitra sejak', 'Partner since'),
      missionLabel: L('MISI KAMI', 'OUR MISSION'),
      missionBody: L('[Pernyataan misi — satu atau dua kalimat dari tim Sinar Star.]', '[Mission statement — one or two sentences from the Sinar Star team.]'),
      faqTitle: L('FAQ perusahaan', 'Company FAQs'),
      q1: L('Di mana lokasi Anda?', 'Where are you based?'),
      a1: L('[Lokasi kantor dan gudang]', '[Office and warehouse location]'),
      q2: L('Apakah Anda menjual ke pelanggan perorangan?', 'Do you sell to individual customers?'),
      a2: L('[Jawaban]', '[Answer]'),
      q3: L('Bisakah Anda mencarikan judul yang tidak ada di katalog?', "Can you source a title that isn't in the catalog?"),
      a3: L('[Proses pemesanan khusus]', '[Special order process]'),
      q4: L('Di mana saya bisa menemukan toko Anda?', 'Where can I find your stores?'),
      a4: L('[Lokasi toko ritel, jika ada]', '[Retail locations, if any]')
    };
    const yr = L('[Tahun]', '[Year]');
    const ms = [
      { year: '2000', kind: L('BERDIRI', 'FOUNDED'), title: L('Sinar Starbooks didirikan', 'Sinar Starbooks opens'), body: L('[Bagaimana dan di mana perusahaan dimulai, serta siapa pendirinya.]', '[How and where the company started, and who founded it.]') },
      { year: yr, kind: L('PENERBIT', 'PUBLISHERS'), title: L('Kemitraan langsung pertama dengan penerbit', 'First direct publisher partnership'), body: L('[Penerbit mana, dan apa artinya bagi katalog.]', '[Which publisher, and what it meant for the catalog.]') },
      { year: yr, kind: L('PERTUMBUHAN', 'GROWTH'), title: L('[Pencapaian — misalnya gudang baru atau jangkauan distribusi]', '[Milestone — e.g. new warehouse or distribution reach]'), body: L('[Deskripsi singkat.]', '[Short description.]') },
      { year: yr, kind: L('HADIAH', 'GIFTS'), title: L('Hadiah & alat tulis bergabung dalam koleksi', 'Gifts & stationery join the range'), body: L('[Kapan IF, Kikkerland, dan merek hadiah lainnya ditambahkan.]', '[When IF, Kikkerland and other gift brands were added.]') },
      { year: '2026', kind: L('SAAT INI', 'TODAY'), title: L('Situs web reseller diluncurkan', 'Reseller website launches'), body: L('Reseller di seluruh Indonesia kini dapat menjelajahi katalog lengkap, melihat harga mereka, dan memesan secara online dengan purchase order.', 'Resellers across Indonesia can now browse the full catalog, see their prices and order online with a purchase order.') }
    ];
    const last = ms.length - 1;
    const langs = [{ id: 'id', label: 'ID' }, { id: 'en', label: 'EN' }].map((x) => ({
      label: x.label, on: lang === x.id, off: lang !== x.id, pick: () => this.setState({ lang: x.id })
    }));
    return {
      t,
      langs,
      milestones: ms.map((m, i) => ({ ...m, dot: i === last ? '#F2B33D' : '#5B2A86', yearColor: i === last ? '#B07A12' : '#5B2A86' })),
      publishers: [
        { name: 'Penguin Random House', logo: 'assets/logos/penguin-random-house.svg', h: '56px' },
        { name: 'HarperCollins', logo: 'assets/logos/harpercollins.png', h: '30px' },
        { name: 'Hachette Book Group', logo: 'assets/logos/hachette.svg', h: '42px' },
        { name: 'Simon & Schuster', logo: 'assets/logos/simon-schuster.svg', h: '24px' },
        { name: 'Macmillan', logo: 'assets/logos/macmillan.jpg', h: '64px' },
        { name: 'Bloomsbury', logo: 'assets/logos/bloomsbury.svg', h: '20px' },
        { name: 'Scholastic', logo: 'assets/logos/scholastic.svg', h: '30px' }
      ].map((p) => Object.assign({ since: yr }, p))
    };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
