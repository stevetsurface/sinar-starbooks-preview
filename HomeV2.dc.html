<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sinar Starbooks — Home v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFAFC}
a{color:#5B2A86;text-decoration:none}a:hover{color:#3E1A5E}
</style>

</head>
<body>
<template id="dc-template">

<div style="font-family: Figtree, system-ui, sans-serif; color: #1E1A24; background: #FBFAFC; min-height: 100vh; position: relative">

  <!-- Promo bar -->
  <div style="background: #5B2A86; color: #FFFFFF; font-size: 14px; font-weight: 600; text-align: center; padding: 10px 16px">{{t.promo}}</div>

  <!-- Utility bar -->
  <div style="background: #F4F0F8; font-size: 13px; color: #4A4252">
    <div style="max-width: 1240px; margin: 0 auto; padding: 8px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: center">
      <div style="display: flex; gap: 20px; flex-wrap: wrap">
        <a href="#" style="color: #4A4252">Rp · IDR ▾</a>
        <div role="group" aria-label="Language / Bahasa" style="display: flex; gap: 4px; background: #F1EBF6; padding: 4px; border-radius: 999px">
          <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
            <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
              <button type="button" aria-pressed="true" onClick="{{l.pick}}" style="height: 32px; min-width: 44px; padding: 0 12px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
            <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
              <button type="button" aria-pressed="false" onClick="{{l.pick}}" style="height: 32px; min-width: 44px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; color: #4A4252; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; gap: 20px; flex-wrap: wrap">
        <a href="#" style="color: #4A4252">{{t.phone}}</a>
        <a href="#" style="color: #4A4252">{{t.myAccountMenu}}</a>
        <a href="#" style="color: #4A4252">{{t.wishCount}}</a>
        <a href="Checkout.dc.html" style="color: #4A4252">{{t.checkout}}</a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #ECE6F1">
    <div style="max-width: 1240px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center">
      <a href="HomeV2.dc.html" style="display: flex; align-items: center; gap: 10px" aria-label="{{t.ariaHome}}">
        <svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" rx="5" fill="#A463BF"></rect><rect x="7" y="7" width="26" height="26" rx="5" fill="#A463BF" transform="rotate(45 20 20)"></rect></svg>
        <span style="display: flex; flex-direction: column; line-height: 1">
          <span style="font-family: 'Avenir Next', Avenir, 'Nunito Sans', 'Century Gothic', sans-serif; font-weight: 400; font-size: 25px; color: #2B2B2B; letter-spacing: 1px">STAR BOOKS</span>
          <span style="font-size: 11px; letter-spacing: 2.5px; color: #2B2B2B; font-family: 'Avenir Next', Avenir, 'Nunito Sans', 'Century Gothic', sans-serif; font-weight: 500; margin-top: 4px">AND GIFTS</span>
        </span>
      </a>
      <form style="flex: 1 1 320px; display: flex; align-items: center; gap: 10px; background: #F4F0F8; border-radius: 999px; padding: 0 8px 0 18px; height: 48px" role="search">
        <label for="qv2" style="position: absolute; left: -9999px">{{t.searchLabel}}</label>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6478" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="qv2" type="search" placeholder="{{t.searchPh}}" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 15px; outline: none; color: #1E1A24">
      </form>
      <a href="Checkout.dc.html" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 999px; background: #5B2A86; color: #FFFFFF; font-weight: 600; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 4h2l2.4 11h11L21 8H6.2"></path><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle></svg>
        {{t.cart}}
      </a>
    </div>
    <nav aria-label="{{t.ariaMain}}" style="max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 36px; font-size: 15px; font-weight: 700">
      <a href="Catalog.dc.html" style="color: #1E1A24; padding: 12px 0 16px">{{t.navBooks}}</a>
      <a href="Catalog.dc.html" style="color: #1E1A24; padding: 12px 0 16px">{{t.navNonBooks}}</a>
      <a href="#" style="color: #1E1A24; padding: 12px 0 16px">{{t.navPublisher}}</a>
      <a href="Reseller.dc.html" style="color: #5B2A86; padding: 12px 0 16px">{{t.navReseller}}</a>
      <a href="About.dc.html" style="color: #1E1A24; padding: 12px 0 16px">{{t.navAbout}}</a>
      <a href="#" style="color: #1E1A24; padding: 12px 0 16px">{{t.navContact}}</a>
    </nav>
  </header>

  <!-- Order-now banner -->
  <section style="background: #6B2F9A; color: #FFFFFF; overflow: hidden">
    <div style="max-width: 1240px; margin: 0 auto; padding: 56px 24px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center; justify-content: space-between">
      <!-- phone mockup -->
      <div style="flex: 0 0 200px; height: 300px; border-radius: 32px; background: #1E1A24; padding: 10px; box-sizing: border-box; transform: rotate(-8deg); box-shadow: 0 30px 60px rgba(0,0,0,0.3)">
        <div style="height: 100%; border-radius: 24px; background: #ECE5DD; padding: 16px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
          <div style="align-self: flex-start; max-width: 80%; background: #FFFFFF; border-radius: 10px; padding: 8px 10px; font-size: 10px; color: #1E1A24">{{t.chat1}}</div>
          <div style="align-self: flex-end; max-width: 80%; background: #D9FDD3; border-radius: 10px; padding: 8px 10px; font-size: 10px; color: #1E1A24">{{t.chat2}}</div>
          <div style="align-self: flex-start; max-width: 80%; background: #FFFFFF; border-radius: 10px; padding: 8px 10px; font-size: 10px; color: #1E1A24">{{t.chat3}}</div>
          <div style="align-self: flex-end; max-width: 80%; background: #D9FDD3; border-radius: 10px; padding: 8px 10px; font-size: 10px; color: #1E1A24">{{t.chat4}}</div>
        </div>
      </div>
      <div style="flex: 1 1 420px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #F2B33D">{{t.bannerEyebrow}}</span>
        <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 72px; line-height: 1; letter-spacing: -1px">{{t.bannerTitle}}</h1>
        <p style="margin: 0; font-size: 18px; line-height: 1.55; color: #E6D8F2; max-width: 440px">{{t.bannerBody}}</p>
        <a href="#" style="display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 30px; border-radius: 999px; background: #FFFFFF; color: #5B2A86; font-weight: 700; font-size: 17px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"></path></svg>
          {{t.bannerCta}}
        </a>
      </div>
      <div style="flex: 0 0 200px; height: 290px; border-radius: 4px 12px 12px 4px; background: #E9EEF2; box-shadow: 0 30px 60px rgba(0,0,0,0.3); padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; transform: rotate(4deg)">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #2E5F8A">CHARLIE DONLEA</span>
        <span style="font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 34px; line-height: 1; color: #2E5F8A">The Girl Who Was Taken</span>
      </div>
    </div>
  </section>

  <!-- Featured products with tabs -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 72px 24px 24px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 40px; color: #2A1640">{{t.featuredTitle}}</h2>
      <div role="tablist" aria-label="{{t.ariaFeatured}}" style="display: flex; gap: 6px; background: #F1EBF6; padding: 6px; border-radius: 999px">
        <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
          <sc-if value="{{tb.on}}" hint-placeholder-val="{{false}}">
            <button type="button" role="tab" aria-selected="true" onClick="{{tb.pick}}" style="height: 44px; padding: 0 20px; border-radius: 999px; border: 0; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: #5B2A86; color: #FFFFFF">{{tb.label}}</button>
          </sc-if>
          <sc-if value="{{tb.off}}" hint-placeholder-val="{{true}}">
            <button type="button" role="tab" aria-selected="false" onClick="{{tb.pick}}" style="height: 44px; padding: 0 20px; border-radius: 999px; border: 0; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: transparent; color: #4A4252">{{tb.label}}</button>
          </sc-if>
        </sc-for>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 20px">
      <sc-for list="{{books}}" as="b" hint-placeholder-count="5">
        <article style="display: flex; flex-direction: column; gap: 12px">
          <a href="Product.dc.html" style="display: block; background: #F4F0F8; border-radius: 18px; padding: 24px 0">
            <div style="width: 130px; height: 190px; margin: 0 auto; border-radius: 3px 8px 8px 3px; background: {{b.cover}}; box-shadow: 0 14px 24px rgba(42,22,64,0.18); padding: 14px; box-sizing: border-box; display: flex; align-items: flex-end">
              <span style="font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 16px; line-height: 1.1; color: {{b.ink}}">{{b.title}}</span>
            </div>
          </a>
          <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
            <span style="font-size: 13px; color: #6E6478">{{b.author}}</span>
            <a href="Product.dc.html" style="font-weight: 600; font-size: 16px; line-height: 1.3; color: #1E1A24">{{b.title}}</a>
            <span style="font-size: 17px; font-weight: 700; color: #2A1640; margin-top: 2px">{{b.price}}</span>
            <span style="font-size: 12px; color: #5B2A86; font-weight: 600">{{b.note}}</span>
          </div>
        </article>
      </sc-for>
    </div>
  </section>

  <!-- Publishers -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 64px 24px 24px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
      <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 36px; color: #2A1640">{{t.publishersTitle}}</h2>
      <a href="#" style="font-weight: 600; font-size: 15px">{{t.allPublishers}}</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px">
      <sc-for list="{{pubLogos}}" as="lg" hint-placeholder-count="7">
        <a href="#" aria-label="{{lg.name}}" style="height: 110px; border-radius: 18px; background: #FFFFFF; border: 1px solid #ECE6F1; display: flex; align-items: center; justify-content: center; padding: 22px; box-sizing: border-box; overflow: hidden">
          <img src="{{lg.src}}" alt="{{lg.name}}" style="max-width: 100%; max-height: {{lg.h}}; object-fit: contain">
        </a>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 8px">
      <span style="font-size: 13px; font-weight: 800; letter-spacing: 1.5px; color: #6E6478">{{t.giftBrands}}</span>
      <sc-for list="{{giftLogos}}" as="lg" hint-placeholder-count="2">
        <span style="height: 64px; width: 170px; border-radius: 14px; background: #FFFFFF; border: 1px solid #ECE6F1; display: flex; align-items: center; justify-content: center; padding: 12px; box-sizing: border-box">
          <img src="{{lg.src}}" alt="{{lg.name}}" style="max-width: 100%; max-height: 40px; object-fit: contain">
        </span>
      </sc-for>
    </div>
  </section>

  <!-- Partners -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 48px 24px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="background: #F1EBF6; border-radius: 28px; padding: 40px; display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: center">
      <div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 32px; color: #2A1640">{{t.partnersTitle}}</h2>
        <span style="font-size: 15px; line-height: 1.5; color: #4A4252">{{t.partnersBody}}</span>
      </div>
      <div style="flex: 2 1 560px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">
        <sc-for list="{{retailLogos}}" as="lg" hint-placeholder-count="4">
          <div style="height: 90px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
            <img src="{{lg.src}}" alt="{{lg.name}}" style="max-width: 100%; max-height: 48px; object-fit: contain">
          </div>
        </sc-for>
      </div>
    </div>
    <!-- Own retail -->
    <a href="#" style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px 40px; background: #1E1A24; border-radius: 28px; padding: 28px 40px; color: #FFFFFF">
      <img src="assets/logos/wonder-bookstore-white.png" alt="Wonder Bookstore" style="width: 120px; height: 120px; object-fit: contain">
      <span style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 8px">
        <span style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px">{{t.wonderTitle}}</span>
        <span style="font-size: 15px; line-height: 1.5; color: #D4C6E2">{{t.wonderBody}}</span>
      </span>
      <span style="display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid #4A3463; font-weight: 700; font-size: 15px">{{t.wonderCta}}</span>
    </a>
  </section>

  <!-- Daftar Reseller -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 48px 24px 24px">
    <a href="Reseller.dc.html" style="display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: center; justify-content: space-between; background: #2A1640; border-radius: 28px; padding: 48px; color: #FFFFFF">
      <div style="display: flex; align-items: center; gap: 24px; flex: 1 1 480px">
        <span style="width: 88px; height: 88px; border-radius: 24px; background: #F2B33D; display: grid; place-items: center; flex: none">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#2A1640" stroke-width="1.6" aria-hidden="true"><path d="M3 21V9l9-6 9 6v12"></path><path d="M9 21v-6h6v6"></path><path d="M3 9h18"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1">Daftar Reseller</span>
          <span style="font-size: 17px; color: #D4C6E2">{{t.resellerBody}}</span>
        </span>
      </div>
      <span style="display: inline-flex; align-items: center; height: 56px; padding: 0 30px; border-radius: 999px; background: #F2B33D; color: #2A1640; font-weight: 700; font-size: 17px">{{t.resellerCta}}</span>
    </a>
  </section>

  <!-- Events & schools -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 64px 24px 24px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 36px; color: #2A1640">{{t.eventsTitle}}</h2>
      <span style="font-size: 15px; color: #6E6478">{{t.eventsSub}}</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
      <sc-for list="{{events}}" as="ev" hint-placeholder-count="6">
        <article style="border-radius: 20px; padding: 24px; background: {{ev.bg}}; display: flex; flex-direction: column; gap: 10px; min-height: 170px; box-sizing: border-box">
          <span style="align-self: flex-start; font-size: 11px; font-weight: 800; letter-spacing: 1.2px; padding: 5px 10px; border-radius: 999px; background: #FFFFFF; color: #5B2A86">{{ev.kind}}</span>
          <span style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; color: #2A1640; line-height: 1.2">{{ev.title}}</span>
          <span style="font-size: 14px; line-height: 1.5; color: #4A4252">{{ev.body}}</span>
          <span style="margin-top: auto; font-size: 13px; font-weight: 700; color: #5B2A86">{{ev.when}}</span>
        </article>
      </sc-for>
    </div>
  </section>

  <!-- Behind the Book · Instagram feed widget -->
  <section style="max-width: 1240px; margin: 0 auto; padding: 64px 24px 96px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
      <div style="display: flex; align-items: center; gap: 16px">
        <span style="width: 64px; height: 64px; border-radius: 50%; padding: 3px; background: #C13584; box-sizing: border-box; flex: none">
          <span style="display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: #FFFFFF; border: 2px solid #FFFFFF; box-sizing: border-box">
            <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" rx="5" fill="#A463BF"></rect><rect x="7" y="7" width="26" height="26" rx="5" fill="#A463BF" transform="rotate(45 20 20)"></rect></svg>
          </span>
        </span>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 36px; color: #2A1640">Behind the Book</h2>
          <span style="font-size: 15px; color: #6E6478"><a href="https://www.instagram.com/sinarstarbooks/" style="font-weight: 700">@sinarstarbooks</a> · {{t.igFollowers}}</span>
        </div>
      </div>
      <a href="https://www.instagram.com/sinarstarbooks/" style="display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 22px; border-radius: 999px; background: #1E1A24; color: #FFFFFF; font-weight: 700; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor"></circle></svg>
        {{t.igFollow}}
      </a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px">
      <sc-for list="{{igPosts}}" as="ig" hint-placeholder-count="8">
        <a href="{{ig.url}}" style="position: relative; display: flex; flex-direction: column; justify-content: flex-end; aspect-ratio: 4 / 5; border-radius: 16px; overflow: hidden; background: {{ig.bg}}; color: #FFFFFF; padding: 18px; box-sizing: border-box">
          <span style="position: absolute; top: 14px; right: 14px; display: flex">
            <sc-if value="{{ig.reel}}" hint-placeholder-val="{{true}}">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-label="Reel" role="img"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M10 9l5 3-5 3z" fill="#FFFFFF"></path></svg>
            </sc-if>
          </span>
          <span style="position: absolute; top: 16px; left: 18px; font-size: 12px; font-weight: 700; letter-spacing: 1px; opacity: 0.85">{{t.igPhoto}}</span>
          <span style="font-size: 16px; font-weight: 600; line-height: 1.35">{{ig.caption}}</span>
          <span style="margin-top: 8px; font-size: 12px; font-weight: 600; opacity: 0.8">{{ig.date}}</span>
        </a>
      </sc-for>
    </div>
    <span style="font-size: 13px; color: #6E6478">{{t.igNote}}</span>
  </section>

  <!-- Footer -->
  <footer style="background: #F4F0F8">
    <div style="max-width: 1240px; margin: 0 auto; padding: 56px 24px 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 32px; font-size: 14px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-weight: 700">{{t.fInfo}}</span>
        <a href="About.dc.html">{{t.fAbout}}</a><a href="Reseller.dc.html">{{t.fProgram}}</a><a href="#">{{t.fTerms}}</a><a href="#">{{t.fFaq}}</a><a href="#">{{t.fDelivery}}</a><a href="#">{{t.fPrivacy}}</a><a href="#">{{t.fTnc}}</a>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-weight: 700">{{t.fService}}</span>
        <a href="#">{{t.fContactUs}}</a><a href="#">{{t.fReturns}}</a><a href="#">{{t.fSitemap}}</a>
      </div>
