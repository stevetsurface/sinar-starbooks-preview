<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sinar Starbooks — World's Best Dad</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFAFC}
a{color:#5B2A86;text-decoration:none}a:hover{color:#3E1A5E}
</style>

</head>
<body>
<template id="dc-template">

<div style="font-family: Figtree, system-ui, sans-serif; color: #1E1A24; background: #FBFAFC; min-height: 100vh">

  <!-- Header -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #ECE6F1">
    <div style="max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center">
      <a href="reseller-home.html" style="display: flex; align-items: center; gap: 10px" aria-label="{{t.homeAria}}">
        <img src="assets/logos/star-books-and-gifts.png" alt="Star Books and Gifts" style="height: 64px; width: auto; display: block"><span style="font-size: 11px; letter-spacing: 2.5px; color: #5B2A86; font-weight: 800; padding-left: 14px; border-left: 1px solid #D9CCE6; line-height: 1.4">PORTAL<br>RESELLER</span>
      </a>
      <form style="flex: 1 1 320px; display: flex; align-items: center; gap: 10px; background: #F4F0F8; border-radius: 999px; padding: 0 8px 0 18px; height: 48px" role="search">
        <label for="q3" style="position: absolute; left: -9999px">{{t.searchLabel}}</label>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6478" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="q3" type="search" placeholder="{{t.searchPh}}" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 15px; outline: none; color: #1E1A24">
      </form>
      <a href="account.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #1E1A24; font-weight: 600; font-size: 14px; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>{{t.myAccountBtn}}</a>
      <div role="group" aria-label="Language / Bahasa" style="display: flex; gap: 4px; background: #F1EBF6; padding: 4px; border-radius: 999px">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
          <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
            <button type="button" aria-pressed="true" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
          </sc-if>
          <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
            <button type="button" aria-pressed="false" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #4A4252; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
          </sc-if>
        </sc-for>
      </div>
      <a href="checkout.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 999px; background: #5B2A86; color: #FFFFFF; font-weight: 600; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 4h2l2.4 11h11L21 8H6.2"></path><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle></svg>
        {{t.cartLabel}}
      </a>
    </div>
    <nav aria-label="{{t.nvAria}}" style="max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 14px; font-weight: 700">
      <a href="catalog.html" style="color: #5B2A86; padding: 12px 0 14px; border-bottom: 3px solid #5B2A86">{{t.nvBooks}}</a>
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvNonBooks}}</a>
      <a href="about.html#publishers" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvPub}}</a>
      <a href="become-a-reseller.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvReseller}}</a>
      <a href="about.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvAbout}}</a>
      <a href="faq.html#account" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvContact}}</a>
    </nav>
  </header>

  <div style="max-width: 1240px; margin: 0 auto; padding: 28px 24px 80px; display: flex; flex-direction: column; gap: 56px">
    <nav aria-label="{{t.breadcrumbAria}}" style="font-size: 14px; color: #6E6478; display: flex; gap: 8px; margin-bottom: -32px">
      <a href="reseller-home.html">{{t.crumbHome}}</a><span aria-hidden="true">/</span><a href="catalog.html">{{t.crumbBooks}}</a><span aria-hidden="true">/</span><span>World's Best Dad</span>
    </nav>

    <div style="display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">
      <!-- Gallery -->
      <div style="flex: 1 1 440px; display: flex; flex-direction: column; gap: 16px">
        <div style="background: #F1EBF6; border-radius: 28px; padding: 56px; display: grid; place-items: center">
          <div style="width: 320px; height: 320px; border-radius: 8px; background: #1F3B73; box-shadow: 0 30px 50px rgba(42,22,64,0.25); padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; text-align: center">
            <span style="font-size: 12px; font-weight: 700; color: #1F3B73; background: #F2B33D; padding: 6px 10px; border-radius: 999px">A LOVE POP-UP BOOK</span>
            <span style="font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 52px; line-height: 0.95; color: #F2B33D">World's Best Dad</span>
            <span style="font-size: 14px; color: #FFFFFF">Lynn Giunta</span>
          </div>
        </div>
        <div style="display: flex; gap: 12px">
          <button type="button" aria-label="{{t.viewImage1}}" style="width: 84px; height: 84px; border-radius: 14px; border: 2px solid #5B2A86; background: #1F3B73; cursor: pointer"></button>
          <button type="button" aria-label="{{t.viewImage2}}" style="width: 84px; height: 84px; border-radius: 14px; border: 1px solid #ECE6F1; background: #E07A3F; cursor: pointer"></button>
          <button type="button" aria-label="{{t.viewImage3}}" style="width: 84px; height: 84px; border-radius: 14px; border: 1px solid #ECE6F1; background: #E9A8C4; cursor: pointer"></button>
        </div>
      </div>

      <!-- Buy box -->
      <div style="flex: 1 1 440px; display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #5B2A86">PENGUIN RANDOM HOUSE</span>
          <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 46px; line-height: 1.05; color: #2A1640">World's Best Dad</h1>
          <span style="font-size: 15px; color: #6E6478">{{t.byline}}</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <span style="font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: #DDEBDD; color: #24523A">{{t.inStock}}</span>
          <span style="font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: #F4F0F8; color: #4A4252">ISBN 9798217143238</span>
          <span style="font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: #F4F0F8; color: #4A4252">{{t.ages}}</span>
        </div>

        <div style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px">
            <span style="font-size: 36px; font-weight: 700; color: #2A1640">{{yourPrice}}</span>
            <span style="font-size: 16px; color: #6E6478; text-decoration: line-through">{{retail}}</span>
            <span style="font-size: 13px; font-weight: 700; color: #2A1640; background: #FDE9C4; padding: 5px 10px; border-radius: 999px">{{discountLabel}}</span>
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px">
              <span style="font-size: 14px; font-weight: 700">{{t.volumePricing}}</span>
              <span style="font-size: 12px; color: #6E6478; font-style: italic">{{t.exampleNote}}</span>
            </div>
            <div style="overflow-x: auto; border: 1px solid #ECE6F1; border-radius: 14px">
              <table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 380px">
                <caption style="caption-side: bottom; text-align: left; padding: 10px 14px; font-size: 12px; color: #6E6478; border-top: 1px solid #ECE6F1">{{t.matrixCaption}}</caption>
                <thead>
                  <tr>
                    <th scope="col" style="text-align: left; padding: 10px 14px; font-size: 12px; font-weight: 600; color: #6E6478; border-bottom: 1px solid #ECE6F1">{{t.qtyCol}}</th>
                    <sc-for list="{{tierCols}}" as="c" hint-placeholder-count="3">
                      <sc-if value="{{c.mine}}" hint-placeholder-val="{{false}}">
                        <th scope="col" style="text-align: right; padding: 10px 14px; font-size: 13px; font-weight: 700; color: #2A1640; background: #F7F2FB; border-bottom: 1px solid #ECE6F1; border-left: 2px solid #5B2A86; border-right: 2px solid #5B2A86; border-top: 2px solid #5B2A86">
                          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
                            <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.5px; color: #FFFFFF; background: #5B2A86; padding: 2px 8px; border-radius: 999px">{{t.yourLevel}}</span>
                            <span>{{c.name}}</span>
                          </span>
                        </th>
                      </sc-if>
                      <sc-if value="{{c.other}}" hint-placeholder-val="{{true}}">
                        <th scope="col" style="text-align: right; vertical-align: bottom; padding: 10px 14px; font-size: 13px; font-weight: 600; color: #4A4252; border-bottom: 1px solid #ECE6F1">{{c.name}}</th>
                      </sc-if>
                    </sc-for>
                  </tr>
                </thead>
                <tbody>
                  <sc-for list="{{matrix}}" as="row" hint-placeholder-count="3">
                    <tr>
                      <th scope="row" style="text-align: left; padding: 10px 14px; font-weight: 600; color: #4A4252; border-bottom: 1px solid #F3EFF6; white-space: nowrap">{{row.qty}}</th>
                      <sc-for list="{{row.cells}}" as="cell" hint-placeholder-count="3">
                        <td style="text-align: right; padding: 10px 14px; border-bottom: 1px solid #F3EFF6; background: {{cell.bg}}; color: {{cell.color}}; font-weight: {{cell.weight}}; border-left: {{cell.edge}}; border-right: {{cell.edge}}; white-space: nowrap">
                          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
                            <span>{{cell.price}}</span>
                            <span style="font-size: 11px; font-weight: 500; color: #6E6478">{{cell.off}}</span>
                          </span>
                        </td>
                      </sc-for>
                    </tr>
                  </sc-for>
                </tbody>
              </table>
            </div>
          </div>

          <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
            <div style="display: flex; align-items: center; border: 1px solid #D9CCE6; border-radius: 12px; height: 52px">
              <button type="button" aria-label="{{t.decQty}}" style="width: 48px; height: 50px; border: 0; background: transparent; font-size: 20px; color: #4A4252; cursor: pointer">−</button>
              <label for="pqty" style="position: absolute; left: -9999px">{{t.qtyLabel}}</label>
              <input id="pqty" type="number" value="12" style="width: 56px; border: 0; text-align: center; font: inherit; font-size: 17px; font-weight: 600; outline: none">
              <button type="button" aria-label="{{t.incQty}}" style="width: 48px; height: 50px; border: 0; background: transparent; font-size: 20px; color: #4A4252; cursor: pointer">+</button>
            </div>
            <a href="checkout.html" style="flex: 1 1 200px; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #5B2A86; color: #FFFFFF; font-weight: 600; font-size: 16px">{{t.addToCart}}</a>
            <button type="button" aria-label="{{t.wishlist}}" style="width: 52px; height: 52px; border-radius: 12px; border: 1px solid #D9CCE6; background: #FFFFFF; display: grid; place-items: center; cursor: pointer">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4252" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"></path></svg>
            </button>
          </div>
          <span style="font-size: 13px; color: #6E6478">{{t.orderNote}}</span>
        </div>

        <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4A4252">{{t.description}}</p>
      </div>
    </div>

    <!-- Specification -->
    <section style="display: flex; flex-wrap: wrap; gap: 32px">
      <div style="flex: 1 1 480px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px; color: #2A1640">{{t.bookDetails}}</h2>
        <dl style="margin: 0; background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 8px 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); font-size: 15px">
          <dt style="padding: 14px 0; color: #6E6478; border-bottom: 1px solid #F3EFF6">{{t.dtAuthor}}</dt><dd style="margin: 0; padding: 14px 0; border-bottom: 1px solid #F3EFF6">Isabel Otter</dd>
          <dt style="padding: 14px 0; color: #6E6478; border-bottom: 1px solid #F3EFF6">ISBN-13</dt><dd style="margin: 0; padding: 14px 0; border-bottom: 1px solid #F3EFF6">9798217143238</dd>
          <dt style="padding: 14px 0; color: #6E6478; border-bottom: 1px solid #F3EFF6">{{t.dtPubDate}}</dt><dd style="margin: 0; padding: 14px 0; border-bottom: 1px solid #F3EFF6">{{t.pubDate}}</dd>
          <dt style="padding: 14px 0; color: #6E6478; border-bottom: 1px solid #F3EFF6">{{t.dtPublisher}}</dt><dd style="margin: 0; padding: 14px 0; border-bottom: 1px solid #F3EFF6">Penguin Random House</dd>
          <dt style="padding: 14px 0; color: #6E6478; border-bottom: 1px solid #F3EFF6">{{t.dtBinding}}</dt><dd style="margin: 0; padding: 14px 0; border-bottom: 1px solid #F3EFF6">{{t.binding}}</dd>
          <dt style="padding: 14px 0; color: #6E6478">{{t.dtPages}}</dt><dd style="margin: 0; padding: 14px 0">{{t.pages}}</dd>
        </dl>
      </div>
      <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px; color: #2A1640">{{t.forResellers}}</h2>
        <div style="background: #F1EBF6; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px; font-size: 15px; line-height: 1.5; color: #4A4252">
          <span><strong style="color: #2A1640">{{t.shelfPrice}}</strong> {{retail}}</span>
          <span><strong style="color: #2A1640">{{t.marginLabel}}</strong> {{margin}} {{t.perCopy}}</span>
          <span><strong style="color: #2A1640">{{t.returnsLabel}}</strong> {{t.noReturns}}</span>
          <a href="#" style="font-weight: 600">{{t.downloadSheet}}</a>
        </div>
      </div>
    </section>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"startLanguage":{"editor":"enum","options":["id","en"],"default":"id"},"resellerDiscount":{"editor":"range","min":0,"max":50,"step":1,"unit":"%","default":20,"section":"Pricing"},"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.startLanguage || 'id';
    const L = (id, en) => (lang === 'id' ? id : en);
    const d = this.props.resellerDiscount ?? 20;
    const price = 183308;
    const fmt = (n) => 'Rp ' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const t = {
      nvAria: L('Menu utama', 'Main menu'), nvBooks: L('Buku ▾', 'Books ▾'), nvNonBooks: L('Non Buku ▾', 'Non Books ▾'), nvPub: L('Penerbit ▾', 'Publishers ▾'), nvReseller: L('Untuk Reseller ▾', 'For Resellers ▾'), nvAbout: L('Tentang Kami ▾', 'About Us ▾'), nvContact: L('Kontak', 'Contact'), myAccountBtn: L('Akun Saya', 'My Account'),
      homeAria: L('Beranda Sinar Starbooks', 'Sinar Starbooks home'),
      searchLabel: L('Cari katalog', 'Search catalog'),
      searchPh: L('Cari judul, penulis, ISBN, atau penerbit', 'Search by title, author, ISBN or publisher'),
      cartLabel: L('Keranjang · 24 item', 'Cart · 24 items'),
      navAria: L('Menu utama', 'Main'),
      navCatalog: L('Katalog', 'Catalog'),
      navNew: L('Rilis Baru & Pre-order', 'New Releases & Pre-orders'),
      navPublishers: L('Penerbit', 'Publishers'),
      navPartnership: L('Kemitraan', 'Partnership'),
      navAbout: L('Tentang Kami', 'About'),
      navContact: L('Kontak', 'Contact'),
      breadcrumbAria: L('Navigasi halaman', 'Breadcrumb'),
      crumbHome: L('Beranda', 'Home'),
      crumbBooks: L('Buku', 'Books'),
      viewImage1: L('Lihat gambar 1', 'View image 1'),
      viewImage2: L('Lihat gambar 2', 'View image 2'),
      viewImage3: L('Lihat gambar 3', 'View image 3'),
      byline: L('oleh Isabel Otter · ilustrasi oleh Lynn Giunta', 'by Isabel Otter · illustrated by Lynn Giunta'),
      inStock: L('Stok tersedia · [qty] eksemplar', 'In stock · [qty] available'),
      ages: L('Usia 0–2 tahun', 'Ages 0–2'),
      volumePricing: L('Harga reseller per level', 'Reseller price by level'),
      exampleNote: L('Contoh harga — harga final mengikuti S&K reseller', 'Example prices — final prices follow the reseller T&Cs'),
      matrixCaption: L('Harga per eksemplar, belum termasuk ongkir. Buku bebas PPN.', 'Price per copy, excluding shipping. Books are PPN-exempt.'),
      qtyCol: L('Jumlah', 'Quantity'),
      yourLevel: L('Level Anda', 'Your level'),
      decQty: L('Kurangi jumlah', 'Decrease quantity'),
      qtyLabel: L('Jumlah', 'Quantity'),
      incQty: L('Tambah jumlah', 'Increase quantity'),
      addToCart: L('Tambah 12 ke keranjang', 'Add 12 to cart'),
      wishlist: L('Tambah ke wishlist', 'Add to wish list'),
      orderNote: L('Min. pembelian 3 · Kelipatan 1', 'Minimum order 3 · Sold in multiples of 1'),
      description: L('Rayakan sosok ayah dan segala cara luar biasa mereka memberi inspirasi dan dukungan lewat buku yang menyentuh hati ini. [Deskripsi lengkap dari penerbit]', 'Celebrate fathers and all the wonderful ways they inspire and provide support with this heartfelt book. [Full publisher description]'),
      bookDetails: L('Detail buku', 'Book details'),
      dtAuthor: L('Penulis', 'Author'),
      dtPubDate: L('Tanggal terbit', 'Publication date'),
      pubDate: L('28 April 2026', '28 April 2026'),
      dtPublisher: L('Penerbit', 'Publisher'),
      dtBinding: L('Jenis sampul', 'Binding'),
      binding: L('[Board book / Hardcover]', '[Board book / Hardcover]'),
      dtPages: L('Jumlah halaman', 'Page count'),
      pages: L('[Jumlah halaman]', '[Pages]'),
      forResellers: L('Untuk reseller', 'For resellers'),
      shelfPrice: L('Harga jual yang disarankan:', 'Suggested shelf price:'),
      marginLabel: L('Margin Anda untuk 3–9 eksemplar (Bright Star):', 'Your margin at 3–9 copies (Bright Star):'),
      perCopy: L('per eksemplar', 'per copy'),
      returnsLabel: L('Retur:', 'Returns:'),
      noReturns: L('Barang tidak dapat diretur.', 'Items cannot be returned.'),
      downloadSheet: L('Unduh lembar produk (PDF)', 'Download product sheet (PDF)')
    };
    // OC customer groups Tier 1/2/3 shown as Star / Bright Star / Super Star.
    // Example % off retail per quantity break (oc_product_discount); default d = 20 gives
    // Star 20/22/25, Bright Star 25/27/30, Super Star 35/35/35.
    const myTier = 1; // reseller's own group: Bright Star
    const groups = [
      { name: 'Star', offs: [d, d + 2, d + 5] },
      { name: 'Bright Star', offs: [d + 5, d + 7, d + 10] },
      { name: 'Super Star', offs: [d + 15, d + 15, d + 15] }
    ];
    const breaks = [L('3+ (MOQ)', '3+ (MOQ)'), '10+', '50+'];
    const tierCols = groups.map((g, gi) => ({ name: g.name, mine: gi === myTier, other: gi !== myTier }));
    const matrix = breaks.map((q, ri) => ({
      qty: q,
      cells: groups.map((g, gi) => ({
        price: fmt(price * (1 - g.offs[ri] / 100)),
        off: L('hemat ' + g.offs[ri] + '%', g.offs[ri] + '% off'),
        bg: gi === myTier ? '#F7F2FB' : '#FFFFFF',
        color: gi === myTier ? '#2A1640' : '#4A4252',
        weight: gi === myTier ? '700' : '500',
        edge: gi === myTier ? '2px solid #5B2A86' : '0'
      }))
    }));
    const myOff = groups[myTier].offs[0];
    const discount = myOff + '%';
    const langs = [{ id: 'id', label: 'ID' }, { id: 'en', label: 'EN' }].map((x) => ({
      label: x.label, on: lang === x.id, off: lang !== x.id, pick: () => this.setState({ lang: x.id })
    }));
    return {
      t,
      langs,
      retail: fmt(price),
      yourPrice: fmt(price * (1 - myOff / 100)),
      discount,
      discountLabel: L('Diskon reseller ' + discount, 'Reseller ' + discount + ' off'),
      margin: fmt(price * myOff / 100),
      tierCols,
      matrix
    };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
