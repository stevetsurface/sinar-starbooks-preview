<template id="dc-template">

<div style="font-family: Figtree, system-ui, sans-serif; color: #1E1A24; background: #FBFAFC; min-height: 100vh">

  <!-- Header -->

      </a>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
        <a href="account.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #1E1A24; font-weight: 600; font-size: 14px; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>{{t.myAccountBtn}}</a>
        <div role="group" aria-label="Language / Bahasa" style="display: flex; gap: 4px; background: #F1EBF6; padding: 4px; border-radius: 999px">
          <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
            <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
              <button type="button" aria-pressed="true" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
            <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
              <button type="button" aria-pressed="false" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #4A4252; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
          </sc-for>
        </div>
        <a href="catalog.html" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #D9CCE6; color: #1E1A24; font-weight: 600; font-size: 14px">{{t.catalog}}</a>
        <a href="checkout.html" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; background: #5B2A86; color: #FFFFFF; font-weight: 600; font-size: 14px">{{t.cart}}</a>
      </div>
    </div>
    <nav aria-label="{{t.nvAria}}" style="max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 14px; font-weight: 700">
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvBooks}}</a>
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvNonBooks}}</a>
      <a href="about.html#publishers" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvPub}}</a>
      <a href="become-a-reseller.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvReseller}}</a>
      <a href="about.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvAbout}}</a>
      <a href="coming-soon.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvNews}}</a>
      <a href="faq.html#account" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvContact}}</a>
    </nav>
  </header>

  <div style="max-width: 1240px; margin: 0 auto; padding: 40px 24px 96px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

    <!-- Account menu -->
    <nav aria-label="{{t.accountNav}}" style="flex: 1 1 220px; max-width: 260px; display: flex; flex-direction: column; gap: 4px; background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 12px; box-sizing: border-box">
      <span style="padding: 12px 14px 8px; font-size: 13px; color: #6E6478">{{t.storeName}}</span>
      <sc-for list="{{menu}}" as="m" hint-placeholder-count="6">

        <sc-if value="{{m.inactive}}" hint-placeholder-val="{{true}}">
          <a href="{{m.href}}" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; color: #1E1A24; font-weight: 500; font-size: 15px">{{m.label}}</a>
        </sc-if>
      </sc-for>
      <a href="index.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; color: #6E6478; font-weight: 500; font-size: 15px">{{t.logout}}</a>
    </nav>

    <main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 44px; color: #2A1640">{{t.title}}</h1>
          <span style="font-size: 15px; color: #6E6478">{{t.sub}}</span>
        </div>
        <sc-if value="{{viewing}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{edit}}" style="height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid #5B2A86; background: #FFFFFF; color: #5B2A86; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer">{{t.edit}}</button>
        </sc-if>
        <sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; gap: 8px">
            <button type="button" onClick="{{cancel}}" style="height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #4A4252; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer">{{t.cancel}}</button>
            <button type="button" onClick="{{save}}" style="height: 48px; padding: 0 20px; border-radius: 12px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer">{{t.save}}</button>
          </div>
        </sc-if>

      <sc-if value="{{saved}}" hint-placeholder-val="{{false}}">

      </sc-if>

      <!-- Business -->

        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px">
          <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px; color: #2A1640">{{t.bizTitle}}</h2>
          <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.5px; padding: 6px 10px; border-radius: 999px; background: #DDEBDD; color: #24523A">{{t.verified}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 24px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 600; color: #6E6478">{{t.bizName}}</span>
            <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><input type="text" value="[Nama Toko Buku]" style="height: 46px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px"></sc-if>
            <sc-if value="{{viewing}}" hint-placeholder-val="{{true}}"><span style="font-size: 15px; font-weight: 600; color: #1E1A24">[Nama Toko Buku]</span></sc-if>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 600; color: #6E6478">{{t.bizType}}</span>
            <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><input type="text" value="{{t.bizTypeValue}}" style="height: 46px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px"></sc-if>
            <sc-if value="{{viewing}}" hint-placeholder-val="{{true}}"><span style="font-size: 15px; font-weight: 600; color: #1E1A24">{{t.bizTypeValue}}</span></sc-if>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 600; color: #6E6478">{{t.bizCode}}</span>
            <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><input type="text" value="RS-[0000]" style="height: 46px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px"></sc-if>
            <sc-if value="{{viewing}}" hint-placeholder-val="{{true}}"><span style="font-size: 15px; font-weight: 600; color: #1E1A24">RS-[0000]</span></sc-if>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 600; color: #6E6478">NIB</span>
            <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><input type="text" value="[13 digit]" style="height: 46px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px"></sc-if>
            <sc-if value="{{viewing}}" hint-placeholder-val="{{true}}"><span style="font-size: 15px; font-weight: 600; color: #1E1A24">[13 digit]</span></sc-if>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 600; color: #6E6478">NPWP</span>
            <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><input type="text" value="[00.000.000.0-000.000]" style="height: 46px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px"></sc-if>
            <sc-if value="{{viewing}}" hint-placeholder-val="{{true}}"><span style="font-size: 15px; font-weight: 600; color: #1E1A24">[00.000.000.0-000.000]</span></sc-if>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 600; color: #6E6478">{{t.bizSince}}</span>
            <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><input type="text" value="{{t.bizSinceValue}}" style="height: 46px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px"></sc-if>
            <sc-if value="{{viewing}}" hint-placeholder-val="{{true}}"><span style="font-size: 15px; font-weight: 600; color: #1E1A24">{{t.bizSinceValue}}</span></sc-if>
          </div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <span style="font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 999px; background: #F4F0F8; color: #4A4252">NIB.pdf · {{t.docOk}}</span>
          <span style="font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 999px; background: #F4F0F8; color: #4A4252">NPWP.pdf · {{t.docOk}}</span>
          <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><a href="#" style="font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 999px; border: 1px dashed #B8A6CC; color: #5B2A86">{{t.docUpload}}</a></sc-if>
        </div>
        <span style="font-size: 13px; color: #6E6478">{{t.bizNote}}</span>
      </section>

      <!-- Contact -->
      <section style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 18px">
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px; color: #2A1640">{{t.contactTitle}}</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 24px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 600; color: #6E6478">{{t.picName}}</span>
            <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><input type="text" value="[Nama PIC]" style="height: 46px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px"></sc-if>
            <sc-if value="{{viewing}}" hint-placeholder-val="{{true}}"><span style="font-size: 15px; font-weight: 600; color: #1E1A24">[Nama PIC]</span></sc-if>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 600; color: #6E6478">WhatsApp</span>
            <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><input type="text" value="+62 8[xx]-[xxxx]-[xxxx]" style="height: 46px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px"></sc-if>
            <sc-if value="{{viewing}}" hint-placeholder-val="{{true}}"><span style="font-size: 15px; font-weight: 600; color: #1E1A24">+62 8[xx]-[xxxx]-[xxxx]</span></sc-if>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 600; color: #6E6478">E-mail</span>
            <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><input type="text" value="[email@toko.com]" style="height: 46px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px"></sc-if>
            <sc-if value="{{viewing}}" hint-placeholder-val="{{true}}"><span style="font-size: 15px; font-weight: 600; color: #1E1A24">[email@toko.com]</span></sc-if>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 600; color: #6E6478">{{t.picRole}}</span>
            <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><input type="text" value="{{t.picRoleValue}}" style="height: 46px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px"></sc-if>
            <sc-if value="{{viewing}}" hint-placeholder-val="{{true}}"><span style="font-size: 15px; font-weight: 600; color: #1E1A24">{{t.picRoleValue}}</span></sc-if>
          </div>
        </div>
        <span style="font-size: 13px; color: #6E6478">{{t.contactNote}}</span>
      </section>

      <!-- Addresses -->
      <section style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px">
          <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px; color: #2A1640">{{t.addrTitle}}</h2>
          <a href="#" style="font-weight: 700; font-size: 14px">{{t.addrAdd}}</a>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px">
          <sc-for list="{{addresses}}" as="a" hint-placeholder-count="2">
            <div style="border: 1px solid {{a.border}}; background: {{a.bg}}; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
                <span style="font-weight: 700; font-size: 15px; color: #2A1640">{{a.label}}</span>
                <sc-if value="{{a.isDefault}}" hint-placeholder-val="{{true}}"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.5px; padding: 4px 8px; border-radius: 999px; background: #5B2A86; color: #FFFFFF">{{t.addrDefault}}</span></sc-if>
                <sc-if value="{{a.notDefault}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{a.makeDefault}}" style="font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 999px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #5B2A86; font-family: inherit; cursor: pointer">{{t.addrMakeDefault}}</button></sc-if>
              </div>
              <span style="font-size: 14px; color: #4A4252; line-height: 1.5">{{a.lines}}</span>
              <span style="font-size: 13px; color: #6E6478">{{a.receiver}}</span>
            </div>
          </sc-for>
        </div>
      </section>

      <!-- Preferences -->
      <section style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px; color: #2A1640">{{t.prefTitle}}</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px">
          <sc-for list="{{prefs}}" as="p" hint-placeholder-count="4">
            <button type="button" onClick="{{p.toggle}}" aria-pressed="{{p.pressed}}" style="display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 16px; border-radius: 14px; border: 1px solid {{p.border}}; background: {{p.bg}}; cursor: pointer; font: inherit; color: inherit">
              <span style="width: 22px; height: 22px; border-radius: 6px; border: 2px solid {{p.boxBorder}}; background: {{p.boxBg}}; box-sizing: border-box; flex: none; display: grid; place-items: center; color: #FFFFFF; font-size: 14px; font-weight: 800">{{p.mark}}</span>
              <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 600">{{p.label}}</span><span style="font-size: 13px; color: #6E6478">{{p.note}}</span></span>
            </button>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; font-size: 14px; color: #4A4252">
          <span><strong style="color: #2A1640">{{t.langLabel}}</strong> {{t.langValue}}</span>
          <span><strong style="color: #2A1640">{{t.currLabel}}</strong> Rp (IDR)</span>
        </div>
      </section>

      <!-- Security -->
      <section style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px; color: #2A1640">{{t.secTitle}}</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; font-size: 14px; color: #4A4252">
          <span><strong style="color: #2A1640">{{t.loginLabel}}</strong> [email@toko.com]</span>
          <span><strong style="color: #2A1640">{{t.pwLabel}}</strong> {{t.pwValue}}</span>
          <a href="#" style="font-weight: 700">{{t.pwChange}}</a>
        </div>
        <span style="font-size: 13px; color: #6E6478">{{t.secNote}}</span>
      </section>
      <span style="font-size: 12px; color: #6E6478">{{t.dummy}}</span>
    </main>
  </div>
</div>
</template>

<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"startLanguage":{"editor":"enum","options":["id","en"],"default":"id"},"$preview":{"width":1440,"height":2300}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const lang = st.lang || this.props.startLanguage || 'id';
    const L = (id, en) => (lang === 'id' ? id : en);
    const ACTIVE = 'profile';
    const fmt = (n) => 'Rp ' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const t = {
      nvAria: L('Menu utama', 'Main menu'), nvBooks: L('Buku ▾', 'Books ▾'), nvNonBooks: L('Non Buku ▾', 'Non Books ▾'), nvPub: L('Penerbit ▾', 'Publishers ▾'), nvReseller: L('Untuk Reseller ▾', 'For Resellers ▾'), nvAbout: L('Tentang Kami ▾', 'About Us ▾'), nvContact: L('Kontak', 'Contact'), nvNews: L('Segera Terbit', 'Coming Soon'), myAccountBtn: L('Akun Saya', 'My Account'),
      catalog: L('Katalog', 'Catalog'),
      cart: L('Keranjang · 24 item', 'Cart · 24 items'),
      accountNav: L('Akun', 'Account'),
      storeName: L('[Nama Toko Buku]', '[Bookshop name]'),
      logout: L('Keluar', 'Log out'),
      title: L('Profil toko', 'Store profile'),
