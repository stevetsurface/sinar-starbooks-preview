      { key: 'good', title: 'Good Material', meta: 'Dolly Alderton · Knopf · ISBN 9780593468678', price: 265000, qty: 6, cover: '#B0476A', date: L('18 Okt 2026', 'Oct 18, 2026'), href: 'product.html' },
      { key: 'conv', title: 'The Convenience Store by the Sea', meta: 'Sonoko Machida · Bloomsbury · ISBN 9781526669582', price: 245000, qty: 6, cover: '#7FB7C9', date: L('12 Okt 2026', 'Oct 12, 2026'), href: 'product.html' },
      { key: 'punch', title: 'Punch Needle Kit', meta: 'Kikkerland · SKU KDT-PNK', price: 525000, qty: 6, cover: '#B07A12', date: L('9 Okt 2026', 'Oct 9, 2026'), href: 'non-book-product.html' },
      { key: 'dog', title: 'Dog Man #14: Big Jim Believes', meta: 'Dav Pilkey · Scholastic · ISBN 9781546176183', price: 306000, qty: 12, cover: '#C2402F', date: L('2 Okt 2026', 'Oct 2, 2026'), href: 'product.html' }
    ];
    const removed = st.removed || [], added = st.added || [];
    const items = ALL.filter((w) => !removed.includes(w.key)).map((w) => ({ ...w, ...coverOf(w.title), price: fmt(w.price), added: added.includes(w.key), notAdded: !added.includes(w.key),
      add: () => this.setState({ added: added.concat(w.key), flash: L('Ditambahkan ke keranjang: ' + w.qty + ' × ' + w.title, 'Added to cart: ' + w.qty + ' × ' + w.title) }),
      drop: () => this.setState({ removed: removed.concat(w.key), flash: null }) }));
    const addAll = () => this.setState({ added: items.map((w) => w.key), flash: L('Semua judul di wishlist ditambahkan ke keranjang', 'Every wish-list title was added to the cart') });

    return { t, menu, langs, items, hasItems: items.length > 0, noItems: items.length === 0, addAll, hasFlash: !!st.flash, flash: st.flash || '', countLabel: L(items.length + ' judul tersimpan', items.length + ' titles saved') };
  }
}
</script>
