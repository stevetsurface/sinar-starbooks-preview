<body>
<template id="dc-template">

<div style="font-family: Figtree, system-ui, sans-serif; color: #1E1A24; background: #FBFAFC; min-height: 100vh">

  <!-- Header -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #ECE6F1">
    <div style="max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="index.html" style="display: flex; align-items: center; gap: 10px" aria-label="Star Books and Gifts">
        <img src="assets/logos/star-books-and-gifts.png" alt="Star Books and Gifts" style="height: 64px; width: auto; display: block"><span style="font-size: 11px; letter-spacing: 2.5px; color: #5B2A86; font-weight: 800; padding-left: 14px; border-left: 1px solid #D9CCE6; line-height: 1.4">PORTAL<br>RESELLER</span>
      </a>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
        <a href="account.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #1E1A24; font-weight: 600; font-size: 14px; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>{{t.myAccountBtn}}</a>
        <div role="group" aria-label="Language / Bahasa" style="display: flex; gap: 4px; background: #F1EBF6; padding: 4px; border-radius: 999px">
          <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
            <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
              <button type="button" aria-pressed="true" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
            <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
              <button type="button" aria-pressed="false" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #4A4252; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
          </sc-for>
        </div>
        <a href="catalog.html" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #D9CCE6; color: #1E1A24; font-weight: 600; font-size: 14px">{{t.catalog}}</a>
        <a href="become-a-reseller.html" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; background: #5B2A86; color: #FFFFFF; font-weight: 600; font-size: 14px">{{t.join}}</a>
      </div>
    </div>
    <nav aria-label="{{t.nvAria}}" style="max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 14px; font-weight: 700">
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvBooks}}</a>
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvNonBooks}}</a>
      <a href="about.html#publishers" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvPub}}</a>
      <a href="become-a-reseller.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvReseller}}</a>
      <a href="about.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvAbout}}</a>
      <a href="faq.html#account" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvContact}}</a>
    </nav>
  </header>

  <div style="max-width: 1240px; margin: 0 auto; padding: 40px 24px 96px; display: flex; flex-direction: column; gap: 36px">

    <!-- Intro -->
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 8px; max-width: 720px">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #5B2A86">{{t.eyebrow}}</span>
        <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 44px; line-height: 1.1; color: #2A1640">{{t.title}}</h1>
        <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #4A4252">{{t.sub}}</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{years}}" as="y" hint-placeholder-count="4">
          <sc-if value="{{y.on}}" hint-placeholder-val="{{true}}"><button type="button" aria-pressed="true" onClick="{{y.pick}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{y.label}}</button></sc-if>
          <sc-if value="{{y.off}}" hint-placeholder-val="{{false}}"><button type="button" aria-pressed="false" onClick="{{y.pick}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #1E1A24; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{y.label}}</button></sc-if>
        </sc-for>
      </div>
    </div>

    <!-- Events with galleries -->
    <sc-for list="{{events}}" as="ev" hint-placeholder-count="5">
      <article id="{{ev.id}}" style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: flex-start">
          <div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 8px">
            <span style="align-self: flex-start; font-size: 11px; font-weight: 800; letter-spacing: 1.2px; padding: 5px 10px; border-radius: 999px; background: {{ev.bg}}; color: #2A1640">{{ev.kind}}</span>
            <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.15; color: #2A1640">{{ev.title}}</h2>
            <span style="font-size: 14px; font-weight: 700; color: #5B2A86">{{ev.when}} · {{ev.where}}</span>
            <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #4A4252">{{ev.body}}</p>
          </div>
          <div style="flex: 1 1 280px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px">
            <sc-for list="{{ev.facts}}" as="f" hint-placeholder-count="3">
              <div style="background: #F7F2FB; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
                <span style="font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 600; color: #2A1640">{{f.n}}</span>
                <span style="font-size: 12px; color: #6E6478; line-height: 1.3">{{f.label}}</span>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px">
          <sc-for list="{{ev.photos}}" as="p" hint-placeholder-count="6">
            <div style="aspect-ratio: 4 / 3; border-radius: 14px; border: 1.5px dashed #C9B6DC; background: {{p.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 12px; box-sizing: border-box">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5B2A86" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 16-5-5-8 8"></path></svg>
              <span style="font-size: 12px; font-weight: 700; color: #5B2A86">{{p.label}}</span>
              <span style="font-size: 11px; color: #6E6478">{{p.hint}}</span>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center">
          <span style="font-size: 13px; color: #6E6478">{{ev.source}}</span>
          <a href="https://www.instagram.com/sinarstarbooks/" style="font-size: 14px; font-weight: 700">{{t.seeIg}}</a>
        </div>
      </article>
    </sc-for>

    <!-- Next events -->
    <section style="background: #2A1640; color: #FFFFFF; border-radius: 24px; padding: 32px; display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 8px; max-width: 640px">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 1.5px; color: #F2B33D">{{t.nextEyebrow}}</span>
        <span style="font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 600; line-height: 1.15">{{t.nextTitle}}</span>
        <span style="font-size: 15px; line-height: 1.5; color: #D4C6E2">{{t.nextBody}}</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <a href="coming-soon.html" style="display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 999px; background: #F2B33D; color: #2A1640; font-weight: 700; font-size: 15px">{{t.nextCta}}</a>
        <a href="become-a-reseller.html" style="display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid #6B5A80; color: #FFFFFF; font-weight: 600; font-size: 15px">{{t.join}}</a>
      </div>
    </section>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"startLanguage":{"editor":"enum","options":["id","en"],"default":"id"},"$preview":{"width":1440,"height":2600}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const lang = st.lang || this.props.startLanguage || 'id';
    const L = (id, en) => (lang === 'id' ? id : en);
    const t = {
      nvAria: L('Menu utama', 'Main menu'), nvBooks: L('Buku ▾', 'Books ▾'), nvNonBooks: L('Non Buku ▾', 'Non Books ▾'), nvPub: L('Penerbit ▾', 'Publishers ▾'), nvReseller: L('Untuk Reseller ▾', 'For Resellers ▾'), nvAbout: L('Tentang Kami ▾', 'About Us ▾'), nvContact: L('Kontak', 'Contact'), myAccountBtn: L('Akun Saya', 'My Account'),
      catalog: L('Katalog', 'Catalog'), join: L('Daftar jadi reseller', 'Become a reseller'),
      eyebrow: L('ACARA & PAMERAN', 'EVENTS & FAIRS'),
      title: L('Di mana kami bertemu pembaca, reseller, dan sekolah', 'Where we meet readers, resellers and schools'),
      sub: L('Setiap tahun kami hadir di Indonesia International Book Fair, pameran komik, bazar sekolah, dan acara komunitas bersama kreator buku. Foto dan catatan dari tiap acara ada di sini.', 'Every year we are at the Indonesia International Book Fair, comic fairs, school bazaars and community events with book creators. Photos and notes from each event live here.'),
      seeIg: L('Lihat di Instagram @sinarstarbooks →', 'See it on Instagram @sinarstarbooks →'),
      nextEyebrow: L('ACARA BERIKUTNYA', 'NEXT UP'),
      nextTitle: L('[Acara berikutnya: nama, tanggal, tempat]', '[Next event: name, date, venue]'),
      nextBody: L('Reseller mendapat undangan, stok khusus acara, dan harga pameran lebih dulu. Ikuti kalender rilis dan newsletter agar tidak terlewat.', 'Resellers get the invitation, event stock and fair pricing first. Follow the release calendar and newsletter so you do not miss it.'),
      nextCta: L('Kalender & newsletter', 'Calendar & newsletter')
    };
    const year = st.year || 'all';
    const years = [['all', L('Semua', 'All')], ['2026', '2026'], ['2025', '2025'], ['older', L('2024 & sebelumnya', '2024 & earlier')]]
      .map(([id, label]) => ({ label, on: year === id, off: year !== id, pick: () => this.setState({ year: id }) }));
    const ph = (label, n, bg) => Array.from({ length: n }, (_, i) => ({ label: label + ' ' + (i + 1), hint: L('[unggah foto]', '[upload photo]'), bg }));
    const raw = [
      { id: 'iibf-2026', y: '2026', kind: L('PAMERAN BUKU', 'BOOK FAIR'), bg: '#F1EBF6', title: 'Indonesia International Book Fair 2026', when: L('30 Sep – 4 Okt 2026', 'Sep 30 – Oct 4, 2026'), where: L('JCC, Jakarta', 'JCC, Jakarta'),
        body: L('Lima hari di booth Star Books and Gifts bersama Kikkerland dan rekomendasi buku dari para bookfluencer. Hari pertama dan kedua adalah hari reseller: sebagian besar toko mitra belanja stok akhir tahun di sini.', 'Five days at the Star Books and Gifts booth with Kikkerland and book picks from bookfluencers. Days one and two are reseller days: most partner shops buy their year-end stock here.'),
        facts: [{ n: '5', label: L('hari', 'days') }, { n: '2.130', label: L('judul terjual', 'titles sold') }, { n: '#1', label: 'Tuesdays with Morrie' }, { n: '[X]', label: L('reseller hadir', 'resellers attended') }],
        photos: ph(L('Foto IIBF 2026', 'IIBF 2026 photo'), 8, '#F7F2FB'), source: L('Foto: tim marketing dan @sinarstarbooks · angka dari rekap IIBF 2026', 'Photos: marketing team and @sinarstarbooks · figures from the IIBF 2026 recap') },
      { id: 'guzeme-2026', y: '2026', kind: L('KOMUNITAS', 'COMMUNITY'), bg: '#FDE9C4', title: L('Sesi bercerita bersama @guzeme', 'Storytelling with @guzeme'), when: L('Oktober 2026', 'October 2026'), where: L('[Tempat]', '[Venue]'),
        body: L('Satu hari penuh cerita dan imajinasi bersama pembaca muda, dengan buku anak pilihan dari katalog kami.', 'A day of stories and imagination with young readers, with children’s titles from our catalog.'),
        facts: [{ n: '[X]', label: L('anak hadir', 'children attended') }, { n: '[X]', label: L('judul dibacakan', 'titles read aloud') }],
        photos: ph(L('Foto sesi @guzeme', '@guzeme session photo'), 4, '#FFF7E6'), source: L('Foto: @guzeme dan @sinarstarbooks', 'Photos: @guzeme and @sinarstarbooks') },
      { id: 'war-2026', y: '2026', kind: 'WAR', bg: '#DCEBF0', title: 'WAR 2026', when: '2026', where: L('[Tempat]', '[Venue]'),
        body: L('[Deskripsi acara: apa yang kami bawa, siapa yang hadir, judul yang paling dicari]', '[Event description: what we brought, who came, most-wanted titles]'),
        facts: [{ n: '[X]', label: L('hari', 'days') }, { n: '[X]', label: L('judul', 'titles') }],
        photos: ph(L('Foto WAR 2026', 'WAR 2026 photo'), 4, '#EEF5F8'), source: L('Foto: tim marketing', 'Photos: marketing team') },
      { id: 'iibf-2025', y: '2025', kind: L('PAMERAN BUKU', 'BOOK FAIR'), bg: '#F1EBF6', title: 'Indonesia International Book Fair 2025', when: L('[tgl] 2025', '[date] 2025'), where: L('JCC, Jakarta', 'JCC, Jakarta'),
        body: L('[Catatan IIBF 2025: booth, penerbit yang hadir, judul terlaris, reseller yang datang]', '[IIBF 2025 notes: booth, publishers present, best sellers, resellers who came]'),
        facts: [{ n: '[X]', label: L('hari', 'days') }, { n: '[X]', label: L('judul terjual', 'titles sold') }, { n: '[X]', label: L('reseller hadir', 'resellers attended') }],
        photos: ph(L('Foto IIBF 2025', 'IIBF 2025 photo'), 8, '#F7F2FB'), source: L('Foto: tim marketing dan @sinarstarbooks', 'Photos: marketing team and @sinarstarbooks') },
      { id: 'schools', y: '2025', kind: L('SEKOLAH', 'SCHOOLS'), bg: '#E6DDF0', title: L('Bazar buku & kunjungan sekolah', 'School book fairs & visits'), when: L('Sepanjang tahun', 'All year'), where: L('[Daftar sekolah]', '[List of schools]'),
        body: L('[Sekolah yang pernah bekerja sama dengan kami: nama, kota, jenis acara. Sekolah dan perpustakaan memakai ketentuan terpisah; hubungi tim kami.]', '[Schools we have worked with: name, city, type of event. Schools and libraries are on separate terms; contact our team.]'),
        facts: [{ n: '[X]', label: L('sekolah', 'schools') }, { n: '[X]', label: L('bazar per tahun', 'fairs a year') }],
        photos: ph(L('Foto bazar sekolah', 'School fair photo'), 4, '#F3EEF8'), source: L('Foto: sekolah mitra, dengan izin', 'Photos: partner schools, with permission') },
      { id: 'war-comic-2023', y: 'older', kind: 'WAR COMIC', bg: '#F6D9D4', title: 'WAR Comic 2023', when: '2023', where: L('[Tempat]', '[Venue]'),
        body: L('[Deskripsi acara]', '[Event description]'), facts: [{ n: '[X]', label: L('judul manga', 'manga titles') }],
        photos: ph(L('Foto WAR Comic 2023', 'WAR Comic 2023 photo'), 4, '#FBEEEC'), source: L('Foto: tim marketing', 'Photos: marketing team') },
      { id: 'war-comic-2022', y: 'older', kind: 'WAR COMIC', bg: '#DDEBDD', title: 'WAR Comic 2022', when: '2022', where: L('[Tempat]', '[Venue]'),
        body: L('[Deskripsi acara]', '[Event description]'), facts: [{ n: '[X]', label: L('judul manga', 'manga titles') }],
        photos: ph(L('Foto WAR Comic 2022', 'WAR Comic 2022 photo'), 4, '#EEF5EE'), source: L('Foto: tim marketing', 'Photos: marketing team') }
    ];
    const events = raw.filter((e) => year === 'all' || e.y === year);
    const langs = [{ id: 'id', label: 'ID' }, { id: 'en', label: 'EN' }].map((x) => ({ label: x.label, on: lang === x.id, off: lang !== x.id, pick: () => this.setState({ lang: x.id }) }));
    return { t, langs, years, events };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
