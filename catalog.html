<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Katalog Reseller | Star Books and Gifts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Katalog harga reseller. Masuk untuk melihat harga.">
<link rel="canonical" href="https://stevetsurface.github.io/sinar-starbooks-preview/catalog.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Star Books and Gifts">
<meta property="og:title" content="Katalog Reseller | Star Books and Gifts">
<meta property="og:description" content="Katalog harga reseller. Masuk untuk melihat harga.">
<meta property="og:url" content="https://stevetsurface.github.io/sinar-starbooks-preview/catalog.html">
<meta property="og:image" content="https://stevetsurface.github.io/sinar-starbooks-preview/assets/logos/star-books-and-gifts.png">
<meta property="og:locale" content="id_ID">
<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="assets/logos/star-books-and-gifts.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFAFC}
a{color:#5B2A86;text-decoration:none}a:hover{color:#3E1A5E}
</style>

</head>
<body>
<template id="dc-template">

<div style="font-family: Figtree, system-ui, sans-serif; color: #1E1A24; background: #FBFAFC; min-height: 100vh">

  <!-- Header -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #ECE6F1">
    <div style="max-width: 1320px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center">
      <a href="reseller-home.html" style="display: flex; align-items: center; gap: 10px" aria-label="{{t.homeAria}}">
        <img src="assets/logos/star-books-and-gifts.png" alt="Star Books and Gifts" style="height: 64px; width: auto; display: block"><span style="font-size: 11px; letter-spacing: 2.5px; color: #5B2A86; font-weight: 800; padding-left: 14px; border-left: 1px solid #D9CCE6; line-height: 1.4">PORTAL<br>RESELLER</span>
      </a>
      <form style="flex: 1 1 300px; display: flex; align-items: center; gap: 10px; background: #F4F0F8; border-radius: 999px; padding: 0 8px 0 18px; height: 48px" role="search">
        <label for="q2" style="position: absolute; left: -9999px">{{t.searchLabel}}</label>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6478" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="q2" type="search" placeholder="{{t.searchPlaceholder}}" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 15px; outline: none; color: #1E1A24">
      </form>
      <div role="group" aria-label="Language / Bahasa" style="display: flex; gap: 4px; background: #F1EBF6; padding: 4px; border-radius: 999px">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
          <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
            <button type="button" aria-pressed="true" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
          </sc-if>
          <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
            <button type="button" aria-pressed="false" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #4A4252; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
          </sc-if>
        </sc-for>
      </div>
      <a href="account.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9CCE6; color: #1E1A24; font-weight: 600; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
        {{t.myAccount}}
      </a>
      <a href="checkout.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 999px; background: #5B2A86; color: #FFFFFF; font-weight: 600; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 4h2l2.4 11h11L21 8H6.2"></path><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle></svg>
        {{cartBtn}}
      </a>
    </div>
    <nav aria-label="{{t.nvAria}}" style="max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 14px; font-weight: 700">
      <a href="catalog.html" style="color: #5B2A86; padding: 12px 0 14px; border-bottom: 3px solid #5B2A86">{{t.nvBooks}}</a>
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvNonBooks}}</a>
      <a href="about.html#publishers" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvPub}}</a>
      <a href="become-a-reseller.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvReseller}}</a>
      <a href="about.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvAbout}}</a>
      <a href="faq.html#account" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvContact}}</a>
    </nav>
  </header>

  <div style="max-width: 1320px; margin: 0 auto; padding: 28px 24px 80px">
    <nav aria-label="Breadcrumb" style="font-size: 14px; color: #6E6478; display: flex; gap: 8px; margin-bottom: 20px">
      <a href="reseller-home.html">{{t.crumbHome}}</a><span aria-hidden="true">/</span><span>{{t.pageTitle}}</span><span aria-hidden="true">{{crumbSep}}</span><span>{{crumbCat}}</span>
    </nav>

    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: flex-end; margin-bottom: 24px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 48px; color: #2A1640">{{heading}}</h1>
        <span style="font-size: 16px; color: #6E6478">{{countLabel}}</span>
      </div>
      <!-- Toolbar: sort, items per page, view -->
      <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
        <label for="sort" style="font-size: 14px; color: #6E6478">{{t.sortBy}}</label>
        <select id="sort" onChange="{{onSort}}" style="height: 44px; border-radius: 12px; border: 1px solid #D9CCE6; background: #FFFFFF; padding: 0 12px; font: inherit; font-size: 14px; color: #1E1A24">
          <sc-for list="{{sortOpts}}" as="o" hint-placeholder-count="4">
            <option value="{{o.id}}" selected="{{o.sel}}">{{o.label}}</option>
          </sc-for>
        </select>
        <label for="perpage" style="font-size: 14px; color: #6E6478">{{t.perPage}}</label>
        <select id="perpage" onChange="{{onPerPage}}" style="height: 44px; border-radius: 12px; border: 1px solid #D9CCE6; background: #FFFFFF; padding: 0 12px; font: inherit; font-size: 14px; color: #1E1A24">
          <sc-for list="{{perOpts}}" as="o" hint-placeholder-count="3">
            <option value="{{o.id}}" selected="{{o.sel}}">{{o.label}}</option>
          </sc-for>
        </select>
        <div role="group" aria-label="{{t.viewLabel}}" style="display: flex; gap: 4px; background: #F1EBF6; padding: 4px; border-radius: 12px">
          <sc-for list="{{viewOpts}}" as="v" hint-placeholder-count="3">
            <sc-if value="{{v.on}}" hint-placeholder-val="{{false}}">
              <button type="button" aria-pressed="true" aria-label="{{v.label}}" title="{{v.label}}" onClick="{{v.pick}}" style="width: 44px; height: 36px; border-radius: 9px; border: 0; background: #5B2A86; color: #FFFFFF; display: grid; place-items: center; cursor: pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{v.icon}}"></path></svg>
              </button>
            </sc-if>
            <sc-if value="{{v.off}}" hint-placeholder-val="{{true}}">
              <button type="button" aria-pressed="false" aria-label="{{v.label}}" title="{{v.label}}" onClick="{{v.pick}}" style="width: 44px; height: 36px; border-radius: 9px; border: 0; background: transparent; color: #4A4252; display: grid; place-items: center; cursor: pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="{{v.icon}}"></path></svg>
              </button>
            </sc-if>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
      <!-- Filters -->
      <aside aria-label="{{t.filtersAria}}" style="flex: 1 1 240px; max-width: 280px; display: flex; flex-direction: column; gap: 24px; background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 20px; box-sizing: border-box">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-weight: 800; font-size: 15px; margin-bottom: 6px">{{t.fCategory}}</span>
          <sc-if value="{{allCatOn}}" hint-placeholder-val="{{true}}">
            <button type="button" onClick="{{pickAllCat}}" style="display: flex; justify-content: space-between; width: 100%; padding: 8px 10px; border: 0; border-radius: 10px; background: #F1EBF6; color: #5B2A86; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; text-align: left"><span>{{t.allCats}}</span><span>{{totalCount}}</span></button>
          </sc-if>
          <sc-if value="{{allCatOff}}" hint-placeholder-val="{{false}}">
            <button type="button" onClick="{{pickAllCat}}" style="display: flex; justify-content: space-between; width: 100%; padding: 8px 10px; border: 0; border-radius: 10px; background: transparent; color: #1E1A24; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-align: left"><span>{{t.allCats}}</span><span>{{totalCount}}</span></button>
          </sc-if>
          <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
            <span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #6E6478; padding: 12px 10px 4px">{{g.label}}</span>
            <sc-for list="{{g.cats}}" as="c" hint-placeholder-count="3">
              <sc-if value="{{c.on}}" hint-placeholder-val="{{false}}">
                <button type="button" onClick="{{c.pick}}" style="display: flex; justify-content: space-between; width: 100%; padding: 7px 10px; border: 0; border-radius: 10px; background: #F1EBF6; color: #5B2A86; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; text-align: left"><span>{{c.label}}</span><span>{{c.count}}</span></button>
              </sc-if>
              <sc-if value="{{c.off}}" hint-placeholder-val="{{true}}">
                <button type="button" onClick="{{c.pick}}" style="display: flex; justify-content: space-between; width: 100%; padding: 7px 10px; border: 0; border-radius: 10px; background: transparent; color: #4A4252; font: inherit; font-size: 14px; cursor: pointer; text-align: left"><span>{{c.label}}</span><span>{{c.count}}</span></button>
              </sc-if>
            </sc-for>
          </sc-for>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-weight: 800; font-size: 15px; margin-bottom: 6px">{{t.fPublisher}}</span>
          <sc-for list="{{pubs}}" as="p" hint-placeholder-count="8">
            <sc-if value="{{p.on}}" hint-placeholder-val="{{false}}">
              <button type="button" onClick="{{p.pick}}" style="display: flex; justify-content: space-between; width: 100%; padding: 7px 10px; border: 0; border-radius: 10px; background: #F1EBF6; color: #5B2A86; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; text-align: left"><span>{{p.label}}</span><span>{{p.count}}</span></button>
            </sc-if>
            <sc-if value="{{p.off}}" hint-placeholder-val="{{true}}">
              <button type="button" onClick="{{p.pick}}" style="display: flex; justify-content: space-between; width: 100%; padding: 7px 10px; border: 0; border-radius: 10px; background: transparent; color: #4A4252; font: inherit; font-size: 14px; cursor: pointer; text-align: left"><span>{{p.label}}</span><span>{{p.count}}</span></button>
            </sc-if>
          </sc-for>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-weight: 800; font-size: 15px; margin-bottom: 6px">{{t.fAvailability}}</span>
          <sc-for list="{{avails}}" as="a" hint-placeholder-count="3">
            <sc-if value="{{a.on}}" hint-placeholder-val="{{false}}">
              <button type="button" onClick="{{a.pick}}" style="display: flex; justify-content: space-between; width: 100%; padding: 7px 10px; border: 0; border-radius: 10px; background: #F1EBF6; color: #5B2A86; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; text-align: left"><span>{{a.label}}</span><span>{{a.count}}</span></button>
            </sc-if>
            <sc-if value="{{a.off}}" hint-placeholder-val="{{true}}">
              <button type="button" onClick="{{a.pick}}" style="display: flex; justify-content: space-between; width: 100%; padding: 7px 10px; border: 0; border-radius: 10px; background: transparent; color: #4A4252; font: inherit; font-size: 14px; cursor: pointer; text-align: left"><span>{{a.label}}</span><span>{{a.count}}</span></button>
            </sc-if>
          </sc-for>
        </div>
      </aside>

      <!-- Results -->
      <div style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
          <div role="tablist" aria-label="{{t.showLabel}}" style="display: flex; gap: 8px; margin-right: 8px">
            <sc-for list="{{tabs}}" as="v" hint-placeholder-count="2">
              <sc-if value="{{v.on}}" hint-placeholder-val="{{false}}">
                <button type="button" role="tab" aria-selected="true" onClick="{{v.pick}}" style="height: 38px; padding: 0 16px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{v.label}}</button>
              </sc-if>
              <sc-if value="{{v.off}}" hint-placeholder-val="{{true}}">
                <button type="button" role="tab" aria-selected="false" onClick="{{v.pick}}" style="height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #4A4252; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{v.label}}</button>
              </sc-if>
            </sc-for>
          </div>
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="1">
            <button type="button" onClick="{{c.clear}}" aria-label="{{c.aria}}" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 0; background: #F1EBF6; color: #5B2A86; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{c.label}} ×</button>
          </sc-for>
          <sc-if value="{{hasChips}}" hint-placeholder-val="{{false}}">
            <button type="button" onClick="{{clearAll}}" style="border: 0; background: transparent; color: #5B2A86; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{t.clearAll}}</button>
          </sc-if>
        </div>

        <!-- Trending with other resellers -->
        <sc-if value="{{showTrending}}" hint-placeholder-val="{{true}}">
          <section aria-label="{{t.trendTitle}}" style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px">
              <span style="display: flex; align-items: center; gap: 8px; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 20px; color: #2A1640">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B0476A" stroke-width="2" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"></path></svg>
                {{t.trendTitle}}
              </span>
              <span style="font-size: 13px; color: #6E6478">{{t.trendSub}}</span>
            </div>
            <div style="display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 4px">
              <sc-for list="{{trending}}" as="r" hint-placeholder-count="6">
                <div style="display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: #FBF8FD">
                  <div style="width: 40px; height: 56px; border-radius: 2px 5px 5px 2px; background: {{r.cover}}; flex: none; position: relative; overflow: hidden"><sc-if value="{{r.hasImg}}" hint-placeholder-val="{{false}}"><img src="{{r.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></sc-if></div>
                  <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
                    <span style="font-weight: 700; font-size: 13px; line-height: 1.25; color: #1E1A24; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.title}}</span>
                    <span style="font-size: 11px; font-weight: 700; color: #B0476A">{{r.boughtLabel}}</span>
                    <span style="font-size: 12px; font-weight: 800; color: #2A1640">{{r.reseller}}</span>
                  </div>
                  <button type="button" aria-label="{{t.addToCart}}" onClick="{{r.add}}" style="width: 36px; height: 36px; border-radius: 9px; border: 0; background: #5B2A86; color: #FFFFFF; display: grid; place-items: center; cursor: pointer; flex: none">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                  </button>
                </div>
              </sc-for>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 12px; color: #4A4252; border-top: 1px solid #F3EFF6; padding-top: 12px">
              <span style="display: flex; align-items: center; gap: 6px; font-weight: 800; color: #3E7A5A"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3E7A5A"></span>{{t.recentTitle}}</span>
              <sc-for list="{{recentOrders}}" as="o" hint-placeholder-count="3">
                <span>{{o.text}} <span style="color: #6E6478">· {{o.ago}}</span></span>
              </sc-for>
            </div>
          </section>
        </sc-if>

        <!-- LIST VIEW -->
        <sc-if value="{{isList}}" hint-placeholder-val="{{true}}">
          <div style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; overflow-x: auto">
            <div style="min-width: 720px">
              <div style="display: grid; grid-template-columns: 64px minmax(0, 3fr) minmax(0, 1.1fr) minmax(0, 1.1fr) 150px; gap: 16px; padding: 14px 20px; font-size: 12px; font-weight: 800; letter-spacing: 0.8px; color: #6E6478; border-bottom: 1px solid #ECE6F1">
                <span></span><span>{{t.colTitle}}</span><span>{{t.colRetail}}</span><span>{{t.colPrice}}</span><span>{{t.colQty}}</span>
              </div>
              <sc-for list="{{page}}" as="r" hint-placeholder-count="6">
                <div style="display: grid; grid-template-columns: 64px minmax(0, 3fr) minmax(0, 1.1fr) minmax(0, 1.1fr) 150px; gap: 16px; padding: 14px 20px; align-items: center; border-bottom: 1px solid #F3EFF6">
                  <div style="width: 52px; height: 72px; border-radius: 2px 6px 6px 2px; background: {{r.cover}}; box-shadow: 0 6px 12px rgba(42,22,64,0.14); position: relative; overflow: hidden"><sc-if value="{{r.hasImg}}" hint-placeholder-val="{{false}}"><img src="{{r.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></sc-if></div>
                  <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
                    <span style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
                      <a href="product.html" style="font-weight: 700; font-size: 15px; color: #1E1A24">{{r.title}}</a>
                      <sc-if value="{{r.isBest}}" hint-placeholder-val="{{false}}">
                        <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.6px; padding: 4px 8px; border-radius: 999px; background: #FDE9C4; color: #6B4A00">{{r.badge}}</span>
                      </sc-if>
                    </span>
                    <span style="font-size: 13px; color: #6E6478">{{r.author}} · {{r.publisher}} · {{r.catLabel}}</span>
                    <span style="font-size: 12px; color: #6E6478">{{r.isbnLabel}}{{r.stock}} · {{t.minShort}} {{r.moq}}</span>
                    <sc-if value="{{r.hot}}" hint-placeholder-val="{{false}}">
                      <span style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px">
                        <span style="font-size: 12px; font-weight: 700; color: #B0476A">{{r.boughtLabel}}</span>
                        <span style="font-size: 12px; font-weight: 600; color: #5B2A86">· {{r.cartsLabel}}</span>
                      </span>
                    </sc-if>
                  </div>
                  <span style="font-size: 14px; color: #6E6478; text-decoration: line-through">{{r.retail}}</span>
                  <span style="font-size: 16px; font-weight: 800; color: #2A1640">{{r.reseller}}</span>
                  <div style="display: flex; gap: 8px; align-items: center">
                    <label style="position: absolute; left: -9999px" for="ql-{{r.key}}">{{t.qtyFor}} {{r.title}}</label>
                    <input id="ql-{{r.key}}" type="number" value="{{r.moq}}" min="0" style="width: 60px; height: 44px; border-radius: 10px; border: 1px solid #D9CCE6; text-align: center; font: inherit; font-size: 15px">
                    <button type="button" aria-label="{{t.addToCart}}" onClick="{{r.add}}" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: #5B2A86; color: #FFFFFF; display: grid; place-items: center; cursor: pointer">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                    </button>
                  </div>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <!-- GRID VIEW -->
        <sc-if value="{{isGrid}}" hint-placeholder-val="{{false}}">
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 14px">
            <sc-for list="{{page}}" as="r" hint-placeholder-count="10">
              <article style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">

    return {
      cartBtn: L('Keranjang · ', 'Cart · ') + fmt(cartTotalN),
      cartOpen: !!st.cartOpen, cartOpenAttr: st.cartOpen ? 'true' : 'false',
      openCart: () => { if (!(this.state || {}).cartOpen) this.setState({ cartOpen: true }); },
      closeCart: () => { if ((this.state || {}).cartOpen) this.setState({ cartOpen: false }); },
      toggleCart: () => this.setState({ cartOpen: !(this.state || {}).cartOpen }),
      cartCount: cartQty, cartCountLabel: L(cartQty + ' buku', cartQty + ' books'),
      cartLines, cartRetail: fmt(cartRetailN), cartSave: fmt(cartRetailN - cartTotalN), cartTotal: fmt(cartTotalN),
      tierNow: tierNowObj ? L('Diskon pesanan ini', 'This order’s discount') : L('Minimal Rp 1.000.000 untuk diskon 20%', 'Rp 1,000,000 minimum for 20% off'),
      discLabel: tierNowObj ? tierNowObj.d + '%' : '—', tierPct, tierWidth: tierPct + '%', tierNext, ladder,
      pillHint: nextTier ? L('+' + fmt(nextTier.min - cartRetailN) + ' → ' + nextTier.d + '%', '+' + fmt(nextTier.min - cartRetailN) + ' → ' + nextTier.d + '%') : L('Diskon 37%', '37% off'),
      hasFlash: !!st.flash, flash: st.flash || '',
      trending, recentOrders, showTrending: !cat && !pub && tab === 'all' && cur === 1 && (this.props.paidOrders ?? 1) >= 3,
      t, langs, groups, pubs, avails, tabs, chips, sortOpts, perOpts, viewOpts, pages, page,
      heading, showingText, crumbSep: cat ? '/' : '', crumbCat: cat ? catName[cat] : '',
      countLabel: L(total + ' judul · harga reseller untuk pesanan ini (diskon ' + d + '%)', total + ' titles · reseller prices for this order (' + d + '% off)'),
      totalCount: books.length, allCatOn: !cat, allCatOff: !!cat, pickAllCat: () => set({ cat: null }),
      hasChips: chips.length > 0, clearAll: () => set({ cat: null, pub: null, avail: 'all', tab: 'all' }),
      isList: view === 'list' && total > 0, isGrid: view === 'grid' && total > 0, isCompact: view === 'compact' && total > 0, isEmpty: total === 0,
      onSort: (e) => this.setState({ sort: e.target.value, page: 1 }),
      onPerPage: (e) => this.setState({ per: Number(e.target.value), page: 1 }),
      prevPage: () => this.setState({ page: Math.max(1, cur - 1) }),
      nextPage: () => this.setState({ page: Math.min(pagesCount, cur + 1) })
    };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
