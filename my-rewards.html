<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sinar Starbooks — My Rewards</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFAFC}
a{color:#5B2A86;text-decoration:none}a:hover{color:#3E1A5E}
</style>

</head>
<body>
<template id="dc-template">

<div style="font-family: Figtree, system-ui, sans-serif; color: #1E1A24; background: #FBFAFC; min-height: 100vh">

  <!-- Header -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #ECE6F1">
    <div style="max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="index.html" style="display: flex; align-items: center; gap: 10px" aria-label="Star Books and Gifts">
        <img src="assets/logos/star-books-and-gifts.png" alt="Star Books and Gifts" style="height: 64px; width: auto; display: block"><span style="font-size: 11px; letter-spacing: 2.5px; color: #5B2A86; font-weight: 800; padding-left: 14px; border-left: 1px solid #D9CCE6; line-height: 1.4">PORTAL<br>RESELLER</span>
      </a>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
        <a href="account.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #1E1A24; font-weight: 600; font-size: 14px; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>{{t.myAccountBtn}}</a>
        <div role="group" aria-label="Language / Bahasa" style="display: flex; gap: 4px; background: #F1EBF6; padding: 4px; border-radius: 999px">
          <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
            <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
              <button type="button" aria-pressed="true" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
            <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
              <button type="button" aria-pressed="false" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #4A4252; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
          </sc-for>
        </div>
        <a href="checkout.html" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; background: #5B2A86; color: #FFFFFF; font-weight: 600; font-size: 14px">{{t.cart}}</a>
      </div>
    </div>
    <nav aria-label="{{t.nvAria}}" style="max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 14px; font-weight: 700">
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvBooks}}</a>
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvNonBooks}}</a>
      <a href="about.html#publishers" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvPub}}</a>
      <a href="become-a-reseller.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvReseller}}</a>
      <a href="about.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvAbout}}</a>
      <a href="faq.html#account" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvContact}}</a>
    </nav>
  </header>

  <div style="max-width: 1240px; margin: 0 auto; padding: 40px 24px 96px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

    <!-- Account menu -->
    <nav aria-label="Account" style="flex: 1 1 220px; max-width: 260px; display: flex; flex-direction: column; gap: 4px; background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 12px; box-sizing: border-box">
      <span style="padding: 12px 14px 8px; font-size: 13px; color: #6E6478">[Toko Buku Name]</span>
      <sc-for list="{{menu}}" as="m" hint-placeholder-count="5">
        <sc-if value="{{m.active}}" hint-placeholder-val="{{false}}">
          <a href="{{m.href}}" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; background: #F1EBF6; color: #5B2A86; font-weight: 700; font-size: 15px">{{m.label}}</a>
        </sc-if>
        <sc-if value="{{m.inactive}}" hint-placeholder-val="{{true}}">
          <a href="{{m.href}}" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; color: #1E1A24; font-weight: 500; font-size: 15px">{{m.label}}</a>
        </sc-if>
      </sc-for>
    </nav>

    <main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 44px; color: #2A1640">{{t.title}}</h1>

      <!-- Tier card -->
      <section style="background: #2A1640; color: #FFFFFF; border-radius: 28px; padding: 36px; display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: flex-start">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 13px; font-weight: 800; letter-spacing: 1.5px; color: #B8A6CC">{{t.yourTier}}</span>
            <span style="display: flex; align-items: center; gap: 12px">
              <span style="display: flex; gap: 2px">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="#F2B33D" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z"></path></svg>
                <svg width="26" height="26" viewBox="0 0 24 24" fill="#F2B33D" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z"></path></svg>
              </span>
              <span style="font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1">Bright Star</span>
            </span>
          </div>
          <a href="rewards-program.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #6B4C8A; color: #FFFFFF; font-weight: 600; font-size: 14px">{{t.seeTiers}}</a>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 15px">
            <span style="font-weight: 600">{{t.toNext}}</span>
            <span style="color: #B8A6CC">{{progressLabel}}</span>
          </div>
          <div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{progress}}" aria-label="{{t.toNext}}" style="height: 14px; border-radius: 999px; background: #4A3463; overflow: hidden">
            <div style="height: 100%; width: {{progressWidth}}; border-radius: 999px; background: #F2B33D"></div>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 13px; color: #B8A6CC">
            <span>Bright Star</span><span>Super Star</span>
          </div>
        </div>
        <span style="font-size: 14px; color: #D4C6E2">{{t.review}}</span>
      </section>

      <!-- Stats -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
          <div style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 14px; color: #6E6478">{{s.label}}</span>
            <span style="font-size: 26px; font-weight: 700; color: #2A1640">{{s.value}}</span>
            <span style="font-size: 13px; color: #5B2A86; font-weight: 600">{{s.note}}</span>
          </div>
        </sc-for>
      </div>

      <!-- Benefits -->
      <section style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px; color: #2A1640">{{t.benefitsTitle}}</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
          <sc-for list="{{benefits}}" as="b" hint-placeholder-count="4">
            <div style="display: flex; gap: 10px; align-items: flex-start; padding: 14px; border-radius: 14px; background: #F7F2FB; font-size: 15px; line-height: 1.45">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B2A86" stroke-width="2.4" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="m5 12 5 5 9-10"></path></svg>
              <span>{{b}}</span>
            </div>
          </sc-for>
        </div>
      </section>

      <!-- Activity -->
      <section style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 0 8px; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px; color: #2A1640">{{t.activityTitle}}</h2>
        <div style="overflow-x: auto">
          <div style="min-width: 520px">
            <div style="display: grid; grid-template-columns: 140px minmax(0, 1fr) 160px; gap: 16px; padding: 10px 0; font-size: 12px; font-weight: 800; letter-spacing: 0.8px; color: #6E6478; border-bottom: 1px solid #ECE6F1">
              <span>{{t.colDate}}</span><span>{{t.colWhat}}</span><span style="text-align: right">{{t.colReward}}</span>
            </div>
            <sc-for list="{{activity}}" as="a" hint-placeholder-count="4">
              <div style="display: grid; grid-template-columns: 140px minmax(0, 1fr) 160px; gap: 16px; padding: 14px 0; font-size: 15px; border-bottom: 1px solid #F3EFF6; align-items: center">
                <span style="color: #6E6478">{{a.date}}</span>
                <span>{{a.what}}</span>
                <span style="text-align: right; font-weight: 700; color: #2A1640">{{a.reward}}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"startLanguage":{"editor":"enum","options":["id","en"],"default":"id"},"progress":{"editor":"range","min":0,"max":100,"step":1,"unit":"%","default":65},"$preview":{"width":1440,"height":1800}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.startLanguage || 'id';
    const L = (id, en) => (lang === 'id' ? id : en);
    const progress = this.props.progress ?? 65;
    const t = {
      nvAria: L('Menu utama', 'Main menu'), nvBooks: L('Buku ▾', 'Books ▾'), nvNonBooks: L('Non Buku ▾', 'Non Books ▾'), nvPub: L('Penerbit ▾', 'Publishers ▾'), nvReseller: L('Untuk Reseller ▾', 'For Resellers ▾'), nvAbout: L('Tentang Kami ▾', 'About Us ▾'), nvContact: L('Kontak', 'Contact'), myAccountBtn: L('Akun Saya', 'My Account'),
      cart: L('Keranjang · 24 item', 'Cart · 24 items'),
      title: L('Reward Saya', 'My Rewards'),
      yourTier: L('LEVEL ANDA', 'YOUR TIER'),
      seeTiers: L('Lihat semua level', 'See all tiers'),
      toNext: L('Rp [jumlah] lagi untuk naik ke Super Star', 'Rp [amount] more to reach Super Star'),
      review: L('Peninjauan level berikutnya: 1 Januari 2027', 'Next tier review: 1 January 2027'),
      benefitsTitle: L('Keuntungan Bright Star Anda', 'Your Bright Star benefits'),
      activityTitle: L('Riwayat reward', 'Reward history'),
      colDate: L('TANGGAL', 'DATE'),
      colWhat: L('KETERANGAN', 'DESCRIPTION'),
      colReward: L('REWARD', 'REWARD')
    };
    const menu = [
      { label: L('Dasbor', 'Dashboard'), href: 'account.html' },
      { label: L('Pesanan', 'Orders'), href: 'orders.html' },
      { label: L('Minta buku', 'Request a book'), href: 'request-a-book.html' },
      { label: L('Pre-order', 'Pre-orders'), href: 'pre-order.html' },
      { label: L('Reward Saya', 'My Rewards'), href: 'my-rewards.html', on: true },
      { label: L('Profil toko', 'Store profile'), href: 'account.html' }
    ].map((m) => ({ label: m.label, href: m.href, active: !!m.on, inactive: !m.on }));
    const stats = [
      { label: L('Pembelian 12 bulan terakhir', 'Purchases, last 12 months'), value: 'Rp [—]', note: L('Dihitung dari pesanan yang sudah dibayar', 'Paid orders only') },
      { label: L('Bonus pertumbuhan kuartal ini', 'Growth bonus this quarter'), value: 'Rp [—]', note: L('+[X]% dibanding tahun lalu', '+[X]% vs last year') },
      { label: L('Saldo belanja', 'Store credit'), value: 'Rp [—]', note: L('Bisa dipakai saat checkout', 'Use it at checkout') }
    ];
    const benefits = [
      L('Tambahan diskon [3]% di setiap pesanan', 'Extra [3]% off every order'),
      L('Tempo pembayaran [14] hari', 'Net [14]-day payment terms'),
      L('Stok terjamin untuk buku terbaru', 'Reserved stock on new releases'),
      L('Gratis poster & materi display', 'Free posters and display materials')
    ];
    const activity = [
      { date: L('[tgl]', '[date]'), what: L('Naik ke level Bright Star', 'Moved up to Bright Star'), reward: L('Diskon +[3]%', '+[3]% discount') },
      { date: L('[tgl]', '[date]'), what: L('Bonus pertumbuhan Q3 2026', 'Q3 2026 growth bonus'), reward: 'Rp [—]' },
      { date: L('[tgl]', '[date]'), what: L('Invoice dibayar tepat waktu', 'Invoice paid on time'), reward: '[Reward]' },
      { date: L('[tgl]', '[date]'), what: L('Foto display Star Books disetujui', 'Star Books display photo approved'), reward: '[Reward]' }
    ];
    const langs = [{ id: 'id', label: 'ID' }, { id: 'en', label: 'EN' }].map((x) => ({
      label: x.label, on: lang === x.id, off: lang !== x.id, pick: () => this.setState({ lang: x.id })
    }));
    return {
      t, menu, stats, benefits, activity, langs, progress,
      progressWidth: progress + '%',
      progressLabel: progress + '%'
    };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
