<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Checkout | Star Books and Gifts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="">
<link rel="canonical" href="https://stevetsurface.github.io/sinar-starbooks-preview/checkout.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Star Books and Gifts">
<meta property="og:title" content="Checkout | Star Books and Gifts">
<meta property="og:description" content="">
<meta property="og:url" content="https://stevetsurface.github.io/sinar-starbooks-preview/checkout.html">
<meta property="og:image" content="https://stevetsurface.github.io/sinar-starbooks-preview/assets/logos/star-books-and-gifts.png">
<meta property="og:locale" content="id_ID">
<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

a{color:#5B2A86;text-decoration:none}a:hover{color:#3E1A5E}

</head>
<body>
<template id="dc-template">

<div style="font-family: Figtree, system-ui, sans-serif; color: #1E1A24; background: #FBFAFC; min-height: 100vh">

  <!-- Checkout header: focused, no main nav -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #ECE6F1">
    <div style="max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
      <a href="reseller-home.html" style="display: flex; align-items: center; gap: 10px" aria-label="{{t.homeAria}}">
        <img src="assets/logos/star-books-and-gifts.png" alt="Star Books and Gifts" style="height: 64px; width: auto; display: block"><span style="font-size: 11px; letter-spacing: 2.5px; color: #5B2A86; font-weight: 800; padding-left: 14px; border-left: 1px solid #D9CCE6; line-height: 1.4">PORTAL<br>RESELLER</span>
      </a>
      <ol aria-label="{{t.stepsAria}}" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; font-weight: 600">
        <li style="display: flex; align-items: center; gap: 8px; color: #5B2A86"><span style="width: 26px; height: 26px; border-radius: 50%; background: #5B2A86; color: #FFFFFF; display: grid; place-items: center; font-size: 12px">1</span>{{t.step1}}</li>
        <li style="display: flex; align-items: center; gap: 8px; color: #6E6478"><span style="width: 26px; height: 26px; border-radius: 50%; background: #F1EBF6; color: #5B2A86; display: grid; place-items: center; font-size: 12px">2</span>{{t.step2}}</li>
        <li style="display: flex; align-items: center; gap: 8px; color: #6E6478"><span style="width: 26px; height: 26px; border-radius: 50%; background: #F1EBF6; color: #5B2A86; display: grid; place-items: center; font-size: 12px">3</span>{{t.step3}}</li>
      </ol>
      <a href="account.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #1E1A24; font-weight: 600; font-size: 14px; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>{{t.myAccountBtn}}</a>
      <div role="group" aria-label="Language / Bahasa" style="display: flex; gap: 4px; background: #F1EBF6; padding: 4px; border-radius: 999px">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
          <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
            <button type="button" aria-pressed="true" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
          </sc-if>
          <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
            <button type="button" aria-pressed="false" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #4A4252; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
          </sc-if>
        </sc-for>
      </div>
    </div>
  </header>

  <div style="max-width: 1240px; margin: 0 auto; padding: 40px 24px 80px; display: flex; flex-direction: column; gap: 28px">
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 44px; color: #2A1640">{{t.title}}</h1>

    <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
      <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">

        <!-- Cart lines -->
        <section style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 8px 24px">
          <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
            <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 18px 0; border-bottom: 1px solid #F3EFF6">
              <div style="width: 52px; height: 72px; border-radius: 2px 6px 6px 2px; background: {{l.cover}}; flex: none; position: relative; overflow: hidden"><sc-if value="{{l.hasImg}}" hint-placeholder-val="{{false}}"><img src="{{l.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></sc-if></div>
              <div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <span style="font-weight: 600; font-size: 15px">{{l.title}}</span>
                <span style="font-size: 13px; color: #6E6478">{{l.publisher}} · {{l.unit}} {{t.each}}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 6px">
                <label style="font-size: 13px; color: #6E6478" for="cq-{{$index}}">{{t.qty}}</label>
                <input id="cq-{{$index}}" type="number" value="{{l.qty}}" style="width: 64px; height: 44px; border-radius: 10px; border: 1px solid #D9CCE6; text-align: center; font: inherit; font-size: 15px">
              </div>
              <span style="width: 130px; text-align: right; font-weight: 700; font-size: 16px; color: #2A1640">{{l.total}}</span>
              <button type="button" aria-label="{{t.removeItem}}" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; display: grid; place-items: center; cursor: pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6478" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
              </button>
            </div>
          </sc-for>
          <div style="padding: 16px 0; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 14px">
            <a href="catalog.html" style="font-weight: 600">{{t.continueShopping}}</a>
            <a href="#" style="font-weight: 600">{{t.uploadCsv}}</a>
          </div>
        </section>

        <!-- Recommendations for this order: only after 3 paid orders -->
        <sc-if value="{{recUnlocked}}" hint-placeholder-val="{{true}}">
        <section style="background: #F7F2FB; border: 1px solid #E6DDF0; border-radius: 20px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline">
            <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 22px; color: #2A1640">{{t.recTitle}}</h2>
            <span style="font-size: 13px; color: #6E6478">{{t.recNote}}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px">
            <sc-for list="{{recs}}" as="r" hint-placeholder-count="4">
              <div style="display: flex; gap: 12px; align-items: flex-start; background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 14px; padding: 12px">
                <div style="width: 44px; height: 62px; border-radius: 2px 5px 5px 2px; background: {{r.cover}}; flex: none; position: relative; overflow: hidden"><sc-if value="{{r.hasImg}}" hint-placeholder-val="{{false}}"><img src="{{r.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></sc-if></div>
                <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                  <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.8px; color: {{r.tagInk}}">{{r.tag}}</span>
                  <span style="font-weight: 600; font-size: 14px; line-height: 1.25">{{r.title}}</span>
                  <span style="font-size: 12px; color: #6E6478; line-height: 1.35">{{r.reason}}</span>
                  <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 2px">
                    <span style="font-size: 13px; font-weight: 700; color: #2A1640">{{r.unit}}</span>
                    <sc-if value="{{r.added}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 700; color: #24523A">{{t.recAdded}}</span></sc-if>
                    <sc-if value="{{r.notAdded}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{r.add}}" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #5B2A86; background: #FFFFFF; color: #5B2A86; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap">{{r.cta}}</button></sc-if>
                  </div>
                </div>
              </div>
            </sc-for>
          </div>
        </section>
        </sc-if>

        <!-- Notes -->
        <section style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 24px 28px; display: flex; flex-direction: column; gap: 12px">
          <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px; color: #2A1640">{{t.notesTitle}}</h2>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="notes" style="font-size: 14px; font-weight: 600">{{t.notes}} <span style="font-weight: 400; color: #6E6478">{{t.optional}}</span></label>
            <textarea id="notes" rows="2" placeholder="{{t.notesPh}}" style="border-radius: 12px; border: 1px solid #D9CCE6; padding: 12px 14px; font: inherit; font-size: 15px; resize: vertical"></textarea>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="yourref" style="font-size: 14px; font-weight: 600">{{t.yourRef}} <span style="font-weight: 400; color: #6E6478">{{t.optional}}</span></label>
            <input id="yourref" type="text" placeholder="{{t.yourRefPh}}" style="height: 48px; max-width: 420px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px">
          </div>
        </section>

        <!-- Delivery -->
        <section style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
          <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px; color: #2A1640">{{t.delivery}}</h2>
          <div style="display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; font-size: 14px; color: #4A4252">
            <span><strong>{{t.shipTo}}</strong> {{t.savedAddress}} · <a href="account.html">{{t.changeAddress}}</a></span>
            <span style="color: #6E6478">{{t.weightLine}}</span>
          </div>
          <fieldset style="border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
            <legend style="position: absolute; left: -9999px">{{t.deliveryMethod}}</legend>
            <sc-for list="{{shipOptions}}" as="o" hint-placeholder-count="4">
              <sc-if value="{{o.on}}" hint-placeholder-val="{{true}}">
                <button type="button" aria-pressed="true" onClick="{{o.pick}}" style="display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 18px; border-radius: 14px; border: 2px solid #5B2A86; background: #F7F2FB; cursor: pointer; font: inherit; color: inherit">
                  <span style="width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 5px solid #5B2A86; box-sizing: border-box; flex: none"></span>
                  <span style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0"><span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600">{{o.name}}</span><span style="font-weight: 700; color: #2A1640; white-space: nowrap">{{o.price}}</span></span><span style="font-size: 13px; color: #6E6478">{{o.note}}</span></span>
                </button>
              </sc-if>
              <sc-if value="{{o.off}}" hint-placeholder-val="{{false}}">
                <button type="button" aria-pressed="false" onClick="{{o.pick}}" style="display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 18px; border-radius: 14px; border: 1px solid #D9CCE6; background: #FFFFFF; cursor: pointer; font: inherit; color: inherit">
                  <span style="width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 1.5px solid #B8A6CC; box-sizing: border-box; flex: none"></span>
                  <span style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0"><span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600">{{o.name}}</span><span style="font-weight: 700; color: #2A1640; white-space: nowrap">{{o.price}}</span></span><span style="font-size: 13px; color: #6E6478">{{o.note}}</span></span>
                </button>
              </sc-if>
            </sc-for>
          </fieldset>
          <span style="font-size: 13px; color: #6E6478">{{t.shipNote}}</span>
        </section>

        <!-- Payment -->
        <section style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
          <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px; color: #2A1640">{{t.payment}}</h2>
          <span style="font-size: 14px; color: #4A4252">{{t.payIntro}}</span>
          <fieldset style="border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
            <legend style="position: absolute; left: -9999px">{{t.payMethod}}</legend>
            <sc-for list="{{payOptions}}" as="p" hint-placeholder-count="4">
              <sc-if value="{{p.on}}" hint-placeholder-val="{{true}}">
                <button type="button" aria-pressed="true" onClick="{{p.pick}}" style="display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 18px; border-radius: 14px; border: 2px solid #5B2A86; background: #F7F2FB; cursor: pointer; font: inherit; color: inherit">
                  <span style="width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 5px solid #5B2A86; box-sizing: border-box; flex: none"></span>
                  <span style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0"><span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600">{{p.name}}</span><span style="font-size: 13px; color: #6E6478; white-space: nowrap">{{p.fee}}</span></span><span style="font-size: 13px; color: #6E6478">{{p.note}}</span></span>
                </button>
              </sc-if>
              <sc-if value="{{p.off}}" hint-placeholder-val="{{false}}">
                <button type="button" aria-pressed="false" onClick="{{p.pick}}" style="display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 18px; border-radius: 14px; border: 1px solid #D9CCE6; background: #FFFFFF; cursor: pointer; font: inherit; color: inherit">
                  <span style="width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 1.5px solid #B8A6CC; box-sizing: border-box; flex: none"></span>
                  <span style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0"><span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600">{{p.name}}</span><span style="font-size: 13px; color: #6E6478; white-space: nowrap">{{p.fee}}</span></span><span style="font-size: 13px; color: #6E6478">{{p.note}}</span></span>
                </button>
              </sc-if>
            </sc-for>
          </fieldset>
          <span style="font-size: 13px; color: #6E6478">{{t.payNote}}</span>
        </section>
      </div>

      <!-- Summary -->
      <aside aria-label="{{t.summaryAria}}" style="flex: 1 1 320px; max-width: 400px; background: #2A1640; color: #FFFFFF; border-radius: 24px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px">{{t.summary}}</h2>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #D4C6E2"><span>{{t.retailValue}}</span><span style="text-decoration: line-through">{{retailTotal}}</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #D4C6E2"><span>{{t.savings}}</span><span style="color: #F2B33D">− {{savings}}</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #D4C6E2"><span>{{t.subtotal}}</span><span>{{subtotal}}</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #D4C6E2"><span>{{t.shipping}} · {{shipName}}</span><span style="text-align: right">{{shipCost}}</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #D4C6E2"><span>{{t.tax}}</span><span>{{t.taxValue}}</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #D4C6E2"><span>{{t.payFee}} · {{payName}}</span><span>{{payFeeValue}}</span></div>
        <div style="height: 1px; background: #4A3463"></div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 16px; font-weight: 600">{{t.total}}</span><span style="font-size: 28px; font-weight: 700">{{grandTotal}}</span></div>
          <span style="font-size: 12px; color: #B8A6CC">{{t.totalNote}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #D4C6E2">
          <span style="font-weight: 600; color: #FFFFFF">{{t.payment}}</span>
          <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 12px; background: #3A2354; line-height: 1.5">
            <span style="font-weight: 600; color: #F2B33D">{{payName}}</span>
            <span>{{payWhen}}</span>
          </div>
        </div>
        <a href="#" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #F2B33D; color: #2A1640; font-weight: 700; font-size: 16px; margin-top: 4px">{{t.submit}}</a>
        <span style="font-size: 12px; line-height: 1.5; color: #B8A6CC">{{t.footnote}}</span>
      </aside>
    </div>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"startLanguage":{"editor":"enum","options":["id","en"],"default":"id"},"paidOrders":{"editor":"range","min":0,"max":10,"step":1,"default":3,"section":"Reseller"},"resellerDiscount":{"editor":"range","min":0,"max":50,"step":1,"unit":"%","default":20,"section":"Pricing"},"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
