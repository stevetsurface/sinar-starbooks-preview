  <header style="background: #FFFFFF; border-bottom: 1px solid #ECE6F1">
    <div style="max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
      <a href="reseller-home.html" style="display: flex; align-items: center; gap: 10px" aria-label="{{t.homeAria}}">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" rx="5" fill="#A463BF"></rect><rect x="7" y="7" width="26" height="26" rx="5" fill="#A463BF" transform="rotate(45 20 20)"></rect></svg>
        <span style="display: flex; flex-direction: column; line-height: 1">
          <span style="font-family: 'Avenir Next', Avenir, 'Nunito Sans', 'Century Gothic', sans-serif; font-weight: 400; font-size: 23px; color: #2B2B2B; letter-spacing: 1px">STAR BOOKS</span>
          <span style="font-size: 10px; letter-spacing: 2.5px; color: #2B2B2B; font-family: 'Avenir Next', Avenir, 'Nunito Sans', 'Century Gothic', sans-serif; font-weight: 500; margin-top: 4px">AND GIFTS · RESELLER</span>
        </span>
      </a>

        <li style="display: flex; align-items: center; gap: 8px; color: #6E6478"><span style="width: 26px; height: 26px; border-radius: 50%; background: #F1EBF6; color: #5B2A86; display: grid; place-items: center; font-size: 12px">2</span>{{t.step2}}</li>
        <li style="display: flex; align-items: center; gap: 8px; color: #6E6478"><span style="width: 26px; height: 26px; border-radius: 50%; background: #F1EBF6; color: #5B2A86; display: grid; place-items: center; font-size: 12px">3</span>{{t.step3}}</li>

            <button type="button" aria-pressed="true" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>

          <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
            <button type="button" aria-pressed="false" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #4A4252; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
          </sc-if>
        </sc-for>
      </div>
    </div>

                <span style="font-size: 13px; color: #6E6478">{{l.publisher}} · {{l.unit}} {{t.each}}</span>

              </div>
              <span style="width: 130px; text-align: right; font-weight: 700; font-size: 16px; color: #2A1640">{{l.total}}</span>

              </button>
            </div>
          </sc-for>

            <a href="#" style="font-weight: 600">{{t.uploadCsv}}</a>
          </div>
        </section>

            <div style="display: flex; flex-direction: column; gap: 6px">

          </div>

            <label style="display: flex; gap: 12px; align-items: flex-start; padding: 18px; border-radius: 14px; border: 1px solid #D9CCE6; cursor: pointer">

        </section>

        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #D4C6E2"><span>{{t.savings}}</span><span style="color: #F2B33D">− {{savings}}</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #D4C6E2"><span>{{t.subtotal}}</span><span>{{subtotal}}</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #D4C6E2"><span>{{t.shipping}}</span><span>{{t.free}}</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #D4C6E2"><span>{{t.tax}}</span><span>{{t.taxValue}}</span></div>
        <div style="height: 1px; background: #4A3463"></div>
        <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 16px; font-weight: 600">{{t.total}}</span><span style="font-size: 28px; font-weight: 700">{{subtotal}}</span></div>
        <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #D4C6E2">
          <span style="font-weight: 600; color: #FFFFFF">{{t.payment}}</span>
          <label style="display: flex; gap: 10px; align-items: center"><input type="radio" name="pay" checked style="width: 18px; height: 18px; accent-color: #F2B33D"> {{t.payTransfer}}</label>
          <label style="display: flex; gap: 10px; align-items: center"><input type="radio" name="pay" style="width: 18px; height: 18px; accent-color: #F2B33D"> {{t.payNet}}</label>
        </div>
        <a href="#" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #F2B33D; color: #2A1640; font-weight: 700; font-size: 16px; margin-top: 4px">{{t.submit}}</a>
        <span style="font-size: 12px; line-height: 1.5; color: #B8A6CC">{{t.footnote}}</span>
      </aside>
    </div>
  </div>
</div>
</template>

      tax: L('PPN', 'VAT (PPN)'),
      taxValue: L('Rp 0 · buku bebas PPN', 'Rp 0 · books are PPN-exempt'),
      total: L('Total', 'Total'),
      payment: L('Pembayaran', 'Payment'),
      payTransfer: L('Transfer bank sesuai invoice', 'Bank transfer on invoice'),
      payNet: L('Tempo [30] hari (akun yang disetujui)', 'Net [30] days (approved accounts)'),
      submit: L('Kirim purchase order', 'Submit purchase order'),
      footnote: L('Kami akan mengonfirmasi stok dan mengirim invoice proforma (PDF) ke email Anda. Pantau di Akun › Pesanan.', "We'll confirm stock and send a pro-forma invoice (PDF) to your email. Track it under Account › Orders.")
    };
    const items = [
      { title: "World's Best Dad", publisher: 'Penguin Random House', price: 183308, qty: 12, cover: '#1F3B73' },
      { title: 'Twinkle, Twinkle, Little Sheepy', publisher: 'Penguin Random House', price: 180000, qty: 6, cover: '#7FB7C9' },
      { title: 'The Psychology of Money', publisher: 'Harriman', price: 335000, qty: 6, cover: '#3E7A5A' }
    ];
    let retail = 0, sub = 0;
    const lines = items.map((i) => {
      const unit = i.price * (1 - d / 100);
      retail += i.price * i.qty; sub += unit * i.qty;
      return { ...i, ...coverOf(i.title), unit: fmt(unit), total: fmt(unit * i.qty) };
    });
    const langs = [{ id: 'id', label: 'ID' }, { id: 'en', label: 'EN' }].map((x) => ({
      label: x.label, on: lang === x.id, off: lang !== x.id, pick: () => this.setState({ lang: x.id })
    }));
    return { t, langs, lines, retailTotal: fmt(retail), savings: fmt(retail - sub), subtotal: fmt(sub) };
  }
}
</script>
