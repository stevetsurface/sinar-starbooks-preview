      <a href="index.html" style="display: flex; align-items: center; gap: 10px" aria-label="Star Books and Gifts">

      </a>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
        <a href="account.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #1E1A24; font-weight: 600; font-size: 14px; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>{{t.myAccountBtn}}</a>
        <div role="group" aria-label="Language / Bahasa" style="display: flex; gap: 4px; background: #F1EBF6; padding: 4px; border-radius: 999px">
          <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
            <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
              <button type="button" aria-pressed="true" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
            <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
              <button type="button" aria-pressed="false" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #4A4252; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
          </sc-for>
        </div>
        <a href="catalog.html" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #D9CCE6; color: #1E1A24; font-weight: 600; font-size: 14px">{{t.catalog}}</a>
        <a href="checkout.html" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; background: #5B2A86; color: #FFFFFF; font-weight: 600; font-size: 14px">{{t.cart}}</a>
      </div>
    </div>
    <nav aria-label="{{t.nvAria}}" style="max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 14px; font-weight: 700">
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvBooks}}</a>
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvNonBooks}}</a>
      <a href="about.html#publishers" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvPub}}</a>
      <a href="become-a-reseller.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvReseller}}</a>
      <a href="about.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvAbout}}</a>
      <a href="coming-soon.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvNews}}</a>
      <a href="events.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvEvents}}</a>
      <a href="faq.html#account" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvContact}}</a>
    </nav>
  </header>

  <div style="max-width: 1240px; margin: 0 auto; padding: 40px 24px 96px; display: flex; flex-direction: column; gap: 28px">

    <!-- Intro -->
    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 8px; max-width: 720px">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #5B2A86">{{t.eyebrow}}</span>
        <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 44px; line-height: 1.1; color: #2A1640">{{t.title}}</h1>
        <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #4A4252">{{t.sub}}</p>
      </div>
      <div style="display: flex; gap: 12px; flex-wrap: wrap">
        <div style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 16px; padding: 14px 20px; display: flex; flex-direction: column; gap: 2px; min-width: 150px"><span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #6E6478">{{t.kOpen}}</span><span style="font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 600; color: #2A1640">{{kpiOpen}}</span></div>
        <div style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 16px; padding: 14px 20px; display: flex; flex-direction: column; gap: 2px; min-width: 150px"><span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #6E6478">{{t.kMine}}</span><span style="font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 600; color: #2A1640">{{kpiMine}}</span></div>
        <div style="background: #2A1640; color: #FFFFFF; border-radius: 16px; padding: 14px 20px; display: flex; flex-direction: column; gap: 2px; min-width: 150px"><span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #B8A6CC">{{t.kResellers}}</span><span style="font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 600; color: #F2B33D">{{kpiResellers}}</span></div>
      </div>
    </div>

    <!-- How it works -->
    <section style="background: #2A1640; color: #FFFFFF; border-radius: 24px; padding: 24px 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; gap: 14px; align-items: flex-start">
          <span style="flex: none; width: 30px; height: 30px; border-radius: 50%; background: #F2B33D; color: #2A1640; display: grid; place-items: center; font-weight: 800; font-size: 14px">{{s.n}}</span>
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 15px">{{s.title}}</span><span style="font-size: 14px; line-height: 1.5; color: #D4C6E2">{{s.body}}</span></span>
        </div>
      </sc-for>
    </section>

    <!-- Filters -->
    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <sc-if value="{{f.on}}" hint-placeholder-val="{{true}}">
          <button type="button" aria-pressed="true" onClick="{{f.pick}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{f.label}}</button>
        </sc-if>
        <sc-if value="{{f.off}}" hint-placeholder-val="{{false}}">
          <button type="button" aria-pressed="false" onClick="{{f.pick}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #1E1A24; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{f.label}}</button>
        </sc-if>
      </sc-for>
      <span style="margin-left: auto; font-size: 14px; color: #6E6478">{{t.sortNote}}</span>
    </div>

    <sc-if value="{{confirmed}}" hint-placeholder-val="{{false}}">
      <div role="status" style="display: flex; gap: 12px; align-items: center; padding: 16px 20px; border-radius: 16px; background: #DDEBDD; color: #24523A; font-weight: 600; font-size: 15px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
        <span>{{confirmMsg}}</span>
      </div>
    </sc-if>
    <div style="display: flex; flex-direction: column; gap: 16px">
      <sc-for list="{{campaigns}}" as="c" hint-placeholder-count="5">
        <article style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 22px 24px; display: flex; flex-wrap: wrap; gap: 20px 28px; align-items: center">
          <div style="width: 84px; height: 118px; border-radius: 3px 8px 8px 3px; background: {{c.cover}}; flex: none; position: relative; overflow: hidden; box-shadow: 0 6px 16px rgba(42,22,64,.15)"><sc-if value="{{c.hasImg}}" hint-placeholder-val="{{false}}"><img src="{{c.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></sc-if></div>
          <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
              <span style="font-size: 11px; font-weight: 800; letter-spacing: 1px; padding: 5px 10px; border-radius: 999px; background: {{c.chipBg}}; color: {{c.chipInk}}">{{c.status}}</span>
              <span style="font-size: 13px; color: #6E6478">{{c.publisher}} · {{c.format}}</span>
            </div>
            <span style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; color: #2A1640; line-height: 1.2">{{c.title}}</span>
            <span style="font-size: 14px; color: #4A4252">{{c.author}}</span>
            <div style="display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: #6E6478; margin-top: 4px">

              <span>{{t.cutoff}} <strong style="color: #B0476A">{{c.cutoff}}</strong></span>
              <span>{{t.eta}} <strong style="color: #1E1A24">{{c.eta}}</strong></span>
            </div>
          </div>
          <div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; justify-content: space-between; font-size: 13px; color: #4A4252"><span>{{t.committed}}</span><span><strong style="color: #2A1640">{{c.committed}}</strong> / {{c.target}} {{t.copies}}</span></div>
            <div style="height: 10px; border-radius: 999px; background: #F1EBF6; overflow: hidden"><div style="height: 100%; width: {{c.pct}}; background: {{c.barColor}}; border-radius: 999px"></div></div>
            <div style="display: flex; justify-content: space-between; font-size: 13px; color: #6E6478"><span>{{c.resellers}} {{t.resellersIn}}</span><span>{{c.pctLabel}}</span></div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #4A4252; margin-top: 2px">
              <span>{{t.retail}} <s style="color: #6E6478">{{c.retail}}</s></span>
              <span>{{t.yourPrice}} <strong style="color: #2A1640; font-size: 15px">{{c.price}}</strong> <span style="color: #5B2A86; font-weight: 700">{{c.disc}}</span></span>
              <span>{{t.moq}} <strong style="color: #1E1A24">{{c.moq}}</strong></span>
            </div>
          </div>
          <sc-if value="{{c.open}}" hint-placeholder-val="{{true}}">
            <div style="flex: 0 1 230px; display: flex; flex-direction: column; gap: 8px">
              <sc-if value="{{c.mine}}" hint-placeholder-val="{{false}}">

              <div style="display: flex; gap: 8px; align-items: center">

              <span style="line-height: 1.5">{{c.closedBody}}</span>

          </sc-if>

      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: baseline">

      <div style="overflow-x: auto">
        <div style="min-width: 720px">
          <div style="display: grid; grid-template-columns: minmax(0, 2.2fr) 70px 130px 150px 170px minmax(0, 1.4fr); gap: 16px; padding: 10px 0; font-size: 12px; font-weight: 800; letter-spacing: 0.8px; color: #6E6478; border-bottom: 1px solid #ECE6F1">

          </div>
          <sc-for list="{{mine}}" as="m" hint-placeholder-count="4">
            <div style="display: grid; grid-template-columns: minmax(0, 2.2fr) 70px 130px 150px 170px minmax(0, 1.4fr); gap: 16px; padding: 14px 0; font-size: 15px; border-bottom: 1px solid #F3EFF6; align-items: center">
              <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600">{{m.title}}</span><span style="font-size: 13px; color: #6E6478">{{m.meta}}</span></span>
              <span>{{m.qty}}</span>
              <span>{{m.value}}</span>
              <span style="font-size: 14px; color: #4A4252">{{m.deposit}}</span>
              <span style="justify-self: start; font-size: 12px; font-weight: 800; letter-spacing: 0.5px; padding: 6px 10px; border-radius: 999px; background: {{m.chipBg}}; color: {{m.chipInk}}">{{m.status}}</span>
              <span style="font-size: 14px; color: #4A4252">{{m.next}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </section>

    <!-- Request a campaign -->
    <a href="request-a-book.html" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 28px; border-radius: 20px; background: #F1EBF6; color: #2A1640">
      <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600">{{t.suggestTitle}}</span><span style="font-size: 15px; color: #4A4252">{{t.suggestBody}}</span></span>
      <span style="display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; background: #5B2A86; color: #FFFFFF; font-weight: 700; font-size: 14px">{{t.suggestCta}}</span>
    </a>
  </div>
</div>
</template>
