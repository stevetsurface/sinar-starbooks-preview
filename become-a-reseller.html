<body>
<template id="dc-template">

<div style="font-family: Figtree, system-ui, sans-serif; color: #1E1A24; background: #FBFAFC; min-height: 100vh">

  <!-- Header (logged out) -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #ECE6F1">
    <div style="max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="reseller-home.html" style="display: flex; align-items: center; gap: 10px" aria-label="{{t.homeAria}}">
        <img src="assets/logos/star-books-and-gifts.png" alt="Star Books and Gifts" style="height: 64px; width: auto; display: block"><span style="font-size: 11px; letter-spacing: 2.5px; color: #5B2A86; font-weight: 800; padding-left: 14px; border-left: 1px solid #D9CCE6; line-height: 1.4">PORTAL<br>RESELLER</span>
      </a>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
        <a href="account.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #1E1A24; font-weight: 600; font-size: 14px; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>{{t.myAccountBtn}}</a>
        <div role="group" aria-label="Language / Bahasa" style="display: flex; gap: 4px; background: #F1EBF6; padding: 4px; border-radius: 999px">
          <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
            <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
              <button type="button" aria-pressed="true" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
            <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
              <button type="button" aria-pressed="false" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #4A4252; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
          </sc-for>
        </div>
        <a href="account.html" style="display: flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #D9CCE6; color: #1E1A24; font-weight: 600; font-size: 14px">{{t.login}}</a>
      </div>
    </div>
    <nav aria-label="{{t.nvAria}}" style="max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 14px; font-weight: 700">
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvBooks}}</a>
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvNonBooks}}</a>
      <a href="about.html#publishers" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvPub}}</a>
      <a href="become-a-reseller.html" style="color: #5B2A86; padding: 12px 0 14px; border-bottom: 3px solid #5B2A86">{{t.nvReseller}}</a>
      <a href="about.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvAbout}}</a>
      <a href="coming-soon.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvNews}}</a>
      <a href="events.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvEvents}}</a>
      <a href="faq.html#account" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvContact}}</a>
    </nav>
  </header>

  <!-- Hero + form -->
  <section style="background: #F1EBF6">
    <div style="max-width: 1240px; margin: 0 auto; padding: 72px 24px; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start">
      <div style="flex: 1 1 440px; display: flex; flex-direction: column; gap: 24px">
        <span style="align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; color: #5B2A86; background: #FFFFFF; padding: 8px 14px; border-radius: 999px">{{t.eyebrow}}</span>
        <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 56px; line-height: 1.04; letter-spacing: -1px; color: #2A1640">{{t.heroTitle}}</h1>
        <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #4A4252; max-width: 520px">{{t.heroSub}}</p>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; font-size: 16px">
          <li style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B2A86" stroke-width="2.2" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg><span><strong>{{t.b1Bold}}</strong> {{t.b1Rest}}</span></li>
          <li style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B2A86" stroke-width="2.2" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg><span><strong>{{t.b2Bold}}</strong>{{t.b2Rest}}</span></li>
          <li style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B2A86" stroke-width="2.2" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg><span><strong>{{t.b3Bold}}</strong> {{t.b3Rest}}</span></li>
          <li style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B2A86" stroke-width="2.2" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg><span><strong>{{t.b4Bold}}</strong> {{t.b4Rest}}</span></li>
        </ul>
      </div>

      <div style="flex: 1 1 440px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
      <form aria-labelledby="rp-title" style="background: #FFFFFF; border-radius: 28px; padding: 36px; box-shadow: 0 24px 60px rgba(42,22,64,0.10); display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">
        <h2 id="rp-title" style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px; color: #2A1640">{{t.formTitle}}</h2>

        <sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
          <div role="status" style="display: flex; flex-direction: column; gap: 14px; background: #EEF6EE; border: 1px solid #CFE3CF; border-radius: 20px; padding: 28px">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2E7D4F" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m7 12 3.5 3.5L17 9"></path></svg>
            <strong style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; color: #1F4D33">{{t.sentTitle}}</strong>
            <span style="font-size: 15px; line-height: 1.6; color: #2F4A3A">{{t.sentBody}}</span>
            <a href="catalog.html" style="align-self: flex-start; display: flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 14px; background: #5B2A86; color: #FFFFFF; font-weight: 700; font-size: 15px">{{t.sentCta}}</a>
          </div>
        </sc-if>

        <sc-if value="{{notSent}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 20px">
            <!-- Step indicator -->
            <ol aria-label="{{t.stepsAria}}" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px">
              <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
                <sc-if value="{{s.cur}}" hint-placeholder-val="{{false}}">
                  <li aria-current="step" style="display: flex; align-items: center; gap: 8px; font-weight: 700; color: #2A1640">
                    <span style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 999px; background: #5B2A86; color: #FFFFFF; font-size: 14px; font-weight: 800">{{s.n}}</span>{{s.label}}
                  </li>
                </sc-if>
                <sc-if value="{{s.done}}" hint-placeholder-val="{{false}}">
                  <li style="display: flex; align-items: center; gap: 8px; font-weight: 600; color: #5B2A86">
                    <span style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 999px; background: #E6DDF0; color: #5B2A86"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>{{s.label}}
                  </li>
                </sc-if>
                <sc-if value="{{s.todo}}" hint-placeholder-val="{{true}}">
                  <li style="display: flex; align-items: center; gap: 8px; font-weight: 600; color: #6E6478">
                    <span style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 999px; border: 1.5px solid #D9CCE6; color: #6E6478; font-size: 14px; font-weight: 800; box-sizing: border-box">{{s.n}}</span>{{s.label}}
                  </li>
                </sc-if>
              </sc-for>
            </ol>
            <span style="font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #6E6478">{{stepOf}}</span>

            <!-- Step 1: account type + login data -->
            <sc-if value="{{s1}}" hint-placeholder-val="{{true}}">
              <div style="display: flex; flex-direction: column; gap: 18px">
                <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
                  <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 10px">{{t.typeLegend}}</legend>
                  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px">
                    <sc-for list="{{types}}" as="ty" hint-placeholder-count="2">
                      <sc-if value="{{ty.on}}" hint-placeholder-val="{{false}}">
                        <button type="button" aria-pressed="true" onClick="{{ty.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; padding: 18px; border-radius: 18px; border: 2px solid #5B2A86; background: #F6F0FA; color: #1E1A24; font: inherit; cursor: pointer">
                          <span style="display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px">
                            <strong style="font-family: Fraunces, Georgia, serif; font-size: 19px; font-weight: 600; color: #2A1640">{{ty.title}}</strong>
                            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#5B2A86"></circle><path d="m7 12 3.5 3.5L17 9" fill="none" stroke="#FFFFFF" stroke-width="2.4"></path></svg>
                          </span>
                          <span style="font-size: 14px; line-height: 1.5; color: #4A4252">{{ty.desc}}</span>
                          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: #5B2A86; background: #FFFFFF; padding: 4px 10px; border-radius: 999px">{{ty.verify}}</span>
                        </button>
                      </sc-if>
                      <sc-if value="{{ty.off}}" hint-placeholder-val="{{true}}">
                        <button type="button" aria-pressed="false" onClick="{{ty.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; padding: 18px; border-radius: 18px; border: 2px solid #ECE6F1; background: #FFFFFF; color: #1E1A24; font: inherit; cursor: pointer">
                          <span style="display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px">
                            <strong style="font-family: Fraunces, Georgia, serif; font-size: 19px; font-weight: 600; color: #2A1640">{{ty.title}}</strong>
                            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#C9B6DC" stroke-width="2"></circle></svg>
                          </span>
                          <span style="font-size: 14px; line-height: 1.5; color: #4A4252">{{ty.desc}}</span>
                          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: #6E6478; background: #F1EBF6; padding: 4px 10px; border-radius: 999px">{{ty.verify}}</span>
                        </button>
                      </sc-if>
                    </sc-for>
                  </div>
                </fieldset>
                <sc-if value="{{isBadan}}" hint-placeholder-val="{{false}}">
                  <span style="font-size: 13px; line-height: 1.5; color: #4A4252; background: #FBF8FD; border-radius: 12px; padding: 10px 14px">{{t.picNote}}</span>
                </sc-if>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
                  <div style="display: flex; flex-direction: column; gap: 6px">
                    <label for="rp-first" style="font-size: 14px; font-weight: 600">{{t.fFirst}}</label>
                    <input id="rp-first" type="text" autocomplete="given-name" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px">
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 6px">
                    <label for="rp-last" style="font-size: 14px; font-weight: 600">{{t.fLast}}</label>
                    <input id="rp-last" type="text" autocomplete="family-name" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px">
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 6px">
                    <label for="rp-email" style="font-size: 14px; font-weight: 600">{{t.fEmail}}</label>
                    <input id="rp-email" type="email" autocomplete="email" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px">
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 6px">
                    <label for="rp-wa" style="font-size: 14px; font-weight: 600">{{t.fWhatsapp}}</label>
                    <input id="rp-wa" type="tel" autocomplete="tel" placeholder="+62" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px">
                  </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <label for="rp-pass" style="font-size: 14px; font-weight: 600">{{t.fPassword}}</label>
                  <input id="rp-pass" type="password" autocomplete="new-password" aria-describedby="rp-pass-hint" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px">
                  <span id="rp-pass-hint" style="font-size: 13px; color: #6E6478">{{t.passHint}}</span>
                </div>
              </div>
            </sc-if>

            <!-- Step 2: business data -->
            <sc-if value="{{s2}}" hint-placeholder-val="{{false}}">
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
                <div style="display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1">
                  <label for="rp-store" style="font-size: 14px; font-weight: 600">{{t.fStore}}</label>
                  <input id="rp-store" type="text" autocomplete="organization" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px">
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <label for="rp-cat" style="font-size: 14px; font-weight: 600">{{t.fCategory}}</label>
                  <select id="rp-cat" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 12px; font: inherit; font-size: 15px; background: #FFFFFF">
                    <option>{{t.optBookshop}}</option><option>{{t.optGift}}</option><option>{{t.optOnline}}</option><option>{{t.optSchool}}</option><option>{{t.optOther}}</option>
                  </select>
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <label for="rp-vol" style="font-size: 14px; font-weight: 600">{{t.fVolume}}</label>
                  <select id="rp-vol" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 12px; font: inherit; font-size: 15px; background: #FFFFFF">
                    <option>{{t.vol1}}</option><option>{{t.vol2}}</option><option>{{t.vol3}}</option><option>{{t.vol4}}</option>
                  </select>
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1">
                  <label for="rp-addr" style="font-size: 14px; font-weight: 600">{{t.fAddress}}</label>
                  <textarea id="rp-addr" rows="3" autocomplete="street-address" style="border-radius: 12px; border: 1px solid #D9CCE6; padding: 12px 14px; font: inherit; font-size: 15px; resize: vertical"></textarea>
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <label for="rp-city" style="font-size: 14px; font-weight: 600">{{t.fCity}}</label>
                  <input id="rp-city" type="text" autocomplete="address-level2" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px">
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <label for="rp-district" style="font-size: 14px; font-weight: 600">{{t.fDistrict}}</label>
                  <input id="rp-district" type="text" autocomplete="address-level3" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px">
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <label for="rp-post" style="font-size: 14px; font-weight: 600">{{t.fPostcode}}</label>
                  <input id="rp-post" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="5" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px">
                </div>
              </div>
            </sc-if>

            <!-- Step 3: documents + submit -->
            <sc-if value="{{s3}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-direction: column; gap: 16px">
                <span style="align-self: flex-start; font-size: 13px; font-weight: 700; color: #5B2A86; background: #F1EBF6; padding: 6px 12px; border-radius: 999px">{{typeChip}}</span>
                <sc-if value="{{isPerorangan}}" hint-placeholder-val="{{true}}">
                  <div style="display: flex; flex-direction: column; gap: 6px">
                    <label for="rp-nik" style="font-size: 14px; font-weight: 600">{{t.fNik}}</label>
                    <input id="rp-nik" type="text" inputmode="numeric" maxlength="16" aria-describedby="rp-nik-note" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px">
                    <span id="rp-nik-note" style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6E6478"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>{{t.nikNote}}</span>
                  </div>
                </sc-if>
                <sc-if value="{{isBadan}}" hint-placeholder-val="{{false}}">
                  <div style="display: flex; flex-direction: column; gap: 16px">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
                      <div style="display: flex; flex-direction: column; gap: 6px">
                        <label for="rp-npwp" style="font-size: 14px; font-weight: 600">{{t.fNpwp}}</label>
                        <input id="rp-npwp" type="text" inputmode="numeric" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px">
                      </div>
                      <div style="display: flex; flex-direction: column; gap: 6px">
                        <label for="rp-nib" style="font-size: 14px; font-weight: 600">{{t.fNib}}</label>
                        <input id="rp-nib" type="text" inputmode="numeric" maxlength="13" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px">
                      </div>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">

      { bg: '#F1EBF6', title: L('Rekomendasi untuk toko Anda', 'Picks for your shop'), body: L('Portal mengingatkan judul yang perlu dipesan ulang, buku yang akan terbit sesuai rak Anda, dan yang dibeli reseller serupa. Satu klik masuk ke PO.', 'The portal flags titles to reorder, upcoming books that fit your shelves, and what similar resellers buy. One click adds them to your PO.') },
      { bg: '#FDE9C4', title: L('Bayar dan kirim tanpa ribet', 'Easy payment and delivery'), body: L('Virtual account, QRIS, kartu, atau transfer. Ongkir dihitung saat checkout (JNE, J&T Cargo, instan Jabodetabek) atau ambil sendiri di gudang Jakarta. Beli putus, tanpa minimum tahunan.', 'Virtual account, QRIS, card or transfer. Shipping quoted at checkout (JNE, J&T Cargo, instant in Jabodetabek) or pick up at our Jakarta warehouse. Outright purchase, no annual minimum.') },
      { bg: '#E6DDF0', title: L('Materi promo dan dukungan penjualan', 'Promo material and sales support'), body: L('Poster dan materi display, konten media sosial untuk setiap rilis besar, undangan IIBF dan peluncuran buku, serta PO, invoice, dan pelacakan dalam satu akun.', 'Posters and display material, social content for every big release, IIBF and launch invitations, and POs, invoices and tracking in one account.') }
    ];
    return {
      t, benefits, langs, steps, types, next, back, submit,
      stepOf: L('LANGKAH ' + step + ' DARI 3', 'STEP ' + step + ' OF 3'),
      typeChip: type === 'badan' ? t.typeBizTitle : t.typePerTitle,
      s1: step === 1, s2: step === 2, s3: step === 3,
      isPerorangan: type !== 'badan', isBadan: type === 'badan',
      showBack: step > 1, noBack: step === 1,
      showNext: step < 3, showSubmit: step === 3,
      sent, notSent: !sent
    };
  }
}
</script>
