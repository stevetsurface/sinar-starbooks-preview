<template id="dc-template">

<div style="font-family: Figtree, system-ui, sans-serif; color: #1E1A24; background: #FBFAFC; min-height: 100vh">

  <!-- Header -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #ECE6F1">
    <div style="max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="reseller-home.html" style="display: flex; align-items: center; gap: 10px" aria-label="Star Books and Gifts">
        <img src="assets/logos/star-books-and-gifts.png" alt="Star Books and Gifts" style="height: 64px; width: auto; display: block"><span style="font-size: 11px; letter-spacing: 2.5px; color: #5B2A86; font-weight: 800; padding-left: 14px; border-left: 1px solid #D9CCE6; line-height: 1.4">PORTAL<br>RESELLER</span>
      </a>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
        <a href="account.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #1E1A24; font-weight: 600; font-size: 14px; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>{{t.myAccountBtn}}</a>
        <div role="group" aria-label="Language / Bahasa" style="display: flex; gap: 4px; background: #F1EBF6; padding: 4px; border-radius: 999px">
          <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
            <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
              <button type="button" aria-pressed="true" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
            <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
              <button type="button" aria-pressed="false" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #4A4252; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
            </sc-if>
          </sc-for>
        </div>
        <a href="catalog.html" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #D9CCE6; color: #1E1A24; font-weight: 600; font-size: 14px">{{t.catalog}}</a>
        <a href="checkout.html" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; background: #5B2A86; color: #FFFFFF; font-weight: 600; font-size: 14px">{{t.cart}}</a>
      </div>
    </div>
    <nav aria-label="{{t.nvAria}}" style="max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 14px; font-weight: 700">
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvBooks}}</a>
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvNonBooks}}</a>
      <a href="about.html#publishers" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvPub}}</a>
      <a href="become-a-reseller.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvReseller}}</a>
      <a href="about.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvAbout}}</a>
      <a href="coming-soon.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvNews}}</a>
      <a href="faq.html#account" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvContact}}</a>
    </nav>
  </header>

  <div style="max-width: 1240px; margin: 0 auto; padding: 40px 24px 96px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

    <!-- Account menu -->
    <nav aria-label="{{t.accountNav}}" style="flex: 1 1 220px; max-width: 260px; display: flex; flex-direction: column; gap: 4px; background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 12px; box-sizing: border-box">
      <span style="padding: 12px 14px 8px; font-size: 13px; color: #6E6478">{{t.storeName}}</span>
      <sc-for list="{{menu}}" as="m" hint-placeholder-count="5">
        <sc-if value="{{m.active}}" hint-placeholder-val="{{false}}">
          <a href="{{m.href}}" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; background: #F1EBF6; color: #5B2A86; font-weight: 700; font-size: 15px">{{m.label}}</a>
        </sc-if>
        <sc-if value="{{m.inactive}}" hint-placeholder-val="{{true}}">
          <a href="{{m.href}}" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; color: #1E1A24; font-weight: 500; font-size: 15px">{{m.label}}</a>
        </sc-if>
      </sc-for>
    </nav>

    <main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 44px; color: #2A1640">{{t.title}}</h1>
          <span style="font-size: 15px; color: #6E6478">{{t.sub}}</span>
        </div>
        <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #D9CCE6; background: #FFFFFF; min-width: 260px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6478" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <span style="position: absolute; left: -9999px">{{t.search}}</span>
          <input type="search" placeholder="{{t.search}}" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 14px; background: transparent">
        </label>
      </div>

      <!-- Status filters -->
      <div role="tablist" aria-label="{{t.filterLabel}}" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="7">
          <sc-if value="{{f.on}}" hint-placeholder-val="{{false}}">
            <button type="button" role="tab" aria-selected="true" onClick="{{f.pick}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{f.label}} · {{f.count}}</button>
          </sc-if>
          <sc-if value="{{f.off}}" hint-placeholder-val="{{true}}">
            <button type="button" role="tab" aria-selected="false" onClick="{{f.pick}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #4A4252; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{f.label}} · {{f.count}}</button>
          </sc-if>
        </sc-for>
      </div>

      <!-- Orders -->
      <div style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{orders}}" as="o" hint-placeholder-count="6">
          <article style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; overflow: hidden">
            <button type="button" onClick="{{o.toggle}}" aria-expanded="{{o.expanded}}" style="width: 100%; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 20px 24px; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer">
              <span style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 3px">
                <span style="font-weight: 800; font-size: 16px">{{o.no}}</span>
                <span style="font-size: 13px; color: #6E6478">{{t.yourRef}}: {{o.ref}} · {{o.date}}</span>
              </span>
              <span style="font-size: 14px; color: #4A4252">{{o.itemsLabel}} · {{t.disc}} {{o.discLabel}}</span>
              <span style="width: 140px; text-align: right; font-weight: 800; font-size: 16px">{{o.totalLabel}}</span>
              <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.5px; padding: 6px 10px; border-radius: 999px; background: {{o.chipBg}}; color: {{o.chipInk}}">{{o.status}}</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6478" stroke-width="2" aria-hidden="true"><path d="{{o.chevron}}"></path></svg>
            </button>

            <sc-if value="{{o.open}}" hint-placeholder-val="{{false}}">
              <div style="border-top: 1px solid #F3EFF6; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px; background: #FCFBFD">
                <sc-if value="{{o.hasTimeline}}" hint-placeholder-val="{{true}}">
                  <ol aria-label="{{t.timeline}}" style="list-style: none; margin: 0; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 4px; align-items: center; background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 14px">
                    <sc-for list="{{o.steps}}" as="sp" hint-placeholder-count="6">
                      <li aria-current="{{sp.aria}}" style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{sp.ink}}; font-weight: {{sp.weight}}">
                        <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 999px; background: {{sp.dot}}; box-shadow: 0 0 0 3px {{sp.ring}}"></span>
                        <span>{{sp.label}}</span>
                        <sc-if value="{{sp.arrow}}" hint-placeholder-val="{{true}}">
                          <span aria-hidden="true" style="color: #B8A6CC; margin: 0 6px">→</span>
                        </sc-if>
                      </li>
                    </sc-for>
                  </ol>
                </sc-if>
                <sc-if value="{{o.hasReason}}" hint-placeholder-val="{{false}}">
                  <div role="note" style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-radius: 14px; background: #F8DCE3; color: #8A2443; font-size: 14px">
                    <strong>{{o.status}}</strong>
                    <span>{{o.reason}}</span>
                  </div>
                </sc-if>
                <div style="overflow-x: auto">
                  <div style="min-width: 560px">
                    <div style="display: grid; grid-template-columns: minmax(0, 3fr) 60px 120px 130px; gap: 12px; padding: 8px 0; font-size: 12px; font-weight: 800; letter-spacing: 0.8px; color: #6E6478; border-bottom: 1px solid #ECE6F1">
                      <span>{{t.colTitle}}</span><span>{{t.colQty}}</span><span>{{t.colUnit}}</span><span style="text-align: right">{{t.colSub}}</span>
                    </div>
                    <sc-for list="{{o.lines}}" as="ln" hint-placeholder-count="3">
                      <div style="display: grid; grid-template-columns: minmax(0, 3fr) 60px 120px 130px; gap: 12px; padding: 10px 0; font-size: 14px; border-bottom: 1px solid #F3EFF6">
                        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{ln.title}}</span><span style="font-size: 12px; color: #6E6478">{{ln.isbn}} · {{t.retail}} {{ln.retail}}</span></span>
                        <span>{{ln.qty}}</span>
                        <span>{{ln.unit}}</span>
                        <span style="text-align: right; font-weight: 700">{{ln.sub}}</span>
                      </div>
                    </sc-for>
                  </div>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: flex-start">
                  <div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #4A4252">
                    <span><strong style="color: #1E1A24">{{t.payment}}:</strong> {{o.payment}}</span>
                    <span><strong style="color: #1E1A24">{{t.shipping}}:</strong> {{o.ship}}</span>
                    <sc-if value="{{o.hasCourier}}" hint-placeholder-val="{{false}}">
                      <span><strong style="color: #1E1A24">{{t.courier}}:</strong> {{o.courier}}</span>
                    </sc-if>
                    <span><strong style="color: #1E1A24">{{t.poDoc}}:</strong> {{o.poFile}}</span>
                  </div>
                  <div style="min-width: 260px; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
                    <div style="display: flex; justify-content: space-between; gap: 16px"><span style="color: #6E6478">{{t.books}}</span><span>{{o.subLabel}}</span></div>
                    <div style="display: flex; justify-content: space-between; gap: 16px"><span style="color: #6E6478">{{t.shipCost}}</span><span>{{o.shipLabel}}</span></div>
                    <div style="display: flex; justify-content: space-between; gap: 16px; font-weight: 800; font-size: 16px; padding-top: 6px; border-top: 1px solid #ECE6F1"><span>{{o.totalCaption}}</span><span>{{o.totalLabel}}</span></div>
                  </div>
                </div>
                <sc-if value="{{o.awaitTransfer}}" hint-placeholder-val="{{false}}">
                  <div role="note" style="padding: 12px 16px; border-radius: 14px; background: #FDE9C4; color: #6B4A00; font-size: 14px; font-weight: 600">{{t.transferInfo}}</div>
                </sc-if>
                <div style="display: flex; flex-wrap: wrap; gap: 10px">
                  <a href="#" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #1E1A24; font-weight: 600; font-size: 14px">{{t.poPdf}}</a>
                  <sc-if value="{{o.hasInvoice}}" hint-placeholder-val="{{false}}">
                    <a href="#" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #1E1A24; font-weight: 600; font-size: 14px">{{t.invoice}}</a>
                  </sc-if>
                  <a href="checkout.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 12px; background: #5B2A86; color: #FFFFFF; font-weight: 700; font-size: 14px">{{t.reorder}}</a>
                </div>
              </div>
            </sc-if>
          </article>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #6E6478">{{t.terms}}</span>
    </main>
  </div>
</div>
</template>

      processing: { status: L('SIAP KIRIM', 'READY TO SHIP'), chipBg: '#E1E5F7', chipInk: '#2F3A7A', step: 3, group: 'moving' },
      shipped: { status: L('DIKIRIM', 'SHIPPED'), chipBg: '#E6DDF0', chipInk: '#5B2A86', step: 4, group: 'moving' },
      done: { status: L('SELESAI', 'COMPLETE'), chipBg: '#DDEBDD', chipInk: '#24523A', step: 5, group: 'done' },
      rejected: { status: L('DIBATALKAN · STOK', 'CANCELLED · STOCK'), chipBg: '#F8DCE3', chipInk: '#8A2443', step: -1, group: 'closed' },
      cancelled: { status: L('DIBATALKAN', 'CANCELLED'), chipBg: '#ECEAEE', chipInk: '#5A5260', step: -1, group: 'closed' }
    };
    const stepLabels = [L('Dibuat', 'Placed'), L('Dibayar', 'Paid'), L('Dikemas', 'Packing'), L('Siap kirim', 'Ready'), L('Dikirim', 'Shipped'), L('Selesai', 'Complete')];
    const openId = st.open === undefined ? 'ORD-202610-0014' : st.open;
    const filter = st.filter || 'all';
    const all = raw.map((o) => {
      const s = S[o.s];
      let sub = 0, qty = 0;
      const lines = o.lines.map(([k, q]) => {
        const b = books[k]; const unit = b.price * (1 - o.disc / 100); sub += unit * q; qty += q;
        return { title: b.title, isbn: b.isbn, retail: fmt(b.price), qty: q, unit: fmt(unit), sub: fmt(unit * q) };
      });
      const closed = s.step < 0;
      const shipKnown = o.ship !== null;
      let ship, shipLabel;
      if (o.pickup) {
        ship = L('Ambil sendiri di gudang', 'Pick up at our warehouse');
        shipLabel = L('Rp 0 · ambil sendiri', 'Rp 0 · pickup');
      } else if (closed) {
        ship = L('Ongkir: dikonfirmasi tim kami', 'Shipping: confirmed by our team');
        shipLabel = '—';
      } else if (!shipKnown) {
        ship = L('Ongkir: dikonfirmasi tim kami · menunggu konfirmasi', 'Shipping: confirmed by our team · awaiting confirmation');
        shipLabel = L('Menunggu konfirmasi', 'Awaiting confirmation');
      } else {
        ship = L('Ongkir: dikonfirmasi tim kami · ', 'Shipping: confirmed by our team · ') + fmt(o.ship);
        shipLabel = fmt(o.ship);
      }
      const total = sub + (shipKnown ? o.ship : 0);
      const steps = stepLabels.map((label, i) => {
        const done = i < s.step, cur = i === s.step;
        return {
          label, arrow: i < stepLabels.length - 1, aria: cur ? 'step' : 'false',
          dot: cur ? '#5B2A86' : (done ? '#A463BF' : '#FFFFFF'),
          ring: cur ? '#E6DDF0' : (done ? '#F1EBF6' : '#D9CCE6'),
          ink: cur ? '#2A1640' : (done ? '#4A4252' : '#9A90A4'),
          weight: cur ? '800' : '500'
        };
      });
      const isOpen = openId === o.no;
      return Object.assign({}, s, {
        no: o.no, ref: o.ref, date: o.date, s: o.s, lines,
        itemsLabel: qty + ' ' + L('buku', 'books'), discLabel: o.disc + '%',
        subLabel: fmt(sub), shipLabel, totalLabel: fmt(total),
        totalCaption: (!o.pickup && !shipKnown && !closed) ? L('Total (belum termasuk ongkir)', 'Total (excl. shipping)') : 'Total',
        payment: o.pay, ship, courier: o.courier || '', hasCourier: !!o.courier, poFile: o.no + '.pdf',
        steps, hasTimeline: !closed, hasReason: closed, reason: o.reason || '',
        awaitTransfer: o.s === 'approved', hasInvoice: s.step >= 2,
        open: isOpen, expanded: isOpen ? 'true' : 'false',
        chevron: isOpen ? 'm6 15 6-6 6 6' : 'm6 9 6 6 6-6',
        toggle: () => this.setState({ open: isOpen ? null : o.no })
      });
    });
    const defs = [
      ['all', L('Semua', 'All')], ['submitted', L('Menunggu pembayaran', 'Awaiting payment')], ['verified', L('Dibayar', 'Paid')],
      ['approved', L('Dikemas', 'Packing')], ['moving', L('Siap kirim & Dikirim', 'Ready & Shipped')],
      ['done', L('Selesai', 'Complete')], ['closed', L('Dibatalkan', 'Cancelled')]
    ];
    const filters = defs.map(([id, label]) => ({
      label, count: id === 'all' ? all.length : all.filter((o) => o.group === id).length,
      on: filter === id, off: filter !== id, pick: () => this.setState({ filter: id })
    }));
    const orders = filter === 'all' ? all : all.filter((o) => o.group === filter);
    const menu = [
      { label: L('Dasbor', 'Dashboard'), href: 'account.html' },
      { label: L('Pesanan', 'Orders'), href: 'orders.html', on: true },
      { label: L('Minta buku', 'Request a book'), href: 'request-a-book.html' },
      { label: L('Pre-order', 'Pre-orders'), href: 'pre-order.html' },
      { label: L('Reward Saya', 'My Rewards'), href: 'my-rewards.html' },
      { label: L('Profil toko', 'Store profile'), href: 'account.html' }
    ].map((m) => ({ label: m.label, href: m.href, active: !!m.on, inactive: !m.on }));
    const langs = [{ id: 'id', label: 'ID' }, { id: 'en', label: 'EN' }].map((x) => ({
      label: x.label, on: lang === x.id, off: lang !== x.id, pick: () => this.setState({ lang: x.id })
    }));
    return { t, orders, filters, menu, langs };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
