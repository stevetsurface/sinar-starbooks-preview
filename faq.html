        [L('Bisakah saya memesan dengan purchase order (PO)?', 'Can I order with a purchase order (PO)?'), L('Tidak perlu PO. Kirim pesanan awal di website tanpa pembayaran; kami konfirmasi stok dan kirim tagihan saat buku siap dikirim. Sekolah atau institusi yang wajib memakai PO bisa menghubungi tim kami.', 'No PO needed. Place a pre-purchase order on the site with no payment; we confirm stock and invoice when the books are ready to ship. Schools or institutions that must use a PO can contact our team.')],
        [L('Bisakah saya memesan banyak judul sekaligus?', 'Can I order many titles at once?'), L('Bisa. Gunakan tampilan daftar atau ringkas di katalog untuk mengisi jumlah banyak judul sekaligus, atau unggah daftar pesanan Anda dalam Excel/CSV (maks. 2 MB) di keranjang.', 'Yes. Use the list or compact view in the catalog to enter quantities for many titles at once, or upload your order list as Excel/CSV (max. 2 MB) in the cart.')],
        [L('Bisakah saya pre-order buku baru?', 'Can I pre-order new releases?'), L('Bisa, lewat halaman Pre-order. Pesanan semua reseller digabung menjadi satu pesanan ke penerbit; Anda membayar deposit [30]% saat tutup pesanan dan sisanya sebelum pengiriman. Jumlah bisa diubah sampai tutup pesanan.', 'Yes, on the Pre-order page. All resellers’ orders are pooled into one publisher order; you pay a [30]% deposit at cut-off and the balance before shipping. Quantities can be changed until cut-off.')],
        [L('Saya tidak tahu harus pesan apa. Bisa dibantu?', 'I don’t know what to order. Can you help?'), L('Bisa. Buka "Bantu saya memilih": pilih jenis toko, anggaran, dan fokus, lalu kami susun pesanan dari judul yang terbukti laku di toko sejenis. Beranda reseller juga menampilkan judul untuk dipesan ulang dan yang akan terbit sesuai rak Anda.', 'Yes. Open "Help me choose": pick your shop type, budget and focus, and we build an order from titles proven to sell in shops like yours. Your reseller home also shows titles to reorder and upcoming releases that fit your shelves.')],
        [L('Bisakah kalian mencarikan judul yang tidak ada di katalog?', "Can you source a title that isn't in the catalog?"), L('Bisa. Gunakan menu "Minta buku" di akun Anda. Kami mengecek ke penerbit dan mengirim harga serta perkiraan waktu tiba lewat email atau WhatsApp dalam 2–3 hari kerja.', 'Yes. Use "Request a book" in your account. We check with our publishers and send the price and arrival estimate by email or WhatsApp within 2–3 working days.')]
      ] },
      { id: 'payment', title: L('Pembayaran & pajak', 'Payment & tax'), items: [
        [L('Apakah saya harus membayar saat memesan?', 'Do I pay when I order?'), L('Tidak ada pembayaran saat mengirim pesanan. Untuk judul yang stoknya belum tersedia (pesanan awal), uang muka 30% dari total pembelian ditagih setelah stok dikonfirmasi, dan pelunasan setelah invoice terbit. Untuk stok yang sudah tersedia, pembayaran penuh setelah invoice terbit.', 'Nothing is paid when you place the order. For titles not yet in stock (pre-purchase orders), a 30% deposit of the purchase total is billed once stock is confirmed, with the balance due after the invoice is issued. For in-stock titles, full payment is due after the invoice is issued.')],
        [L('Bagaimana cara membayar tagihan?', 'How do I pay the invoice?'), L('Virtual account (BCA, Mandiri, BNI, BRI), QRIS, kartu kredit/debit, atau transfer bank manual dengan unggah bukti. Semua pembelian beli putus.', 'Virtual account (BCA, Mandiri, BNI, BRI), QRIS, credit/debit card, or manual bank transfer with proof upload. All purchases are outright.')],
        [L('Apakah harga sudah termasuk PPN?', 'Do prices include VAT (PPN)?'), L('Ya, harga yang tampil sudah termasuk PPN.', 'Yes, the prices shown include VAT (PPN).')],
        [L('Bisakah saya mendapat faktur pajak?', 'Can I get a tax invoice (faktur pajak)?'), L('Bisa. Sinar Starbooks adalah PKP, dan faktur pajak diterbitkan untuk alat tulis dan hadiah.', 'Yes. Sinar Starbooks is VAT-registered (PKP) and issues a faktur pajak for stationery and gifts.')],
        [L('Di mana saya bisa mengunduh invoice?', 'Where can I download invoices?'), L('Di Akun Saya › Pesanan.', 'Under My Account › Orders.')]
      ] },
      { id: 'shipping', title: L('Pengiriman & retur', 'Shipping & returns'), items: [
        [L('Siapa yang membayar ongkos kirim?', 'Who pays for shipping?'), L('Ongkos kirim ditanggung pembeli. Anda juga bisa mengambil pesanan sendiri di gudang kami di Jakarta.', 'Shipping is paid by the buyer. You can also collect your order from our Jakarta warehouse.')],
        [L('Kurir apa yang tersedia dan berapa ongkirnya?', 'Which couriers are available and what does shipping cost?'), L('Saat checkout Anda memilih JNE Reguler, J&T Cargo (untuk pesanan besar), atau kurir instan untuk Jabodetabek. Ongkir dihitung dari berat dan tujuan; ongkir final tercantum di tagihan.', 'At checkout you choose JNE Regular, J&T Cargo (for large orders) or an instant courier within Jabodetabek. Shipping follows the courier’s rates by weight and destination; the final rate is on your invoice.')],
        [L('Kapan pesanan saya dikirim?', 'When does my order ship?'), L('Setelah stok siap dan tagihan lunas, pesanan dikemas dalam [1] hari kerja. Nomor resi muncul di Akun Saya › Pesanan.', 'Once stock is ready and the invoice is paid, orders are packed within [1] working day. The tracking number appears under My Account › Orders.')],
        [L('Bagaimana cara melacak pesanan?', 'How do I track my order?'), L('Buka Akun Saya › Pesanan untuk melihat status dan nomor resi setiap pesanan.', 'Go to My Account › Orders to see each order’s status and tracking number.')],
        [L('Bisakah saya meretur stok yang tidak terjual?', 'Can I return unsold stock?'), L('Tidak. Barang yang sudah dibeli tidak dapat diretur.', 'No. Goods that have been purchased cannot be returned.')],
        [L('Bagaimana jika buku tiba dalam kondisi rusak?', 'What if books arrive damaged?'), L('Bisa diganti dengan syarat dan ketentuan. Hubungi kami lewat WhatsApp segera setelah barang diterima dengan menyertakan foto.', 'They can be replaced, subject to terms and conditions. Contact us on WhatsApp as soon as the goods arrive, with photos.')]
      ] },
      { id: 'account', title: L('Akun & kontak', 'Account & contact'), items: [
        [L('Bisakah saya mengganti bahasa website?', 'Can I switch the website language?'), L('Bisa, gunakan tombol ID / EN di bagian atas setiap halaman.', 'Yes, use the ID / EN button at the top of every page.')],
        [L('Bisakah beberapa staf memakai satu akun reseller?', 'Can several staff share one reseller account?'), L('Ya. Untuk mempermudah operasional, kami menyarankan satu akun untuk satu reseller.', 'Yes. To keep things simple, we recommend one account per reseller.')],
        [L('Bagaimana cara menghubungi kalian?', 'How do I contact you?'), L('WhatsApp 0811-8069-559, telepon +62 21 4404188, email info@sinarstarbook.com, Instagram atau Threads @sinarstarbooks, atau LinkedIn (Sinar Starbooks). Toko resmi kami juga ada di Shopee dan Tokopedia.', 'WhatsApp 0811-8069-559, phone +62 21 4404188, email info@sinarstarbook.com, Instagram or Threads @sinarstarbooks, or LinkedIn (Sinar Starbooks). Our official stores are also on Shopee and Tokopedia.')]
      ] }
    ];
    const sections = raw.map((s) => ({
      id: s.id, anchor: '#' + s.id, title: s.title,
      items: s.items.map(([q, a]) => ({ q, a, pending: a.indexOf('[') !== -1 }))
    }));
    const langs = [{ id: 'id', label: 'ID' }, { id: 'en', label: 'EN' }].map((x) => ({
      label: x.label, on: lang === x.id, off: lang !== x.id, pick: () => this.setState({ lang: x.id })
    }));
    const anyPending = sections.some((sec) => sec.items.some((q) => q.pending));
    return { t, sections, langs, anyPending };
  }
}
</script>
