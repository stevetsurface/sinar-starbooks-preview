<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Star Books and Gifts — FAQ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFAFC}
a{color:#5B2A86;text-decoration:none}a:hover{color:#3E1A5E}
summary{list-style:none}summary::-webkit-details-marker{display:none}
</style>

</head>
<body>
<template id="dc-template">

<div style="font-family: Figtree, system-ui, sans-serif; color: #1E1A24; background: #FBFAFC; min-height: 100vh">

  <!-- Header -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #ECE6F1">
    <div style="max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
      <a href="index.html" style="display: flex; align-items: center; gap: 10px" aria-label="Star Books and Gifts">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" rx="5" fill="#A463BF"></rect><rect x="7" y="7" width="26" height="26" rx="5" fill="#A463BF" transform="rotate(45 20 20)"></rect></svg>
        <span style="display: flex; flex-direction: column; line-height: 1">
          <span style="font-family: 'Avenir Next', Avenir, 'Nunito Sans', 'Century Gothic', sans-serif; font-weight: 400; font-size: 23px; color: #2B2B2B; letter-spacing: 1px">STAR BOOKS</span>
          <span style="font-size: 10px; letter-spacing: 2.5px; color: #2B2B2B; font-family: 'Avenir Next', Avenir, 'Nunito Sans', 'Century Gothic', sans-serif; font-weight: 500; margin-top: 4px">AND GIFTS</span>
        </span>
      </a>
      <a href="account.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #D9CCE6; background: #FFFFFF; color: #1E1A24; font-weight: 600; font-size: 14px; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>{{t.myAccountBtn}}</a>
      <div role="group" aria-label="Language / Bahasa" style="display: flex; gap: 4px; background: #F1EBF6; padding: 4px; border-radius: 999px">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
          <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
            <button type="button" aria-pressed="true" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
          </sc-if>
          <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
            <button type="button" aria-pressed="false" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #4A4252; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
          </sc-if>
        </sc-for>
      </div>
    </div>
    <nav aria-label="{{t.nvAria}}" style="max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 14px; font-weight: 700">
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvBooks}}</a>
      <a href="catalog.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvNonBooks}}</a>
      <a href="about.html#publishers" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvPub}}</a>
      <a href="become-a-reseller.html" style="color: #5B2A86; padding: 12px 0 14px; border-bottom: 3px solid #5B2A86">{{t.nvReseller}}</a>
      <a href="about.html" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvAbout}}</a>
      <a href="faq.html#account" style="color: #1E1A24; padding: 12px 0 14px">{{t.nvContact}}</a>
    </nav>
  </header>

  <!-- Intro -->
  <section style="background: #F1EBF6">
    <div style="max-width: 960px; margin: 0 auto; padding: 64px 24px 48px; display: flex; flex-direction: column; gap: 16px">
      <span style="font-size: 13px; font-weight: 800; letter-spacing: 2px; color: #5B2A86">FAQ</span>
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 52px; line-height: 1.05; color: #2A1640">{{t.title}}</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #4A4252; max-width: 640px">{{t.sub}}</p>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px">
        <sc-for list="{{sections}}" as="sec" hint-placeholder-count="8">
          <a href="{{sec.anchor}}" style="display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; color: #2A1640; font-weight: 600; font-size: 14px">{{sec.title}}</a>
        </sc-for>
      </div>
    </div>
  </section>

  <!-- Questions -->
  <div style="max-width: 960px; margin: 0 auto; padding: 48px 24px 96px; display: flex; flex-direction: column; gap: 40px">
    <sc-if value="{{anyPending}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; gap: 10px; align-items: center; padding: 14px 18px; border-radius: 14px; background: #FDE9C4; color: #6B4A00; font-size: 14px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
      <span>{{t.pendingNote}}</span>
    </div>
    </sc-if>

    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="8">
      <section id="{{sec.id}}" style="display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 24px">
        <h2 style="margin: 0 0 4px; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px; color: #2A1640">{{sec.title}}</h2>
        <sc-for list="{{sec.items}}" as="q" hint-placeholder-count="4">
          <details style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 16px; padding: 18px 22px">
            <summary style="display: flex; justify-content: space-between; align-items: center; gap: 16px; cursor: pointer; font-weight: 700; font-size: 16px; color: #1E1A24">
              <span style="display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center">
                <span>{{q.q}}</span>
                <sc-if value="{{q.pending}}" hint-placeholder-val="{{false}}">
                  <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.5px; padding: 4px 8px; border-radius: 999px; background: #FDE9C4; color: #6B4A00">{{t.pendingChip}}</span>
                </sc-if>
              </span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6478" stroke-width="2" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg>
            </summary>
            <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.65; color: #4A4252">{{q.a}}</p>
          </details>
        </sc-for>
      </section>
    </sc-for>

    <a href="https://wa.me/" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding: 28px; border-radius: 24px; background: #2A1640; color: #FFFFFF">
      <span style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px">{{t.moreTitle}}</span>
        <span style="font-size: 15px; color: #D4C6E2">{{t.moreBody}}</span>
      </span>
      <span style="display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 999px; background: #F2B33D; color: #2A1640; font-weight: 800; font-size: 15px">{{t.moreCta}}</span>
    </a>
  </div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"startLanguage":{"editor":"enum","options":["id","en"],"default":"id"},"$preview":{"width":1440,"height":3200}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const lang = st.lang || this.props.startLanguage || 'id';
    const L = (id, en) => (lang === 'id' ? id : en);
    const t = {
      nvAria: L('Menu utama', 'Main menu'), nvBooks: L('Buku ▾', 'Books ▾'), nvNonBooks: L('Non Buku ▾', 'Non Books ▾'), nvPub: L('Penerbit ▾', 'Publishers ▾'), nvReseller: L('Untuk Reseller ▾', 'For Resellers ▾'), nvAbout: L('Tentang Kami ▾', 'About Us ▾'), nvContact: L('Kontak', 'Contact'), myAccountBtn: L('Akun Saya', 'My Account'),
      navAria: L('Menu utama', 'Main menu'),
      navBooks: L('Buku', 'Books'), navReseller: L('Untuk Reseller', 'For Reseller'), navAbout: L('Tentang Kami', 'About Us'),
      title: L('Pertanyaan yang sering diajukan', 'Frequently asked questions'),
      sub: L('Semua tentang Sinar Starbooks, menjadi reseller, harga, pemesanan, pembayaran, dan pengiriman.', 'Everything about Sinar Starbooks, becoming a reseller, prices, ordering, payment and shipping.'),
      pendingNote: L('Draf: beberapa jawaban masih menunggu konfirmasi tim Sinar Star dan ditandai dengan [ ].', 'Draft: some answers are still waiting for the Sinar Star team and are marked with [ ].'),
      pendingChip: L('MENUNGGU KONFIRMASI', 'TO BE CONFIRMED'),
      moreTitle: L('Masih ada pertanyaan?', 'Still have a question?'),
      moreBody: L('Tim kami siap membantu lewat WhatsApp.', 'Our team is happy to help on WhatsApp.'),
      moreCta: L('Chat dengan kami', 'Chat with us')
    };
    const raw = [
      { id: 'about', title: L('Tentang Sinar Starbooks', 'About Sinar Starbooks'), items: [
        [L('Siapa Sinar Starbooks?', 'Who is Sinar Starbooks?'), L('Importir dan distributor buku, alat tulis, dan hadiah berbahasa Inggris yang berdiri di Jakarta sejak 2000. Kami membeli langsung dari penerbit AS dan Inggris dan memasok lebih dari 100 toko di seluruh Indonesia.', 'An importer and distributor of English-language books, stationery and gifts, founded in Jakarta in 2000. We buy directly from US and UK publishers and supply 100+ stores across Indonesia.')],
        [L('Penerbit apa saja yang bekerja sama dengan kalian?', 'Which publishers do you work with?'), L('Penguin Random House, HarperCollins, Hachette, Simon & Schuster, Macmillan, Bloomsbury, Scholastic, Hay House, dan lainnya. Brand hadiah antara lain Kikkerland dan Fred.', 'Penguin Random House, HarperCollins, Hachette, Simon & Schuster, Macmillan, Bloomsbury, Scholastic, Hay House and more. Gift brands include Kikkerland and Fred.')],
        [L('Di mana lokasi kalian?', 'Where are you located?'), 'Jl. Cendrawasih No. 7, Sukapura, Jakarta Utara 14140.'],
        [L('Apakah kalian menjual ke pembeli perorangan?', 'Do you sell to individual readers?'), L('Tidak. Sinar Starbooks hanya melayani penjualan grosir untuk usaha yang menjual kembali, bukan penjualan eceran.', 'No. Sinar Starbooks sells wholesale only, to businesses that resell. We do not sell retail.')]
      ] },
      { id: 'reseller', title: L('Menjadi reseller', 'Becoming a reseller'), items: [
        [L('Siapa yang bisa menjadi reseller?', 'Who can become a reseller?'), L('Usaha yang menjual kembali buku dan hadiah, seperti toko buku, toko hadiah, dan penjual online. Untuk sekolah dan institusi, silakan hubungi kami.', 'Businesses that resell books and gifts, such as bookshops, gift stores and online sellers. Schools and institutions, please contact us.')],
        [L('Bagaimana cara mendaftar?', 'How do I register?'), L('Isi formulir pendaftaran reseller dengan data usaha dan kontak Anda, lalu bayar deposit Rp 1.000.000.', 'Fill in the reseller application with your business and contact details, then pay a Rp 1,000,000 deposit.')],
        [L('Berapa lama deposit berlaku?', 'How long is the deposit valid?'), L('Deposit Rp 1.000.000 berlaku selama 3 bulan.', 'The Rp 1,000,000 deposit is valid for 3 months.')],
        [L('Kapan akun saya disetujui?', 'When is my account approved?'), L('Tim kami akan meninjau pengajuan Anda dan menghubungi Anda lewat email atau WhatsApp.', 'Our team reviews your application and contacts you by email or WhatsApp.')],
        [L('Kenapa harga reseller tidak terlihat?', "Why can't I see reseller prices?"), L('Harga reseller akan muncul setelah akun Anda disetujui dan Anda masuk (login).', 'Reseller prices appear once your account is approved and you are logged in.')]
      ] },
      { id: 'pricing', title: L('Harga & diskon', 'Prices & discounts'), items: [
        [L('Berapa diskon untuk reseller?', 'How much discount do resellers get?'), L('Diskon dihitung dari nilai pembelian, mulai 20% untuk pembelian Rp 1.000.000 ke atas, dan naik untuk pembelian yang lebih besar.', 'The discount depends on the purchase value, starting at 20% for purchases of Rp 1,000,000 or more and rising for larger purchases.')],
        [L('Apakah ada minimum pembelian?', 'Is there a minimum purchase?'), L('Diskon reseller berlaku mulai pembelian Rp 1.000.000.', 'The reseller discount applies from Rp 1,000,000 per purchase.')],
        [L('Apa itu Star, Bright Star, dan Super Star?', 'What are Star, Bright Star and Super Star?'), L('Tiga level reseller kami. Level ditentukan dari total pembelian Anda, dan level yang lebih tinggi mendapat diskon serta keuntungan yang lebih besar.', 'Our three reseller levels. Your level is based on your total purchases, and higher levels get bigger discounts and more benefits.')],
        [L('Bagaimana dengan komik dan manga?', 'What about comics and manga?'), L('Pembelian komik minimal Rp 3.000.000 mendapat diskon 10%.', 'Comic purchases of at least Rp 3,000,000 get 10% off.')]
      ] },
      { id: 'ordering', title: L('Pemesanan', 'Ordering'), items: [
        [L('Bisakah saya memesan dengan purchase order (PO)?', 'Can I order with a purchase order (PO)?'), L('Bisa. Masukkan nomor PO dan unggah dokumen PO saat checkout.', 'Yes. Enter your PO number and upload your PO document at checkout.')],
        [L('Bisakah saya memesan banyak judul sekaligus?', 'Can I order many titles at once?'), L('Bisa. Gunakan tampilan daftar atau ringkas di katalog untuk mengisi jumlah banyak judul sekaligus.', 'Yes. Use the list or compact view in the catalog to enter quantities for many titles at once.')],
        [L('Bisakah saya pre-order buku baru?', 'Can I pre-order new releases?'), L('Bisa. Judul pre-order ditandai di katalog beserta perkiraan tanggal tibanya.', 'Yes. Pre-order titles are marked in the catalog with their expected arrival date.')],
        [L('Bisakah kalian mencarikan judul yang tidak ada di katalog?', "Can you source a title that isn't in the catalog?"), L('Bisa. Gunakan menu "Minta buku" di akun Anda. Kami akan mengecek ke penerbit dan mengabari harga serta perkiraan waktu tiba.', 'Yes. Use "Request a book" in your account. We check with our publishers and let you know the price and arrival time.')]
      ] },
      { id: 'payment', title: L('Pembayaran & pajak', 'Payment & tax'), items: [
        [L('Bagaimana cara membayar?', 'How do I pay?'), L('Pembayaran tunai atau transfer bank (beli putus).', 'By cash or bank transfer (outright purchase).')],
        [L('Apakah harga sudah termasuk PPN?', 'Do prices include VAT (PPN)?'), L('Buku dibebaskan dari PPN, jadi tidak ada PPN pada buku. Harga alat tulis dan hadiah sudah termasuk PPN.', 'Books are exempt from VAT (PPN), so there is no PPN on books. Stationery and gift prices include PPN.')],
        [L('Bisakah saya mendapat faktur pajak?', 'Can I get a tax invoice (faktur pajak)?'), L('Bisa. Sinar Starbooks adalah PKP, dan faktur pajak diterbitkan untuk alat tulis dan hadiah.', 'Yes. Sinar Starbooks is VAT-registered (PKP) and issues a faktur pajak for stationery and gifts.')],
        [L('Di mana saya bisa mengunduh invoice?', 'Where can I download invoices?'), L('Di Akun Saya › Pesanan & PO.', 'Under My Account › Orders & POs.')]
      ] },
      { id: 'shipping', title: L('Pengiriman & retur', 'Shipping & returns'), items: [
        [L('Siapa yang membayar ongkos kirim?', 'Who pays for shipping?'), L('Ongkos kirim ditanggung pembeli. Anda juga bisa mengambil pesanan sendiri di gudang kami di Jakarta.', 'Shipping is paid by the buyer. You can also collect your order from our Jakarta warehouse.')],
        [L('Bagaimana cara melacak pesanan?', 'How do I track my order?'), L('Buka Akun Saya › Pesanan & PO untuk melihat status dan nomor resi setiap pesanan.', 'Go to My Account › Orders & POs to see each order’s status and tracking number.')],
        [L('Bisakah barang diretur?', 'Can I return goods?'), L('Barang yang sudah dibeli tidak dapat diretur.', 'Goods that have been purchased cannot be returned.')]
      ] },
      { id: 'account', title: L('Akun & kontak', 'Account & contact'), items: [
        [L('Bisakah saya mengganti bahasa website?', 'Can I switch the website language?'), L('Bisa, gunakan tombol ID / EN di bagian atas setiap halaman.', 'Yes, use the ID / EN button at the top of every page.')],
        [L('Bagaimana cara menghubungi kalian?', 'How do I contact you?'), L('Telepon +62 21 4404188, email info@sinarstarbook.com, atau Instagram @sinarstarbooks.', 'Phone +62 21 4404188, email info@sinarstarbook.com, or Instagram @sinarstarbooks.')]
      ] }
    ];
    const sections = raw.map((s) => ({
      id: s.id, anchor: '#' + s.id, title: s.title,
      items: s.items.map(([q, a]) => ({ q, a, pending: a.indexOf('[') !== -1 }))
    }));
    const langs = [{ id: 'id', label: 'ID' }, { id: 'en', label: 'EN' }].map((x) => ({
      label: x.label, on: lang === x.id, off: lang !== x.id, pick: () => this.setState({ lang: x.id })
    }));
    const anyPending = sections.some((sec) => sec.items.some((q) => q.pending));
    return { t, sections, langs, anyPending };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
