<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sinar Starbooks — Checkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFAFC}
a{color:#5B2A86;text-decoration:none}a:hover{color:#3E1A5E}
</style>

</head>
<body>
<template id="dc-template">

<div style="font-family: Figtree, system-ui, sans-serif; color: #1E1A24; background: #FBFAFC; min-height: 100vh">

  <!-- Checkout header: focused, no main nav -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #ECE6F1">
    <div style="max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px" aria-label="{{t.homeAria}}">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" rx="5" fill="#A463BF"></rect><rect x="7" y="7" width="26" height="26" rx="5" fill="#A463BF" transform="rotate(45 20 20)"></rect></svg>
        <span style="display: flex; flex-direction: column; line-height: 1">
          <span style="font-family: 'Avenir Next', Avenir, 'Nunito Sans', 'Century Gothic', sans-serif; font-weight: 400; font-size: 23px; color: #2B2B2B; letter-spacing: 1px">STAR BOOKS</span>
          <span style="font-size: 10px; letter-spacing: 2.5px; color: #2B2B2B; font-family: 'Avenir Next', Avenir, 'Nunito Sans', 'Century Gothic', sans-serif; font-weight: 500; margin-top: 4px">AND GIFTS · RESELLER</span>
        </span>
      </a>
      <ol aria-label="{{t.stepsAria}}" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; font-weight: 600">
        <li style="display: flex; align-items: center; gap: 8px; color: #5B2A86"><span style="width: 26px; height: 26px; border-radius: 50%; background: #5B2A86; color: #FFFFFF; display: grid; place-items: center; font-size: 12px">1</span>{{t.step1}}</li>
        <li style="display: flex; align-items: center; gap: 8px; color: #6E6478"><span style="width: 26px; height: 26px; border-radius: 50%; background: #F1EBF6; color: #5B2A86; display: grid; place-items: center; font-size: 12px">2</span>{{t.step2}}</li>
        <li style="display: flex; align-items: center; gap: 8px; color: #6E6478"><span style="width: 26px; height: 26px; border-radius: 50%; background: #F1EBF6; color: #5B2A86; display: grid; place-items: center; font-size: 12px">3</span>{{t.step3}}</li>
      </ol>
      <div role="group" aria-label="Language / Bahasa" style="display: flex; gap: 4px; background: #F1EBF6; padding: 4px; border-radius: 999px">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
          <sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
            <button type="button" aria-pressed="true" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: #5B2A86; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
          </sc-if>
          <sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
            <button type="button" aria-pressed="false" onClick="{{l.pick}}" style="height: 40px; min-width: 52px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #4A4252; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{l.label}}</button>
          </sc-if>
        </sc-for>
      </div>
    </div>
  </header>

  <div style="max-width: 1240px; margin: 0 auto; padding: 40px 24px 80px; display: flex; flex-direction: column; gap: 28px">
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 44px; color: #2A1640">{{t.title}}</h1>

    <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
      <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">

        <!-- Cart lines -->
        <section style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 8px 24px">
          <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
            <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 18px 0; border-bottom: 1px solid #F3EFF6">
              <div style="width: 52px; height: 72px; border-radius: 2px 6px 6px 2px; background: {{l.cover}}; flex: none"></div>
              <div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <span style="font-weight: 600; font-size: 15px">{{l.title}}</span>
                <span style="font-size: 13px; color: #6E6478">{{l.publisher}} · {{l.unit}} {{t.each}}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 6px">
                <label style="font-size: 13px; color: #6E6478" for="cq-{{$index}}">{{t.qty}}</label>
                <input id="cq-{{$index}}" type="number" value="{{l.qty}}" style="width: 64px; height: 44px; border-radius: 10px; border: 1px solid #D9CCE6; text-align: center; font: inherit; font-size: 15px">
              </div>
              <span style="width: 130px; text-align: right; font-weight: 700; font-size: 16px; color: #2A1640">{{l.total}}</span>
              <button type="button" aria-label="{{t.removeItem}}" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; display: grid; place-items: center; cursor: pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6478" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
              </button>
            </div>
          </sc-for>
          <div style="padding: 16px 0; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 14px">
            <a href="Catalog.dc.html" style="font-weight: 600">{{t.continueShopping}}</a>
            <a href="#" style="font-weight: 600">{{t.uploadCsv}}</a>
          </div>
        </section>

        <!-- PO details -->
        <section style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 20px">
          <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px; color: #2A1640">{{t.poTitle}}</h2>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="po" style="font-size: 14px; font-weight: 600">{{t.poNumber}}</label>
              <input id="po" type="text" placeholder="{{t.poPh}}" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px">
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="ref" style="font-size: 14px; font-weight: 600">{{t.yourRef}} <span style="font-weight: 400; color: #6E6478">{{t.optional}}</span></label>
              <input id="ref" type="text" placeholder="{{t.refPh}}" style="height: 48px; border-radius: 12px; border: 1px solid #D9CCE6; padding: 0 14px; font: inherit; font-size: 15px">
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 14px; font-weight: 600">{{t.attachPo}}</span>
            <label for="pofile" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border: 1.5px dashed #C9B6DC; border-radius: 14px; padding: 20px; background: #FBF8FD; cursor: pointer">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B2A86" stroke-width="1.8" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"></path></svg>
              <span style="font-size: 14px; color: #4A4252"><strong style="color: #5B2A86">{{t.chooseFile}}</strong> {{t.dragHint}}</span>
            </label>
            <input id="pofile" type="file" style="position: absolute; left: -9999px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="notes" style="font-size: 14px; font-weight: 600">{{t.notes}}</label>
            <textarea id="notes" rows="3" placeholder="{{t.notesPh}}" style="border-radius: 12px; border: 1px solid #D9CCE6; padding: 12px 14px; font: inherit; font-size: 15px; resize: vertical"></textarea>
          </div>
        </section>

        <!-- Delivery -->
        <section style="background: #FFFFFF; border: 1px solid #ECE6F1; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
          <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px; color: #2A1640">{{t.delivery}}</h2>
          <fieldset style="border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
            <legend style="position: absolute; left: -9999px">{{t.deliveryMethod}}</legend>
            <label style="display: flex; gap: 12px; align-items: flex-start; padding: 18px; border-radius: 14px; border: 2px solid #5B2A86; background: #F7F2FB; cursor: pointer">
              <input type="radio" name="ship" checked style="width: 18px; height: 18px; margin-top: 2px; accent-color: #5B2A86">
              <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 600">{{t.shipStore}}</span><span style="font-size: 13px; color: #6E6478">{{t.savedAddress}}</span></span>
            </label>
            <label style="display: flex; gap: 12px; align-items: flex-start; padding: 18px; border-radius: 14px; border: 1px solid #D9CCE6; cursor: pointer">
              <input type="radio" name="ship" style="width: 18px; height: 18px; margin-top: 2px; accent-color: #5B2A86">
              <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 600">{{t.ownCourier}}</span><span style="font-size: 13px; color: #6E6478">{{t.ownCourierNote}}</span></span>
            </label>
          </fieldset>
        </section>
      </div>

      <!-- Summary -->
      <aside aria-label="{{t.summaryAria}}" style="flex: 1 1 320px; max-width: 400px; background: #2A1640; color: #FFFFFF; border-radius: 24px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px">{{t.summary}}</h2>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #D4C6E2"><span>{{t.retailValue}}</span><span style="text-decoration: line-through">{{retailTotal}}</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #D4C6E2"><span>{{t.savings}}</span><span style="color: #F2B33D">− {{savings}}</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #D4C6E2"><span>{{t.subtotal}}</span><span>{{subtotal}}</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #D4C6E2"><span>{{t.shipping}}</span><span>{{t.free}}</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: #D4C6E2"><span>{{t.tax}}</span><span>{{t.taxValue}}</span></div>
        <div style="height: 1px; background: #4A3463"></div>
        <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 16px; font-weight: 600">{{t.total}}</span><span style="font-size: 28px; font-weight: 700">{{subtotal}}</span></div>
        <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #D4C6E2">
          <span style="font-weight: 600; color: #FFFFFF">{{t.payment}}</span>
          <label style="display: flex; gap: 10px; align-items: center"><input type="radio" name="pay" checked style="width: 18px; height: 18px; accent-color: #F2B33D"> {{t.payTransfer}}</label>
          <label style="display: flex; gap: 10px; align-items: center"><input type="radio" name="pay" style="width: 18px; height: 18px; accent-color: #F2B33D"> {{t.payNet}}</label>
        </div>
        <a href="#" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #F2B33D; color: #2A1640; font-weight: 700; font-size: 16px; margin-top: 4px">{{t.submit}}</a>
        <span style="font-size: 12px; line-height: 1.5; color: #B8A6CC">{{t.footnote}}</span>
      </aside>
    </div>
  </div>
</div>
</template>
<div id="dc-root"></div>
<a href="index.html" style="position:fixed;left:16px;bottom:16px;z-index:50;background:#2A1640;color:#fff;font:600 12px/1 Figtree,system-ui,sans-serif;padding:10px 14px;border-radius:999px;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.2)">Design preview · all screens</a>
<script type="text/x-dc" data-dc-script data-props='{"startLanguage":{"editor":"enum","options":["id","en"],"default":"id"},"resellerDiscount":{"editor":"range","min":0,"max":50,"step":1,"unit":"%","default":20,"section":"Pricing"},"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = (this.state && this.state.lang) || this.props.startLanguage || 'id';
    const L = (id, en) => (lang === 'id' ? id : en);
    const d = this.props.resellerDiscount ?? 20;
    const fmt = (n) => 'Rp ' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const t = {
      homeAria: L('Beranda Sinar Starbooks', 'Sinar Starbooks home'),
      stepsAria: L('Langkah checkout', 'Checkout steps'),
      step1: L('Keranjang & PO', 'Cart & PO'),
      step2: L('Tinjau', 'Review'),
      step3: L('Konfirmasi', 'Confirmation'),
      title: L('Pesanan Anda', 'Your order'),
      each: L('/ eksemplar', 'each'),
      qty: L('Jumlah', 'Qty'),
      removeItem: L('Hapus item', 'Remove item'),
      continueShopping: L('← Lanjut belanja', '← Continue shopping'),
      uploadCsv: L('Unggah daftar pesanan (CSV)', 'Upload a CSV order list'),
      poTitle: L('Purchase order', 'Purchase order'),
      poNumber: L('Nomor PO', 'PO number'),
      poPh: L('mis. PO-2026-0142', 'e.g. PO-2026-0142'),
      yourRef: L('Referensi Anda', 'Your reference'),
      optional: L('(opsional)', '(optional)'),
      refPh: L('Nama cabang atau pembeli', 'Branch or buyer name'),
      attachPo: L('Lampirkan dokumen PO', 'Attach PO document'),
      chooseFile: L('Pilih file', 'Choose a file'),
      dragHint: L('atau seret ke sini · PDF, JPG, atau PNG, maks. [X] MB', 'or drag it here · PDF, JPG or PNG, max [X] MB'),
      notes: L('Catatan untuk tim kami', 'Notes for our team'),
      notesPh: L('Jadwal pengiriman, permintaan pengemasan…', 'Delivery window, packing requests…'),
      delivery: L('Pengiriman', 'Delivery'),
      deliveryMethod: L('Metode pengiriman', 'Delivery method'),
      shipStore: L('Kirim ke toko saya', 'Ship to my store'),
      savedAddress: L('[Alamat toko tersimpan]', '[Saved store address]'),
      ownCourier: L('Kurir sendiri', 'Arrange my own courier'),
      ownCourierNote: L('Ambil di gudang kami; tanpa biaya kirim', 'Pick up from our warehouse; no shipping charge'),
      summaryAria: L('Ringkasan pesanan', 'Order summary'),
      summary: L('Ringkasan', 'Summary'),
      retailValue: L('Nilai harga retail', 'Retail value'),
      savings: L('Hemat sebagai reseller', 'Reseller savings'),
      subtotal: L('Subtotal (24 item)', 'Subtotal (24 items)'),
      shipping: L('Ongkir (Jawa)', 'Shipping (Java)'),
      free: L('Gratis', 'Free'),
      tax: L('PPN', 'VAT (PPN)'),
      taxValue: L('[Pajak]', '[Tax]'),
      total: L('Total', 'Total'),
      payment: L('Pembayaran', 'Payment'),
      payTransfer: L('Transfer bank sesuai invoice', 'Bank transfer on invoice'),
      payNet: L('Tempo [30] hari (akun yang disetujui)', 'Net [30] days (approved accounts)'),
      submit: L('Kirim purchase order', 'Submit purchase order'),
      footnote: L('Kami akan mengonfirmasi stok dan mengirim invoice proforma (PDF) ke email Anda. Pantau di Akun › Pesanan.', "We'll confirm stock and send a pro-forma invoice (PDF) to your email. Track it under Account › Orders.")
    };
    const items = [
      { title: "World's Best Dad", publisher: 'Penguin Random House', price: 183308, qty: 12, cover: '#1F3B73' },
      { title: 'Twinkle, Twinkle, Little Sheepy', publisher: 'Penguin Random House', price: 180000, qty: 6, cover: '#7FB7C9' },
      { title: L('[Item hadiah]', '[Gift item]'), publisher: 'Kikkerland', price: 150000, qty: 6, cover: '#3E7A5A' }
    ];
    let retail = 0, sub = 0;
    const lines = items.map((i) => {
      const unit = i.price * (1 - d / 100);
      retail += i.price * i.qty; sub += unit * i.qty;
      return { ...i, unit: fmt(unit), total: fmt(unit * i.qty) };
    });
    const langs = [{ id: 'id', label: 'ID' }, { id: 'en', label: 'EN' }].map((x) => ({
      label: x.label, on: lang === x.id, off: lang !== x.id, pick: () => this.setState({ lang: x.id })
    }));
    return { t, langs, lines, retailTotal: fmt(retail), savings: fmt(retail - sub), subtotal: fmt(sub) };
  }
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
