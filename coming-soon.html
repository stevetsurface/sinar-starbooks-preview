  </div>
</div>

    const month = st.month || 'nov';
    const months = [['nov', L('November 2026', 'November 2026')], ['dec', L('Desember 2026', 'December 2026')], ['jan', L('Januari 2027', 'January 2027')], ['all', L('Semua', 'All')]]
      .map(([id, label]) => ({ label, on: month === id, off: month !== id, pick: () => this.setState({ month: id }) }));
    const PRE = [L('PRE-ORDER TERBUKA', 'PRE-ORDER OPEN'), '#B0476A', L('Ikut pre-order', 'Join pre-order'), 'pre-order.html', '#5B2A86', '#FFFFFF'];
    const REM = [L('SEGERA TERBIT', 'COMING SOON'), '#5B2A86', L('Ingatkan saya', 'Remind me'), '#', '#F1EBF6', '#2A1640'];
    const raw = [
      { m: 'nov', title: 'Sapiens: A Graphic History Vol. 3', author: 'Yuval Noah Harari', publisher: 'Penguin Random House', date: L('3 Nov 2026', 'Nov 3, 2026'), format: 'Hardcover', retail: 450000, kind: PRE, blurb: L('Jilid penutup seri grafis. Jilid 1–2 terjual stabil di toko umum dan sekolah.', 'Closing volume of the graphic series. Vols 1–2 sell steadily in general shops and schools.') },
      { m: 'nov', title: 'The Anxious Generation', author: 'Jonathan Haidt', publisher: 'Penguin Random House', date: L('10 Nov 2026', 'Nov 10, 2026'), format: L('Paperback (edisi baru)', 'Paperback (new edition)'), retail: 280000, kind: PRE, blurb: L('Edisi paperback dari buku parenting terlaris 2024–25; permintaan dari sekolah dan orang tua.', 'Paperback of the 2024–25 parenting best seller; demand from schools and parents.') },
      { m: 'nov', title: 'The Convenience Store by the Sea', author: 'Sonoko Machida', publisher: 'Bloomsbury', date: L('17 Nov 2026', 'Nov 17, 2026'), format: 'Paperback', retail: 214000, kind: PRE, blurb: L('Fiksi Jepang hangat untuk pembaca Morisaki Bookshop dan Before the Coffee Gets Cold.', 'Cosy Japanese fiction for readers of Morisaki Bookshop and Before the Coffee Gets Cold.') },
      { m: 'nov', title: 'Good Material', author: 'Dolly Alderton', publisher: 'Knopf', date: L('[tgl] Nov 2026', '[date] Nov 2026'), format: 'Paperback', retail: 240000, kind: REM, blurb: L('Fiksi kontemporer; sering diminta lewat Minta buku.', 'Contemporary fiction; often requested via Request a book.') },
      { m: 'dec', title: 'Dog Man 14: Big Jim Believes', author: 'Dav Pilkey', publisher: 'Scholastic', date: L('[tgl] Des 2026', '[date] Dec 2026'), format: 'Hardcover', retail: 199000, kind: REM, blurb: L('Seri anak terlaris kami; jilid baru selalu habis di minggu pertama.', 'Our best-selling kids’ series; new volumes sell out in week one.') },
      { m: 'dec', title: 'The Let Them Theory', author: 'Mel Robbins', publisher: 'Hay House', date: L('[tgl] Des 2026', '[date] Dec 2026'), format: L('Edisi hadiah', 'Gift edition'), retail: 535000, kind: REM, blurb: L('Edisi hadiah menjelang akhir tahun; cocok untuk meja hadiah.', 'Gift edition for the year-end; suits gift tables.') },
      { m: 'dec', title: 'Wordsworth Pride and Prejudice', author: 'Jane Austen', publisher: 'Wordsworth', date: L('[tgl] Des 2026', '[date] Dec 2026'), format: L('Edisi koleksi', 'Collector’s edition'), retail: 95000, kind: REM, blurb: L('Klasik murah dengan sampul baru; margin bagus untuk sekolah dan hadiah.', 'Affordable classic with a new cover; good margin for schools and gifts.') },
      { m: 'jan', title: 'Katabasis', author: 'R.F. Kuang', publisher: 'Harper Voyager', date: L('[tgl] Jan 2027', '[date] Jan 2027'), format: 'Paperback', retail: 280000, kind: REM, blurb: L('Paperback dari hardcover yang pre-order-nya terkumpul 246 eks. bulan ini.', 'Paperback of the hardcover whose pre-order pooled 246 copies this month.') },
      { m: 'jan', title: 'Days at the Morisaki Bookshop', author: 'Satoshi Yagisawa', publisher: 'Manilla', date: L('[tgl] Jan 2027', '[date] Jan 2027'), format: L('Box set 1–2', 'Box set 1–2'), retail: 398000, kind: REM, blurb: L('Box set dua jilid; permintaan dari toko kurasi dan kafe.', 'Two-volume box set; demand from curated shops and cafés.') }
    ];
    const releases = raw.filter((r) => month === 'all' || r.m === month).map((r) => ({ ...r, ...coverOf(r.title), cover: '#4A3463', tag: r.kind[0], tagInk: r.kind[1], cta: r.kind[2], href: r.kind[3], ctaBg: r.kind[4], ctaInk: r.kind[5], price: fmt(r.retail * (1 - d / 100)), retail: fmt(r.retail) }));
    const listTitle = month === 'all' ? L('Semua rilis mendatang', 'All upcoming releases') : L('Terbit ' + months.find((x) => x.on).label, 'Releasing ' + months.find((x) => x.on).label) + ' · ' + releases.length + ' ' + L('judul', 'titles');
    const posts = [
      { bg: '#FDE9C4', kicker: L('KALENDER', 'CALENDAR'), title: L('Yang terbit November: 12 judul dan 3 pre-order gabungan', 'November releases: 12 titles and 3 pooled pre-orders'), body: L('Ringkasan per kategori, mana yang layak dipesan sekarang, dan mana yang bisa menunggu paperback.', 'By category, which to order now, and which can wait for the paperback.'), date: L('14 Okt 2026', 'Oct 14, 2026'), read: L('4 menit', '4 min') },
      { bg: '#E6DDF0', kicker: L('DATA', 'DATA'), title: L('Rekap IIBF 2026 untuk reseller: apa yang laku di meja mana', 'IIBF 2026 recap for resellers: what sold on which table'), body: L('Reseller 52% dari Rp 2,9 M; Tuesdays with Morrie 589 eks.; buku anak laris di baris kecil, bukan baris besar.', 'Resellers were 52% of Rp 2.9B; Tuesdays with Morrie 589 copies; kids’ books sold on the small lines, not the big ones.'), date: L('9 Okt 2026', 'Oct 9, 2026'), read: L('5 menit', '5 min') },
      { bg: '#DCEBF0', kicker: L('TREN', 'TRENDS'), title: L('BookTok Indonesia Oktober: 8 judul yang sedang dibicarakan', 'BookTok Indonesia October: 8 titles creators are talking about'), body: L('Dari 74 kreator yang kami pantau. Stok dan harga reseller di tiap judul.', 'From the 74 creators we follow. Stock and reseller price on each title.'), date: L('7 Okt 2026', 'Oct 7, 2026'), read: L('3 menit', '3 min') },
      { bg: '#DDEBDD', kicker: L('CARA', 'HOW-TO'), title: L('Cara menyusun meja rilis baru dengan anggaran Rp 2 juta', 'How to build a new-releases table on a Rp 2M budget'), body: L('Contoh dari tiga toko mitra, dengan daftar judulnya.', 'Examples from three partner shops, with their title lists.'), date: L('1 Okt 2026', 'Oct 1, 2026'), read: L('4 menit', '4 min') }
    ];
    const langs = [{ id: 'id', label: 'ID' }, { id: 'en', label: 'EN' }].map((x) => ({ label: x.label, on: lang === x.id, off: lang !== x.id, pick: () => this.setState({ lang: x.id }) }));
    return { t, langs, months, releases, listTitle, posts, nlDone: !!st.nlDone, nlNotDone: !st.nlDone, nlSubmit: () => this.setState({ nlDone: true }) };
  }
}
